<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Mükerrer Analizi</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --duplicate-border: #e74c3c;
            --duplicate-bg: #fdf2f2;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Ana Sayfa ile Birebir Uyumlu Üst Panel (Header) */
        header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Ana sayfadaki açılır menü (select) ve buton stilleri */
        .app-select, .app-btn {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .app-select:hover, .app-btn:hover {
            border-color: var(--primary-color);
        }

        .home-btn {
            background-color: #059669; /* Ana sayfadaki renk tonu */
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(5, 150, 105, 0.2);
            transition: background 0.2s, transform 0.2s;
        }

        .home-btn:hover {
            background-color: #047857;
            transform: translateY(-1px);
        }

        /* Kart Izgarası ve Tasarımı */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .vocab-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .vocab-card.is-duplicate {
            border-color: var(--duplicate-border) !important;
            background-color: var(--duplicate-bg);
        }

        .vocab-card.is-duplicate::after {
            content: "Tekrarlanan";
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--duplicate-border);
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .word-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #111827;
        }

        .word-translation {
            color: #4b5563;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .word-meta {
            font-size: 0.75rem;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
            padding-top: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <!-- Ana sayfadaki gibi şık açılır dosya/liste seçici -->
                <select id="fileSelect" class="app-select" onchange="onFileSelectChange(this.value)">
                    <!-- Dinamik olarak doldurulacak -->
                </select>
                <button class="app-btn" onclick="navigateFile(-1)">◀ Önceki</button>
                <button class="app-btn" onclick="navigateFile(1)">Sonraki ▶</button>
            </div>
            <div>
                <a href="index.html" class="home-btn">🏠 Ana Sayfa</a>
            </div>
        </header>

        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <script>
        let globalWordMap = {};
        let allDaysFiles = [];
        let currentIndex = 0;

        const defaultFiles = [
            'data/a100.json',
            'data/a101.json',
            'data/a102.json',
            'data/a103.json',
            'data/a104.json',
            'data/a105.json',
            'data/a106.json'
        ];

        async function initApp() {
            try {
                const manifestRes = await fetch('data/days.json');
                if (manifestRes.ok) {
                    const manifest = await manifestRes.json();
                    allDaysFiles = manifest.files || manifest.days || manifest;
                    if (!Array.isArray(allDaysFiles)) {
                        allDaysFiles = Object.values(manifest).flat();
                    }
                } else {
                    throw new Error("days.json bulunamadı");
                }
            } catch (error) {
                allDaysFiles = defaultFiles;
            }

            if (!allDaysFiles || allDaysFiles.length === 0) {
                allDaysFiles = defaultFiles;
            }

            try {
                await buildGlobalWordMap(allDaysFiles);
                populateFileDropdown(allDaysFiles);

                if (allDaysFiles.length > 0) {
                    currentIndex = 0;
                    loadDayData(allDaysFiles[0]);
                }
            } catch (error) {
                console.error("Başlangıç hatası:", error);
                document.getElementById('cardsContainer').innerHTML = 
                    `<p style="color:red; text-align:center; grid-column:1/-1;">Veriler yüklenemedi.</p>`;
            }
        }

        async function buildGlobalWordMap(files) {
            globalWordMap = {};

            for (const file of files) {
                try {
                    const res = await fetch(file);
                    if (!res.ok) continue;
                    
                    const dayData = await res.json();
                    const wordsList = dayData.words || dayData.vocabulary || dayData;

                    if (Array.isArray(wordsList)) {
                        wordsList.forEach(item => {
                            const wordKey = (item.word || item.term || "").trim().toLowerCase();
                            if (!wordKey) return;

                            if (!globalWordMap[wordKey]) {
                                globalWordMap[wordKey] = [];
                            }
                            if (!globalWordMap[wordKey].includes(file)) {
                                globalWordMap[wordKey].push(file);
                            }
                        });
                    }
                } catch (err) {
                    console.error(err);
                }
            }
        }

        function populateFileDropdown(files) {
            const select = document.getElementById('fileSelect');
            select.innerHTML = '';

            files.forEach((file, index) => {
                const fileName = file.split('/').pop().replace('.json', '').toUpperCase();
                const option = document.createElement('option');
                option.value = file;
                option.textContent = `Dosya / Liste: ${fileName}`;
                select.appendChild(option);
            });
        }

        function onFileSelectChange(file) {
            currentIndex = allDaysFiles.indexOf(file);
            loadDayData(file);
        }

        function navigateFile(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = allDaysFiles.length - 1;
            if (currentIndex >= allDaysFiles.length) currentIndex = 0;

            const targetFile = allDaysFiles[currentIndex];
            document.getElementById('fileSelect').value = targetFile;
            loadDayData(targetFile);
        }

        async function loadDayData(file) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#6b7280;">Yükleniyor...</p>';

            try {
                const res = await fetch(file);
                if (!res.ok) throw new Error(`${file} yüklenemedi`);

                const dayData = await res.json();
                const wordsList = dayData.words || dayData.vocabulary || dayData;

                container.innerHTML = '';

                if (Array.isArray(wordsList) && wordsList.length > 0) {
                    wordsList.forEach(item => {
                        const card = createVocabCard(item, file);
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#6b7280;">Bu dosyada kelime bulunamadı.</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p style="color:red; text-align:center; grid-column:1/-1;">Veri yüklenirken hata oluştu.</p>`;
            }
        }

        function createVocabCard(item, currentFile) {
            const wordKey = (item.word || item.term || "").trim().toLowerCase();
            const appearances = globalWordMap[wordKey] || [];
            const isDuplicate = appearances.length > 1;

            const cardDiv = document.createElement('div');
            cardDiv.className = `vocab-card ${isDuplicate ? 'is-duplicate' : ''}`;

            const wordText = item.word || item.term || '';
            const translationText = item.translation || item.meaning || '';

            cardDiv.innerHTML = `
                <div class="word-title">${wordText}</div>
                <div class="word-translation">${translationText}</div>
                <div class="word-meta">
                    Geçtiği Dosyalar: ${appearances.length > 0 ? appearances.join(', ') : currentFile}
                </div>
            `;

            return cardDiv;
        }

        initApp();
    </script>
</body>
</html>
