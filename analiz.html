<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Mükerrer Analizi - Tüm Seviyeler</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --duplicate-border: #ef4444;
            --duplicate-bg: #fef2f2;
            --info-bg: #eff6ff;
            --info-text: #1e40af;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .app-select, .app-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .app-select:hover, .app-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .action-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: #059669;
        }

        .home-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: background 0.2s, transform 0.2s;
        }

        .home-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .info-bar {
            background: var(--info-bg);
            color: var(--info-text);
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #bfdbfe;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .vocab-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e2e8f0;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        /* 1. YEŞİL: Özgün (Benzersiz) Kelime */
        .vocab-card.is-unique {
            border-color: #22c55e !important;
            background-color: #f0fdf4;
        }
        .vocab-card.is-unique .card-badge {
            background-color: #22c55e;
        }

        /* 2. MAVI: Tekrarlanıyor ama İlk Geçiş */
        .vocab-card.is-first-repeat {
            border-color: var(--primary-color) !important;
            background-color: #f8fafc;
        }
        .vocab-card.is-first-repeat .card-badge {
            background-color: var(--primary-color);
        }

        /* 3. KIRMIZI: 2. Geçiş, 3. Geçiş... (Sonraki Tekrarlar) */
        .vocab-card.is-duplicate {
            border-color: var(--duplicate-border) !important;
            background-color: var(--duplicate-bg);
        }
        .vocab-card.is-duplicate .card-badge {
            background-color: var(--duplicate-border);
        }

        .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .word-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #0f172a;
        }

        .word-translation {
            color: #475569;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .word-meta {
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <!-- Grup / Seviye Seçimi -->
                <select id="groupSelect" class="app-select" onchange="onGroupChange()">
                    <option value="all">Tüm</option>
                    <option value="a1">A1</option>
                    <option value="a2">A2</option>
                    <option value="b1">B1</option>
                    <option value="b2">B2</option>
                    <option value="c1">C1</option>
                    <option value="c2">C2</option>
                </select>

                <!-- Tek Dosya Seçimi -->
                <select id="fileSelect" class="app-select" onchange="onFileSelectChange(this.value)">
                    <option value="">Dosya Seç (Tek)</option>
                </select>

                <button class="app-btn" onclick="navigateFile(-1)">◀ Önceki</button>
                <button class="app-btn" onclick="navigateFile(1)">Sonraki ▶</button>
            </div>
            <div>
                <a href="index.html" class="home-btn">🏠 Ana Sayfa</a>
            </div>
        </header>

        <div id="infoBar" class="info-bar">
            <span>Dosya seçildi. Mükerrer renk analizi için analizi başlatabilirsiniz.</span>
            <button class="action-btn" onclick="startGlobalAnalysis()">✨ Analizi Başlat</button>
        </div>

        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <script>
        let globalWordMap = {};
        let allDaysFiles = [];
        let filteredFiles = [];
        let currentIndex = 0;
        let isAnalyzed = false;

        async function initApp() {
            try {
                allDaysFiles = [];
                const levelsConfig = [
                    { letter: 'a', level: 1 },
                    { letter: 'a', level: 2 },
                    { letter: 'b', level: 1 },
                    { letter: 'b', level: 2 },
                    { letter: 'c', level: 1 },
                    { letter: 'c', level: 2 }
                ];

                levelsConfig.forEach(cfg => {
                    for (let i = 0; i <= 50; i++) {
                        let groupNum = i < 10 ? '0' + i : '' + i;
                        let fileNum = cfg.level === 1 ? '1' + groupNum : '2' + groupNum;
                        allDaysFiles.push(`data/${cfg.letter}${fileNum}.json`);
                    }
                });

                filteredFiles = [...allDaysFiles];
                updateFileDropdown(filteredFiles);

                // Sayfa açıldığında doğrudan ilk dosyayı anında yükle
                if (filteredFiles.length > 0) {
                    currentIndex = 0;
                    loadDayData(filteredFiles[0]);
                }
            } catch (error) {
                console.error("Başlangıç hatası:", error);
            }
        }

        async function startGlobalAnalysis() {
            const infoBar = document.getElementById('infoBar');
            infoBar.innerHTML = `<span>⏳ Tüm dosyalar taranıyor, lütfen bekleyin...</span>`;
            
            globalWordMap = {};
            let validFilesCount = 0;

            for (const file of allDaysFiles) {
                try {
                    const res = await fetch(file);
                    if (!res.ok) continue; 
                    
                    validFilesCount++;
                    const dayData = await res.json();
                    const wordsList = dayData.words || dayData.vocabulary || dayData;

                    if (Array.isArray(wordsList)) {
                        wordsList.forEach(item => {
                            const wordKey = (item.word || item.term || "").trim().toLowerCase();
                            if (!wordKey) return;

                            if (!globalWordMap[wordKey]) {
                                globalWordMap[wordKey] = [];
                            }
                            if (!globalWordMap[wordKey].includes(file)) {
                                globalWordMap[wordKey].push(file);
                            }
                        });
                    }
                } catch (err) {}
            }

            isAnalyzed = true;
            infoBar.innerHTML = `
                <span>📁 Taranan Dosya: <b>${validFilesCount}</b></span>
                <span style="color:#059669; font-weight:bold;">✨ Mükerrer Analiz Tamamlandı</span>
            `;

            // Analiz bitince mevcut sayfayı güncellenmiş renklerle tekrar çiz
            if (filteredFiles.length > 0) {
                loadDayData(filteredFiles[currentIndex]);
            }
        }

        function updateFileDropdown(files) {
            const select = document.getElementById('fileSelect');
            select.innerHTML = '';

            files.forEach((file) => {
                const fileName = file.split('/').pop().replace('.json', '').toUpperCase();
                const option = document.createElement('option');
                option.value = file;
                option.textContent = `Dosya: ${fileName}`;
                select.appendChild(option);
            });
        }

        function onGroupChange() {
            const group = document.getElementById('groupSelect').value;
            
            if (group === 'all') {
                filteredFiles = [...allDaysFiles];
            } else {
                let targetLetter = group.charAt(0);
                let levelNum = group.charAt(1);
                
                filteredFiles = allDaysFiles.filter(file => {
                    const fileName = file.split('/').pop(); 
                    const isLetterMatch = fileName.startsWith(targetLetter);
                    const fileCode = fileName.replace('.json', ''); 
                    const isLevelMatch = levelNum === '1' ? fileCode[1] === '1' : fileCode[1] === '2';
                    return isLetterMatch && isLevelMatch;
                });
            }

            updateFileDropdown(filteredFiles);
            if (filteredFiles.length > 0) {
                currentIndex = 0;
                loadDayData(filteredFiles[0]);
            } else {
                document.getElementById('cardsContainer').innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#64748b;">Bu grupta dosya bulunamadı.</p>`;
            }
        }

        function onFileSelectChange(file) {
            if (!file) return;
            currentIndex = filteredFiles.indexOf(file);
            loadDayData(file);
        }

        function navigateFile(direction) {
            if (filteredFiles.length === 0) return;
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = filteredFiles.length - 1;
            if (currentIndex >= filteredFiles.length) currentIndex = 0;

            const targetFile = filteredFiles[currentIndex];
            document.getElementById('fileSelect').value = targetFile;
            loadDayData(targetFile);
        }

        async function loadDayData(file) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#64748b; padding: 20px;">Kelimeler yükleniyor...</p>';

            try {
                const res = await fetch(file);
                if (!res.ok) {
                    container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış veya boş.</p>';
                    return;
                }

                const dayData = await res.json();
                const wordsList = dayData.words || dayData.vocabulary || dayData;

                container.innerHTML = '';

                if (Array.isArray(wordsList) && wordsList.length > 0) {
                    wordsList.forEach(item => {
                        const card = createVocabCard(item, file);
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#64748b;">Bu dosyada kelime bulunamadı.</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış.</p>`;
            }
        }

        function createVocabCard(item, currentFile) {
            const wordKey = (item.word || item.term || "").trim().toLowerCase();
            const appearances = globalWordMap[wordKey] || [];
            const count = appearances.length;
            
            let cardClass = '';
            let badgeText = '';

            // Eğer analiz yapılmadıysa varsayılan görünüm
            if (!isAnalyzed || count === 0) {
                cardClass = '';
                badgeText = 'Normal';
            } else if (count === 1) {
                cardClass = 'is-unique';
                badgeText = 'Özgün';
            } else {
                const occurrenceIndex = appearances.indexOf(currentFile) + 1;

                if (occurrenceIndex === 1) {
                    cardClass = 'is-first-repeat';
                    badgeText = '1. Geçiş';
                } else {
                    cardClass = 'is-duplicate';
                    badgeText = `${occurrenceIndex}. Geçiş`;
                }
            }

            const cardDiv = document.createElement('div');
            cardDiv.className = `vocab-card ${cardClass}`;

            const wordText = item.word || item.term || '';
            const translationText = item.translation || item.meaning || '';

            cardDiv.innerHTML = `
                <div class="card-badge">${badgeText}</div>
                <div class="word-title">${wordText}</div>
                <div class="word-translation">${translationText}</div>
                <div class="word-meta">
                    ${isAnalyzed ? `Geçtiği Dosyalar (${count}): ${appearances.map(f => f.split('/').pop().replace('.json','')).join(', ')}` : 'Analiz bekleniyor...'}
                </div>
            `;

            return cardDiv;
        }

        initApp();
    </script>
</body>
</html>
