<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Mükerrer Analizi - Tüm Seviyeler</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        /* Üst Header Alanı (Ana Sayfa ile Birebir Mavi Konsept) */
        header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .panel-title {
            font-weight: bold;
            font-size: 15px;
            color: #1e293b;
            margin-right: 5px;
        }

        .app-select, .app-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            height: 36px;
            box-sizing: border-box;
        }

        .app-select:hover, .app-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Ana Sayfa Dönüş ve Çalıştır Butonları - Tamamen Mavi Ton */
        .action-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: background 0.2s, transform 0.2s;
            border: none;
            cursor: pointer;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Bilgi Banner Alanı */
        .info-banner {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .info-banner h2 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }

        .info-banner p {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }

        /* Sonuç Listesi Alanı */
        .results-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .file-badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 4px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header: Mavi Tonlu Ana Sayfa Butonu ve Kontroller -->
        <header>
            <div class="header-left">
                <span class="panel-title">Mükerrer Kelime Analizi</span>
                <select id="scopeSelect" class="app-select">
                    <option value="all">Tüm Dosyalar (A, B, C Seviyeleri)</option>
                </select>
                <button id="runBtn" class="action-btn" onclick="runAnalysis()">🔍 Analizi Çalıştır</button>
            </div>

            <div class="header-right">
                <a href="index.html" class="action-btn">🏠 Ana Sayfa</a>
            </div>
        </header>

        <!-- Bilgi Banner -->
        <div class="info-banner">
            <h2>Mükerrer Tarama Paneli</h2>
            <p>Birden fazla dosyada mükerrer (tekrar eden) geçen kelimeleri tespit edin ve hangi dosyalarda yer aldıklarını listeleyin.</p>
        </div>

        <!-- Sonuçlar Tablosu -->
        <div class="results-section">
            <div id="resultsContainer">
                <p style="color: #64748b; text-align: center; margin: 20px 0;">Analizi başlatmak için yukarıdaki "Analizi Çalıştır" butonuna tıklayın.</p>
            </div>
        </div>
    </div>

    <script>
        function getAllPossibleFiles() {
            let files = [];
            ['a', 'b', 'c'].forEach(letter => {
                for (let i = 0; i <= 50; i++) {
                    files.push(`data/${letter}${100 + i}.json`);
                }
                for (let i = 0; i <= 50; i++) {
                    files.push(`data/${letter}${200 + i}.json`);
                }
            });
            return files;
        }

        async function runAnalysis() {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<p style="color: #2563eb; text-align:center; font-weight: 500;">Tüm dosyalar taranıyor, lütfen bekleyin...</p>';

            const files = getAllPossibleFiles();
            let globalWordMap = {};

            for (const file of files) {
                try {
                    const res = await fetch(file);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const words = data.words || data.vocabulary || data;

                    if (Array.isArray(words)) {
                        words.forEach(item => {
                            const wordKey = (item.word || item.term || "").trim();
                            if (!wordKey) return;
                            const lowerKey = wordKey.toLowerCase();
                            if (!globalWordMap[lowerKey]) {
                                globalWordMap[lowerKey] = {
                                    originalWord: wordKey,
                                    files: []
                                };
                            }
                            if (!globalWordMap[lowerKey].files.includes(file)) {
                                globalWordMap[lowerKey].files.push(file);
                            }
                        });
                    }
                } catch (err) {}
            }

            // Sadece birden fazla dosyada geçenleri filtrele (mükerrer olanlar)
            const duplicates = Object.values(globalWordMap).filter(item => item.files.length > 1);

            if (duplicates.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#64748b;">Mükerrer kelime bulunamadı.</p>';
                return;
            }

            let html = `
                <p style="font-weight: 600; color: #334155; margin-bottom: 15px;">Toplam <b>${duplicates.length}</b> adet mükerrer kelime tespit edildi.</p>
                <table>
                    <thead>
                        <tr>
                            <th>Kelime</th>
                            <th>Geçtiği Dosyalar ve Sahne Sayısı</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            duplicates.sort((a, b) => b.files.length - a.files.length).forEach(item => {
                const fileBadges = item.files.map(f => {
                    const fname = f.split('/').pop().replace('.json', '').toUpperCase();
                    return `<span class="file-badge">${fname}</span>`;
                }).join(' ');

                html += `
                    <tr>
                        <td style="font-weight: bold; color: #b91c1c;">${item.originalWord}</td>
                        <td>${fileBadges}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
