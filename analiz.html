<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Mükerrer Analizi - Tüm Seviyeler</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --duplicate-border: #ef4444;
            --duplicate-bg: #fef2f2;
            --first-dup-border: #2563eb;
            --first-dup-bg: #eff6ff;
            --info-bg: #eff6ff;
            --info-text: #1e40af;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .app-select, .app-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 9px 14px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            height: 38px;
            box-sizing: border-box;
        }

        .app-select:hover, .app-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .run-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: background 0.2s, transform 0.2s;
        }

        .run-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .home-btn {
            background-color: #0f172a;
            color: white;
            padding: 0 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.2);
            transition: background 0.2s, transform 0.2s;
        }

        .home-btn:hover {
            background-color: #1e293b;
            transform: translateY(-1px);
        }

        .info-bar {
            background: var(--info-bg);
            color: var(--info-text);
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #bfdbfe;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .vocab-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e2e8f0;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        .vocab-card.is-first-duplicate {
            border-color: var(--first-dup-border) !important;
            background-color: var(--first-dup-bg);
        }

        .vocab-card.is-first-duplicate::after {
            content: "İlk Geçiş";
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--first-dup-border);
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .vocab-card.is-duplicate {
            border-color: var(--duplicate-border) !important;
            background-color: var(--duplicate-bg);
        }

        .vocab-card.is-duplicate::after {
            content: "Tekrarlanan";
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--duplicate-border);
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .word-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #0f172a;
        }

        .word-translation {
            color: #475569;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .word-meta {
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 8px;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <!-- Ana Kapsam Menüsü -->
                <select id="scopeSelect" class="app-select" onchange="onScopeChange(this.value)">
                    <option value="tumu">🌐 Tüm Dosyalar</option>
                    <option value="a1">📁 A1 Grubu (100 - 150)</option>
                    <option value="a2">📁 A2 Grubu (200 - 250)</option>
                    <option value="b1">📁 B1 Grubu (100 - 150)</option>
                    <option value="b2">📁 B2 Grubu (200 - 250)</option>
                    <option value="c1">📁 C1 Grubu (100 - 150)</option>
                    <option value="c2">📁 C2 Grubu (200 - 250)</option>
                    <option value="tek">📄 Tek Bir Dosya Seç</option>
                </select>

                <!-- Spesifik Tek Dosya Seçim Menüsü -->
                <select id="specificFileSelect" class="app-select hidden"></select>

                <button class="run-btn" onclick="startAnalysis()">🚀 Analizi Çalıştır</button>
            </div>

            <div class="header-right">
                <!-- Analiz Sonrası Dosya Gezinme ve Ana Sayfa -->
                <select id="fileSelect" class="app-select hidden" onchange="onFileSelectChange(this.value)"></select>
                <button id="prevBtn" class="app-btn hidden" onclick="navigateFile(-1)">◀ Önceki</button>
                <button id="nextBtn" class="app-btn hidden" onclick="navigateFile(1)">Sonraki ▶</button>
                <a href="index.html" class="home-btn">🏠 Ana Sayfa</a>
            </div>
        </header>

        <div id="infoBar" class="info-bar">
            <span>İstediğiniz kapsamı seçip <b>"Analizi Çalıştır"</b> butonuna tıklayın.</span>
        </div>

        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <script>
        let globalWordMap = {};
        let cardStatusMap = {};
        let activeFiles = [];
        let currentIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            populateSpecificFileDropdown();
        });

        function getAllPossibleFiles() {
            let files = [];
            ['a', 'b', 'c'].forEach(letter => {
                for (let i = 0; i <= 50; i++) {
                    files.push(`data/${letter}${100 + i}.json`);
                }
                for (let i = 0; i <= 50; i++) {
                    files.push(`data/${letter}${200 + i}.json`);
                }
            });
            return files;
        }

        function getFilesForGroup(letter, level) {
            let files = [];
            let base = (level === 1) ? 100 : 200;
            for (let i = 0; i <= 50; i++) {
                files.push(`data/${letter}${base + i}.json`);
            }
            return files;
        }

        function populateSpecificFileDropdown() {
            const select = document.getElementById('specificFileSelect');
            select.innerHTML = '';
            const allFiles = getAllPossibleFiles();
            allFiles.forEach(file => {
                const fileName = file.split('/').pop().replace('.json', '').toUpperCase();
                const option = document.createElement('option');
                option.value = file;
                option.textContent = `Dosya: ${fileName}`;
                select.appendChild(option);
            });
        }

        function onScopeChange(val) {
            const specificSelect = document.getElementById('specificFileSelect');
            if (val === 'tek') {
                specificSelect.classList.remove('hidden');
            } else {
                specificSelect.classList.add('hidden');
            }
        }

        async function startAnalysis() {
            const scopeVal = document.getElementById('scopeSelect').value;
            const allFiles = getAllPossibleFiles();
            
            if (scopeVal === 'tek') {
                const selectedFile = document.getElementById('specificFileSelect').value;
                // Tek dosya seçildiğinde de tüm dosyaları activeFiles yapıyoruz ki ilerleme (Önceki/Sonraki) çalışabilsin
                activeFiles = allFiles;
                currentIndex = activeFiles.indexOf(selectedFile);
                if (currentIndex === -1) currentIndex = 0;
            } else if (scopeVal === 'tumu') {
                activeFiles = allFiles;
                currentIndex = 0;
            } else if (scopeVal === 'a1') {
                activeFiles = getFilesForGroup('a', 1);
                currentIndex = 0;
            } else if (scopeVal === 'a2') {
                activeFiles = getFilesForGroup('a', 2);
                currentIndex = 0;
            } else if (scopeVal === 'b1') {
                activeFiles = getFilesForGroup('b', 1);
                currentIndex = 0;
            } else if (scopeVal === 'b2') {
                activeFiles = getFilesForGroup('b', 2);
                currentIndex = 0;
            } else if (scopeVal === 'c1') {
                activeFiles = getFilesForGroup('c', 1);
                currentIndex = 0;
            } else if (scopeVal === 'c2') {
                activeFiles = getFilesForGroup('c', 2);
                currentIndex = 0;
            }

            document.getElementById('infoBar').innerHTML = `<span>Analiz yapılıyor, lütfen bekleyin...</span>`;
            document.getElementById('cardsContainer').innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#64748b; padding: 20px;">Veriler taranıyor...</p>';

            await buildGlobalWordMap(allFiles);

            if (activeFiles.length > 0) {
                // Eğer grup seçildiyse ilgili grubun listesi, tek seçildiyse tüm liste dropdown'a dolar ancak seçilen dosya öne gelir
                populateFileDropdown(scopeVal === 'tek' ? allFiles : activeFiles);
                
                document.getElementById('fileSelect').classList.remove('hidden');
                document.getElementById('prevBtn').classList.remove('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');

                const targetFile = activeFiles[currentIndex];
                document.getElementById('fileSelect').value = targetFile;
                loadDayData(targetFile);
            } else {
                document.getElementById('cardsContainer').innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#64748b; padding: 20px;">Dosya bulunamadı.</p>';
            }
        }

        async function buildGlobalWordMap(files) {
            globalWordMap = {};
            cardStatusMap = {};
            let wordOccurrenceLists = {};
            let validFilesCount = 0;

            for (const file of files) {
                try {
                    const res = await fetch(file);
                    if (!res.ok) continue; 
                    
                    validFilesCount++;
                    const dayData = await res.json();
                    const wordsList = dayData.words || dayData.vocabulary || dayData;

                    if (Array.isArray(wordsList)) {
                        wordsList.forEach((item, index) => {
                            const wordKey = (item.word || item.term || "").trim().toLowerCase();
                            if (!wordKey) return;

                            if (!globalWordMap[wordKey]) {
                                globalWordMap[wordKey] = [];
                            }
                            if (!globalWordMap[wordKey].includes(file)) {
                                globalWordMap[wordKey].push(file);
                            }

                            if (!wordOccurrenceLists[wordKey]) {
                                wordOccurrenceLists[wordKey] = [];
                            }
                            wordOccurrenceLists[wordKey].push({ file, index });
                        });
                    }
                } catch (err) {
                    // Bulunamayan dosyaları geç
                }
            }

            for (const wordKey in wordOccurrenceLists) {
                const list = wordOccurrenceLists[wordKey];
                const total = list.length;
                list.forEach((occ, occurrenceIndex) => {
                    const uniqueKey = `${occ.file}_${occ.index}`;
                    cardStatusMap[uniqueKey] = {
                        total: total,
                        occurrenceIndex: occurrenceIndex
                    };
                });
            }

            document.getElementById('infoBar').innerHTML = `
                <span>📁 Sistemde Taranan Toplam Dosya: <b>${validFilesCount}</b></span>
                <span>✨ Mükerrer Analiz Tamamlandı</span>
            `;
        }

        function populateFileDropdown(files) {
            const select = document.getElementById('fileSelect');
            select.innerHTML = '';

            files.forEach((file) => {
                const fileName = file.split('/').pop().replace('.json', '').toUpperCase();
                const option = document.createElement('option');
                option.value = file;
                option.textContent = `Sahne / Dosya: ${fileName}`;
                select.appendChild(option);
            });
        }

        function onFileSelectChange(file) {
            currentIndex = activeFiles.indexOf(file);
            loadDayData(file);
        }

        function navigateFile(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = activeFiles.length - 1;
            if (currentIndex >= activeFiles.length) currentIndex = 0;

            const targetFile = activeFiles[currentIndex];
            document.getElementById('fileSelect').value = targetFile;
            loadDayData(targetFile);
        }

        async function loadDayData(file) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#64748b; padding: 20px;">Kelimeler yükleniyor...</p>';

            try {
                const res = await fetch(file);
                if (!res.ok) {
                    container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış veya boş.</p>`;
                    return;
                }

                const dayData = await res.json();
                const wordsList = dayData.words || dayData.vocabulary || dayData;

                container.innerHTML = '';

                if (Array.isArray(wordsList) && wordsList.length > 0) {
                    wordsList.forEach((item, index) => {
                        const uniqueKey = `${file}_${index}`;
                        const status = cardStatusMap[uniqueKey] || { total: 1, occurrenceIndex: 0 };
                        const card = createVocabCard(item, file, status);
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#64748b;">Bu dosyada kelime bulunamadı.</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış.</p>`;
            }
        }

        function createVocabCard(item, currentFile, status) {
            const wordKey = (item.word || item.term || "").trim().toLowerCase();
            const appearances = globalWordMap[wordKey] || [];
            
            let cardClass = '';
            
            if (status.total > 1) {
                if (status.occurrenceIndex === 0) {
                    cardClass = 'is-first-duplicate'; // Mavi (İlk Geçiş)
                } else {
                    cardClass = 'is-duplicate'; // Kırmızı (Tekrarlanan)
                }
            } else {
                cardClass = ''; // Beyaz (Tekil)
            }

            const cardDiv = document.createElement('div');
            cardDiv.className = `vocab-card ${cardClass}`;

            const wordText = item.word || item.term || '';
            const translationText = item.translation || item.meaning || '';

            cardDiv.innerHTML = `
                <div class="word-title">${wordText}</div>
                <div class="word-translation">${translationText}</div>
                <div class="word-meta">
                    Geçtiği Dosyalar (${appearances.length}): ${appearances.map(f => f.split('/').pop().replace('.json','')).join(', ')}
                </div>
            `;

            return cardDiv;
        }
    </script>
</body>
</html>
