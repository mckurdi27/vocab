<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime ve Soru Bankası - Mükerrer Analizi</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        /* Orijinal Header Alanı (Ana Sayfa ile Birebir Aynı Kontroller) */
        header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .panel-title {
            font-weight: bold;
            font-size: 15px;
            color: #1e293b;
            margin-right: 5px;
        }

        .app-select, .app-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            height: 36px;
            box-sizing: border-box;
        }

        .app-select:hover, .app-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Mavi Tonlu Butonlar */
        .action-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: background 0.2s, transform 0.2s;
            border: none;
            cursor: pointer;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Bilgi Banner Alanı */
        .info-banner {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .info-banner h2 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }

        .info-banner p {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }

        /* Sonuç Listesi Alanı */
        .results-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .file-badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 4px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header: Orijinal Seçimler, İleri-Geri Butonları ve Mavi Ana Sayfa Butonu -->
        <header>
            <div class="header-left">
                <span class="panel-title">Mükerrer Analiz Paneli</span>
                
                <select id="levelSelect" class="app-select" onchange="onLevelChange()">
                    <option value="all">Tüm Kelimeler / Tüm Seviyeler</option>
                    <option value="a1">A1 Seviyesi</option>
                    <option value="a2">A2 Seviyesi</option>
                    <option value="b1">B1 Seviyesi</option>
                    <option value="b2">B2 Seviyesi</option>
                    <option value="c1">C1 Seviyesi</option>
                    <option value="c2">C2 Seviyesi</option>
                </select>

                <select id="fileSelect" class="app-select"></select>

                <button id="prevBtn" class="app-btn" onclick="navigateFile(-1)">◀ Önceki</button>
                <button id="nextBtn" class="app-btn" onclick="navigateFile(1)">Sonraki ▶</button>

                <button class="action-btn" onclick="runAnalysis()">🔍 Analizi Çalıştır</button>
            </div>

            <div class="header-right">
                <a href="index.html" class="action-btn">🏠 Ana Sayfa</a>
            </div>
        </header>

        <!-- Bilgi Banner -->
        <div class="info-banner">
            <h2>Mükerrer Kelime Tarama</h2>
            <p>Seçtiğiniz kapsama göre kelimelerin hangi dosyalarda tekrar ettiğini detaylıca inceleyin.</p>
        </div>

        <!-- Sonuçlar Tablosu -->
        <div class="results-section">
            <div id="resultsContainer">
                <p style="color: #64748b; text-align: center; margin: 20px 0;">Analizi başlatmak için yukarıdaki "Analizi Çalıştır" butonuna tıklayın.</p>
            </div>
        </div>
    </div>

    <script>
        let currentFileList = [];
        let currentFileIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            updateFileList();
        });

        function getAllPossibleFiles() {
            let files = [];
            ['a', 'b', 'c'].forEach(letter => {
                for (let i = 0; i <= 50; i++) {
                    files.push(`data/${letter}${100 + i}.json`);
                }
                for (let i = 0; i <= 50; i++) {
                    files.push(`data/${letter}${200 + i}.json`);
                }
            });
            return files;
        }

        function updateFileList() {
            const level = document.getElementById('levelSelect').value;
            const select = document.getElementById('fileSelect');
            select.innerHTML = '';

            if (level === 'all') {
                const option = document.createElement('option');
                option.value = 'all';
                option.textContent = 'Tüm Dosyalar Taranacak';
                select.appendChild(option);
                select.disabled = true;
                return;
            }

            select.disabled = false;
            let prefix = 'a';
            let baseNum = 100;

            if (level === 'a1') { prefix = 'a'; baseNum = 100; }
            else if (level === 'a2') { prefix = 'a'; baseNum = 200; }
            else if (level === 'b1') { prefix = 'b'; baseNum = 100; }
            else if (level === 'b2') { prefix = 'b'; baseNum = 200; }
            else if (level === 'c1') { prefix = 'c'; baseNum = 100; }
            else if (level === 'c2') { prefix = 'c'; baseNum = 200; }

            currentFileList = [];
            for (let i = 0; i <= 50; i++) {
                currentFileList.push(`data/${prefix}${baseNum + i}.json`);
            }

            currentFileList.forEach((file) => {
                const fileName = file.split('/').pop().replace('.json', '').toUpperCase();
                const option = document.createElement('option');
                option.value = file;
                option.textContent = `Dosya (${fileName.toLowerCase()})`;
                select.appendChild(option);
            });

            currentFileIndex = 0;
        }

        function onLevelChange() {
            updateFileList();
        }

        function navigateFile(direction) {
            const select = document.getElementById('fileSelect');
            if (select.disabled || currentFileList.length === 0) return;

            currentFileIndex += direction;
            if (currentFileIndex < 0) currentFileIndex = currentFileList.length - 1;
            if (currentFileIndex >= currentFileList.length) currentFileIndex = 0;

            select.selectedIndex = currentFileIndex;
        }

        async function runAnalysis() {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<p style="color: #2563eb; text-align:center; font-weight: 500;">Dosyalar taranıyor, lütfen bekleyin...</p>';

            const level = document.getElementById('levelSelect').value;
            const selectedFile = document.getElementById('fileSelect').value;

            let filesToScan = [];
            if (level === 'all') {
                filesToScan = getAllPossibleFiles();
            } else if (selectedFile) {
                filesToScan = [selectedFile];
            } else {
                filesToScan = currentFileList;
            }

            let globalWordMap = {};

            for (const file of filesToScan) {
                try {
                    const res = await fetch(file);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const words = data.words || data.vocabulary || data;

                    if (Array.isArray(words)) {
                        words.forEach(item => {
                            const wordKey = (item.word || item.term || "").trim();
                            if (!wordKey) return;
                            const lowerKey = wordKey.toLowerCase();
                            if (!globalWordMap[lowerKey]) {
                                globalWordMap[lowerKey] = {
                                    originalWord: wordKey,
                                    files: []
                                };
                            }
                            if (!globalWordMap[lowerKey].files.includes(file)) {
                                globalWordMap[lowerKey].files.push(file);
                            }
                        });
                    }
                } catch (err) {}
            }

            // Sadece birden fazla dosyada geçenler (veya seçilen tek dosya modundakiler)
            let duplicates = Object.values(globalWordMap);
            if (level === 'all') {
                duplicates = duplicates.filter(item => item.files.length > 1);
            }

            if (duplicates.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#64748b;">Kriterlere uygun kelime bulunamadı.</p>';
                return;
            }

            let html = `
                <p style="font-weight: 600; color: #334155; margin-bottom: 15px;">Toplam <b>${duplicates.length}</b> adet kelime listelendi.</p>
                <table>
                    <thead>
                        <tr>
                            <th>Kelime</th>
                            <th>Geçtiği Dosyalar</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            duplicates.sort((a, b) => b.files.length - a.files.length).forEach(item => {
                const fileBadges = item.files.map(f => {
                    const fname = f.split('/').pop().replace('.json', '').toUpperCase();
                    return `<span class="file-badge">${fname}</span>`;
                }).join(' ');

                html += `
                    <tr>
                        <td style="font-weight: bold; color: #b91c1c;">${item.originalWord}</td>
                        <td>${fileBadges}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
