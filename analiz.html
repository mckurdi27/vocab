<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Mükerrer Analizi</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --duplicate-border: #e74c3c;
            --duplicate-bg: #fdf2f2;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .header-title h1 {
            margin: 0 0 5px 0;
            font-size: 1.35rem;
            color: #111827;
        }

        .header-title p {
            color: #6b7280;
            margin: 0;
            font-size: 0.9rem;
        }

        .home-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
            transition: background 0.2s, transform 0.2s;
        }

        .home-btn:hover {
            background-color: #4338ca;
            transform: translateY(-1px);
        }

        .day-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .day-btn {
            padding: 8px 16px;
            border: none;
            background-color: #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }

        .day-btn.active, .day-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .vocab-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .vocab-card.is-duplicate {
            border-color: var(--duplicate-border) !important;
            background-color: var(--duplicate-bg);
        }

        .vocab-card.is-duplicate::after {
            content: "Tekrarlanan";
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--duplicate-border);
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .word-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #111827;
        }

        .word-translation {
            color: #4b5563;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .word-meta {
            font-size: 0.75rem;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
            padding-top: 8px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>Kelime Öğrenme Asistanı</h1>
                <p>Günler Arası Mükerrer Kelime Takip Sistemi</p>
            </div>
            <a href="index.html" class="home-btn">🏠 Ana Sayfa</a>
        </header>

        <div id="daySelector" class="day-selector"></div>
        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <script>
        let globalWordMap = {};
        
        let allDaysFiles = [
            'data/a100.json',
            'data/a101.json',
            'data/a102.json',
            'data/a103.json',
            'data/a104.json',
            'data/a105.json',
            'data/a106.json'
        ];

        async function initApp() {
            try {
                await buildGlobalWordMap(allDaysFiles);
                renderDaySelector(allDaysFiles);

                if (allDaysFiles.length > 0) {
                    loadDayData(allDaysFiles[0]);
                }
            } catch (error) {
                console.error("Başlangıç hatası:", error);
                document.getElementById('cardsContainer').innerHTML = 
                    `<p style="color:red; text-align:center; grid-column:1/-1;">Veriler yüklenemedi. Lütfen dosya yollarını kontrol edin.</p>`;
            }
        }

        async function buildGlobalWordMap(files) {
            globalWordMap = {};

            for (const file of files) {
                try {
                    const res = await fetch(file);
                    if (!res.ok) throw new Error(`${file} yüklenemedi`);
                    
                    const dayData = await res.json();
                    const wordsList = dayData.words || dayData;

                    wordsList.forEach(item => {
                        const wordKey = (item.word || item.term || "").trim().toLowerCase();
                        if (!wordKey) return;

                        if (!globalWordMap[wordKey]) {
                            globalWordMap[wordKey] = [];
                        }
                        if (!globalWordMap[wordKey].includes(file)) {
                            globalWordMap[wordKey].push(file);
                        }
                    });
                } catch (err) {
                    console.error(err);
                }
            }
        }

        function renderDaySelector(files) {
            const selector = document.getElementById('daySelector');
            selector.innerHTML = '';

            files.forEach((file, index) => {
                const fileName = file.split('/').pop().replace('.json', '');
                const btn = document.createElement('button');
                btn.className = `day-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = `Liste ${fileName.toUpperCase()}`;
                btn.onclick = () => {
                    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadDayData(file);
                };
                selector.appendChild(btn);
            });
        }

        async function loadDayData(file) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#6b7280;">Yükleniyor...</p>';

            try {
                const res = await fetch(file);
                if (!res.ok) throw new Error(`${file} yüklenemedi`);

                const dayData = await res.json();
                const wordsList = dayData.words || dayData;

                container.innerHTML = '';

                wordsList.forEach(item => {
                    const card = createVocabCard(item, file);
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(`${file} yüklenemedi:`, err);
                container.innerHTML = `<p style="color:red; text-align:center; grid-column:1/-1;">Dosya verileri yüklenirken hata oluştu.</p>`;
            }
        }

        function createVocabCard(item, currentFile) {
            const wordKey = (item.word || item.term || "").trim().toLowerCase();
            const appearances = globalWordMap[wordKey] || [];
            const isDuplicate = appearances.length > 1;

            const cardDiv = document.createElement('div');
            cardDiv.className = `vocab-card ${isDuplicate ? 'is-duplicate' : ''}`;

            const wordText = item.word || item.term || '';
            const translationText = item.translation || item.meaning || '';

            cardDiv.innerHTML = `
                <div class="word-title">${wordText}</div>
                <div class="word-translation">${translationText}</div>
                <div class="word-meta">
                    Geçtiği Dosyalar: ${appearances.length > 0 ? appearances.join(', ') : currentFile}
                </div>
            `;

            return cardDiv;
        }

        initApp();
    </script>
</body>
</html>
