<script src="app.js"></script>
<script>
    let globalWordFileMap = {};
    
    // Projenizdeki dosya adlandırma standardına göre olası tüm dosyaları listeleyen fonksiyon.
    // Örnek olarak a101, a102... veya a1_day1 gibi yapıları buraya ekleyebilirsiniz.
    function getAllPossibleFiles() {
        let files = [];
        // Örnek seviyeler ve dosya numaraları (Kendi dosya yapınıza göre burayı çoğaltabilirsiniz)
        const levels = ['a1', 'a2', 'b1', 'b2', 'c1', 'c2'];
        
        // Eğer dosyalarınız a101.json, a102.json şeklinde gidiyorsa:
        // Her seviye için ilgili dosya yollarını üretiyoruz
        levels.forEach(lvl => {
            // Örneğin her seviye için 1'den 50'ye kadar dosya olduğunu varsayalım (veya kendi liste mantığınız)
            for (let i = 1; i <= 50; i++) {
                // Dosya adınızın formatı neyse burayı ona göre ayarlayın (Örn: `${lvl}${i}.json` veya `json/${lvl}_day${i}.json`)
                files.push(`${lvl}${i}.json`);
            }
        });
        
        return files;
    }

    // Seviye seçildiğinde ilgili gün/dosya seçeneklerini dolduran fonksiyon
    function generateDayOptions() {
        const levelSelect = document.getElementById('levelSelect');
        const daySelect = document.getElementById('daySelect');
        if (!levelSelect || !daySelect) return;

        const selectedLevel = levelSelect.value.toLowerCase();
        daySelect.innerHTML = '';

        // O seviyeye ait dosyaları filtrele (Örn: a1 ile başlayanlar)
        const allFiles = getAllPossibleFiles();
        const levelFiles = allFiles.filter(file => file.toLowerCase().includes(selectedLevel));

        if (levelFiles.length === 0) {
            // Eğer otomatik liste boş kalırsa yedek bir seçenek ekle
            const opt = document.createElement('option');
            opt.value = `${selectedLevel}101.json`;
            opt.textContent = `${selectedLevel.toUpperCase()} - 101. Dosya`;
            daySelect.appendChild(opt);
        } else {
            levelFiles.forEach((file, index) => {
                const opt = document.createElement('option');
                opt.value = file;
                // Dosya adından görünen isim türetme (Örn: a101.json -> A101)
                const fileNameClean = file.split('/').pop().replace('.json', '').toUpperCase();
                opt.textContent = `Sahne / Dosya: ${fileNameClean}`;
                daySelect.appendChild(opt);
            });
        }

        // Seçim yapıldıktan sonra verileri yükle
        loadData();
    }

    // Dosya listesinde bir sonraki öğeye geçiş
    function nextFile() {
        const select = document.getElementById('daySelect');
        if (select && select.selectedIndex < select.options.length - 1) {
            select.selectedIndex++;
            loadData();
        }
    }

    // Dosya listesinde bir önceki öğeye geçiş
    function prevFile() {
        const select = document.getElementById('daySelect');
        if (select && select.selectedIndex > 0) {
            select.selectedIndex--;
            loadData();
        }
    }

    // Tüm dosyaları tarayıp kelimelerin kronolojik sıralamasını çıkaran haritalama fonksiyonu
    async function buildGlobalWordMap() {
        const files = getAllPossibleFiles();
        globalWordFileMap = {};

        for (const file of files) {
            try {
                const res = await fetch(file);
                if (!res.ok) continue;
                const data = await res.json();
                const words = data.words || data.vocabulary || data;

                if (Array.isArray(words)) {
                    words.forEach(item => {
                        const wordKey = (item.word || item.term || "").trim();
                        if (!wordKey) return;
                        const lowerKey = wordKey.toLowerCase();
                        
                        if (!globalWordFileMap[lowerKey]) {
                            globalWordFileMap[lowerKey] = [];
                        }
                        if (!globalWordFileMap[lowerKey].includes(file)) {
                            globalWordFileMap[lowerKey].push(file);
                        }
                    });
                }
            } catch (err) {}
        }
    }

    // Veriyi ve kelimelerin 3 aşamalı renk / sayım mantığını işleyip ekrana basan fonksiyon
    async function loadData() {
        const select = document.getElementById('daySelect');
        if (!select || !select.value) return;
        const file = select.value;
        const contentDiv = document.getElementById('content');
        const bannerDiv = document.getElementById('sceneBanner');

        contentDiv.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#64748b;">Yükleniyor...</p>';

        try {
            const res = await fetch(file);
            if (!res.ok) {
                contentDiv.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#94a3b8;">Bu dosya henüz oluşturulmamış.</p>';
                if (bannerDiv) bannerDiv.innerHTML = '<h3>Dosya Bulunamadı</h3><div class="scene-meta">Toplam Kelime: 0</div>';
                return;
            }

            const data = await res.json();
            const fileNameStr = file.split('/').pop().replace('.json', '').toUpperCase();
            const wordsList = data.words || data.vocabulary || data;

            // Global harita boşsa arka planda oluştur
            if (Object.keys(globalWordFileMap).length === 0) {
                await buildGlobalWordMap();
            }

            let htmlContent = '';

            if (Array.isArray(wordsList)) {
                wordsList.forEach(item => {
                    const wordKey = (item.word || item.term || "").trim();
                    const lowerKey = wordKey.toLowerCase();
                    const fileList = globalWordFileMap[lowerKey] || [file];
                    const count = fileList.length;

                    let cardClass = 'word-card';
                    let badgeHtml = '';

                    if (count === 1) {
                        // 1. Özgün Kelime -> Yeşil Tema
                        cardClass += ' unique-word';
                        badgeHtml = '<span class="status-badge">Özgün</span>';
                    } else {
                        // Kelimenin bu listede kaçıncı defa geçtiğini buluyoruz (1 tabanlı indeks)
                        const occurrenceIndex = fileList.indexOf(file) + 1;

                        if (occurrenceIndex === 1) {
                            // 2. Tekrarlı ama İlk Geçiş -> Mavi Tema
                            cardClass += ' repeat-first';
                            badgeHtml = '<span class="status-badge">İlk Geçiş</span>';
                        } else {
                            // 3. Sonraki Geçişler (2, 3, 4...) -> Kırmızı Tema ve Kaçıncı Geçiş Olduğu
                            cardClass += ' repeat-later';
                            badgeHtml = `<span class="status-badge">${occurrenceIndex}. Geçiş</span>`;
                        }
                    }

                    htmlContent += `
                        <div class="${cardClass}">
                            ${badgeHtml}
                            <strong>${item.word || item.term}</strong>
                            <p style="margin: 8px 0 0 0; color: #64748b; font-size: 0.9rem;">${item.meaning || item.definition || ''}</p>
                        </div>
                    `;
                });
            }

            contentDiv.innerHTML = htmlContent;
            if (bannerDiv) {
                bannerDiv.innerHTML = `<h3>Sahne / Dosya: ${fileNameStr}</h3><div class="scene-meta">Toplam Kelime: ${wordsList.length}</div>`;
            }

        } catch (err) {
            contentDiv.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#ef4444;">Veriler yüklenirken hata oluştu.</p>';
        }
    }

    // Sayfa ilk açıldığında seçenekleri otomatik oluştur
    window.onload = function() {
        generateDayOptions();
    };
</script>
