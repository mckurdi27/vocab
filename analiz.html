<script>
    let globalWordMap = {};
    let allDaysFiles = [];
    let filteredFiles = [];
    let currentIndex = 0;
    let isAnalyzed = false;

    async function initApp() {
        try {
            allDaysFiles = [];
            const levelsConfig = [
                { letter: 'a', level: 1 },
                { letter: 'a', level: 2 },
                { letter: 'b', level: 1 },
                { letter: 'b', level: 2 },
                { letter: 'c', level: 1 },
                { letter: 'c', level: 2 }
            ];

            levelsConfig.forEach(cfg => {
                for (let i = 0; i <= 50; i++) {
                    let groupNum = i < 10 ? '0' + i : '' + i;
                    let fileNum = cfg.level === 1 ? '1' + groupNum : '2' + groupNum;
                    allDaysFiles.push(`data/${cfg.letter}${fileNum}.json`);
                }
            });

            filteredFiles = [...allDaysFiles];
            updateFileDropdown(filteredFiles);

            if (filteredFiles.length > 0) {
                currentIndex = 0;
                loadDayData(filteredFiles[0]);
            }
        } catch (error) {
            console.error("Başlangıç hatası:", error);
        }
    }

    async function startGlobalAnalysis() {
        const infoBar = document.getElementById('infoBar');
        infoBar.innerHTML = `<span>⏳ Tüm dosyalar taranıyor, lütfen bekleyin...</span>`;
        
        globalWordMap = {};
        let validFilesCount = 0;

        for (const file of allDaysFiles) {
            try {
                const res = await fetch(file);
                if (!res.ok) continue; 
                
                validFilesCount++;
                const dayData = await res.json();
                const wordsList = dayData.words || dayData.vocabulary || dayData;

                if (Array.isArray(wordsList)) {
                    wordsList.forEach((item, index) => {
                        const wordKey = (item.word || item.term || "").trim().toLowerCase();
                        if (!wordKey) return;

                        if (!globalWordMap[wordKey]) {
                            globalWordMap[wordKey] = [];
                        }
                        globalWordMap[wordKey].push({ file: file, index: index, item: item });
                    });
                }
            } catch (err) {}
        }

        isAnalyzed = true;
        infoBar.innerHTML = `
            <span>📁 Taranan Dosya: <b>${validFilesCount}</b> — <span style="color:#059669; font-weight:bold;">Mükerrer Analiz Tamamlandı</span></span>
            <button class="action-btn" onclick="startGlobalAnalysis()">✨ Tekrar Başlat</button>
        `;

        if (filteredFiles.length > 0) {
            loadDayData(filteredFiles[currentIndex]);
        }
    }

    function updateFileDropdown(files) {
        const select = document.getElementById('fileSelect');
        select.innerHTML = '<option value="" disabled selected>Tek</option>';

        files.forEach((file) => {
            const fileName = file.split('/').pop().replace('.json', '').toUpperCase();
            const option = document.createElement('option');
            option.value = file;
            option.textContent = `Dosya: ${fileName}`;
            select.appendChild(option);
        });
    }

    function onGroupChange() {
        const group = document.getElementById('groupSelect').value;
        
        if (group === 'all') {
            filteredFiles = [...allDaysFiles];
        } else {
            let targetLetter = group.charAt(0);
            let levelNum = group.charAt(1);
            
            filteredFiles = allDaysFiles.filter(file => {
                const fileName = file.split('/').pop(); 
                const isLetterMatch = fileName.startsWith(targetLetter);
                const fileCode = fileName.replace('.json', ''); 
                const isLevelMatch = levelNum === '1' ? fileCode[1] === '1' : fileCode[1] === '2';
                return isLetterMatch && isLevelMatch;
            });
        }

        updateFileDropdown(filteredFiles);
        if (filteredFiles.length > 0) {
            currentIndex = 0;
            loadDayData(filteredFiles[0]);
        } else {
            document.getElementById('cardsContainer').innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#64748b;">Bu grupta dosya bulunamadı.</p>`;
        }
    }

    function onFileSelectChange(file) {
        if (!file) return;
        currentIndex = filteredFiles.indexOf(file);
        loadDayData(file);
    }

    function navigateFile(direction) {
        if (filteredFiles.length === 0) return;
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = filteredFiles.length - 1;
        if (currentIndex >= filteredFiles.length) currentIndex = 0;

        const targetFile = filteredFiles[currentIndex];
        document.getElementById('fileSelect').value = targetFile;
        loadDayData(targetFile);
    }

    async function loadDayData(file) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#64748b; padding: 20px;">Kelimeler yükleniyor...</p>';

        try {
            const res = await fetch(file);
            if (!res.ok) {
                container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış veya boş.</p>`;
                return;
            }

            const dayData = await res.json();
            const wordsList = dayData.words || dayData.vocabulary || dayData;

            container.innerHTML = '';

            if (Array.isArray(wordsList) && wordsList.length > 0) {
                wordsList.forEach((item, index) => {
                    const card = createVocabCard(item, file, index);
                    container.appendChild(card);
                });
                
                if (wordsList[0]) {
                    showWordDetail(wordsList[0], file, 0);
                }
            } else {
                container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#64748b;">Bu dosyada kelime bulunamadı.</p>`;
            }
        } catch (err) {
            container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış.</p>`;
        }
    }

    function createVocabCard(item, currentFile, itemIndex) {
        const wordKey = (item.word || item.term || "").trim().toLowerCase();
        const appearances = globalWordMap[wordKey] || [];
        const count = appearances.length;
        
        let cardClass = '';
        let badgeText = '';

        if (!isAnalyzed || count === 0) {
            cardClass = '';
            badgeText = 'Normal';
        } else if (count === 1) {
            cardClass = 'is-unique';
            badgeText = 'Özgün';
        } else {
            const occurrenceObjIndex = appearances.findIndex(app => app.file === currentFile && app.index === itemIndex);
            const occurrenceIndex = occurrenceObjIndex !== -1 ? occurrenceObjIndex + 1 : 1;

            if (occurrenceIndex === 1) {
                cardClass = 'is-first-repeat';
                badgeText = '1. Geçiş';
            } else {
                cardClass = 'is-duplicate';
                badgeText = `${occurrenceIndex}. Geçiş`;
            }
        }

        const cardDiv = document.createElement('div');
        cardDiv.className = `vocab-card ${cardClass}`;
        cardDiv.onclick = () => {
            document.querySelectorAll('.vocab-card').forEach(c => c.classList.remove('active-card'));
            cardDiv.classList.add('active-card');
            showWordDetail(item, currentFile, itemIndex);
        };

        const wordText = item.word || item.term || '';
        const translationText = item.translation || item.meaning || item.turkish || '';
        const uniqueFiles = [...new Set(appearances.map(app => app.file))];

        cardDiv.innerHTML = `
            <div class="card-badge">${badgeText}</div>
            <div class="word-title">${wordText}</div>
            <div class="word-translation">${translationText}</div>
            <div class="word-meta">
                ${isAnalyzed ? `Geçtiği Dosyalar (${uniqueFiles.length}): ${uniqueFiles.map(f => f.split('/').pop().replace('.json','')).join(', ')}` : 'Analiz bekleniyor...'}
            </div>
        `;

        return cardDiv;
    }

    async function showWordDetail(item, currentFile, itemIndex) {
        const wordText = (item.word || item.term || '').trim();
        const wordKey = wordText.toLowerCase();
        const translationText = item.translation || item.meaning || item.turkish || '';
        const wordType = item.type || item.partOfSpeech || 'Kelime';

        // CEFR Seviyesini Dosya Adından Otomatik Algılama (örn: a101.json -> A1)
        const fileName = currentFile.split('/').pop().toLowerCase();
        let cefrLevel = item.level || item.cefr || '';
        if (!cefrLevel && fileName) {
            const match = fileName.match(/([a-c][1-2])/i);
            if (match) cefrLevel = match[1].toUpperCase();
        }

        document.getElementById('detailTitle').textContent = wordText;
        document.getElementById('detailTranslation').textContent = `${translationText} (${wordType}) ${cefrLevel ? '• CEFR ' + cefrLevel : ''}`;

        // Görseller İçin Dinamik Doğru Resim Yolu Entegrasyonu
        const imageContainer = document.getElementById('detailImageContainer');
        const imageUrl = `https://image.pollinations.ai/prompt/a%20clear%20photo%20of%20a%20${encodeURIComponent(wordKey)}?width=600&height=400&nologo=true`;
        imageContainer.innerHTML = `<img src="${imageUrl}" alt="${wordText}" onerror="this.src='https://loremflickr.com/600/400/${encodeURIComponent(wordKey)}'">`;

        const detailMetaBox = document.getElementById('detailMetaBox');
        detailMetaBox.innerHTML = `<i>⏳ "${wordText}" için canlı veriler internetten yükleniyor...</i>`;

        const appearances = globalWordMap[wordKey] || [];
        const uniqueFiles = [...new Set(appearances.map(app => app.file))];

        const localVerbs = item.verbs || item.collocations || item.usableVerbs || item.relatedVerbs || [];
        const localRelWords = item.relatedWords || item.synonyms || item.related || [];

        let apiPhonetic = '';
        let apiAudioUrl = '';
        let apiSynonyms = [];
        let apiAntonyms = [];
        let apiExamples = [];

        // İnternetten Canlı Sözlük Verisi Çekme (Free Dictionary API)
        try {
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(wordKey)}`);
            if (response.ok) {
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    const entry = data[0];
                    
                    if (entry.phonetic) apiPhonetic = entry.phonetic;
                    if (entry.phonetics && entry.phonetics.length > 0) {
                        const audioObj = entry.phonetics.find(p => p.audio && p.audio.trim() !== '');
                        if (audioObj) apiAudioUrl = audioObj.audio;
                        if (!apiPhonetic) {
                            const phonObj = entry.phonetics.find(p => p.text);
                            if (phonObj) apiPhonetic = phonObj.text;
                        }
                    }

                    if (entry.meanings && Array.isArray(entry.meanings)) {
                        entry.meanings.forEach(m => {
                            if (m.synonyms) apiSynonyms.push(...m.synonyms);
                            if (m.antonyms) apiAntonyms.push(...m.antonyms);
                            if (m.definitions && Array.isArray(m.definitions)) {
                                m.definitions.forEach(d => {
                                    if (d.example) apiExamples.push(d.example);
                                    if (d.synonyms) apiSynonyms.push(...d.synonyms);
                                    if (d.antonyms) apiAntonyms.push(...d.antonyms);
                                });
                            }
                        });
                    }
                }
            }
        } catch (err) {
            console.warn("Canlı API verisi alınamadı:", err);
        }

        apiSynonyms = [...new Set(apiSynonyms)].slice(0, 5);
        apiAntonyms = [...new Set(apiAntonyms)].slice(0, 5);
        apiExamples = [...new Set(apiExamples)].slice(0, 3);

        let metaHtml = `<b>Türkçe Anlamı:</b> ${translationText}<br>`;
        metaHtml += `<b>Kelime Türü:</b> ${wordType}<br>`;
        if (cefrLevel) metaHtml += `<b>CEFR Seviyesi:</b> ${cefrLevel}<br>`;

        if (apiPhonetic || apiAudioUrl) {
            metaHtml += `<b>Okunuş / Ses:</b> ${apiPhonetic || ''} `;
            if (apiAudioUrl) {
                metaHtml += `<button onclick="new Audio('${apiAudioUrl}').play()" style="padding:2px 8px; font-size:11px; cursor:pointer; border-radius:4px; border:1px solid #cbd5e1; background:#fff;">🔊 Dinle</button>`;
            }
            metaHtml += `<br>`;
        }

        if (apiExamples.length > 0) {
            metaHtml += `<br><b>İnternetten Örnek Cümleler:</b><ul style="margin: 4px 0 4px 18px; padding: 0;">`;
            apiExamples.forEach(ex => metaHtml += `<li><i>"${ex}"</i></li>`);
            metaHtml += `</ul>`;
        } else if (item.example_en || item.example || item.sentence) {
            const exEn = item.example_en || item.example || item.sentence;
            const exTr = item.example_tr || item.exampleTr || '';
            metaHtml += `<br><b>Örnek Cümle (EN):</b> <i>"${exEn}"</i><br>`;
            if (exTr) metaHtml += `<b>Örnek Çeviri (TR):</b> <i>"${exTr}"</i><br>`;
        }

        if (Array.isArray(localVerbs) && localVerbs.length > 0) {
            metaHtml += `<br><b>İlişkili Fiiller / Kullanım Kalıpları:</b> ${localVerbs.join(', ')}<br>`;
        } else if (typeof localVerbs === 'string' && localVerbs.trim() !== '') {
            metaHtml += `<br><b>İlişkili Fiiller / Kullanım Kalıpları:</b> ${localVerbs}<br>`;
        }

        if (apiSynonyms.length > 0) {
            metaHtml += `<b>Eş Anlamlılar (Synonyms):</b> ${apiSynonyms.join(', ')}<br>`;
        }
        if (apiAntonyms.length > 0) {
            metaHtml += `<b>Zıt Anlamlılar (Antonyms):</b> ${apiAntonyms.join(', ')}<br>`;
        }

        if (Array.isArray(localRelWords) && localRelWords.length > 0) {
            metaHtml += `<b>İlişkili Kelimeler / Grup:</b> ${localRelWords.join(', ')}<br>`;
        }

        if (isAnalyzed) {
            metaHtml += `<br><b>Geçtiği Toplam Dosya Sayısı:</b> ${uniqueFiles.length}<br>`;
            metaHtml += `<b>Geçtiği Dosyalar:</b> ${uniqueFiles.map(f => f.split('/').pop().replace('.json','')).join(', ')}`;
        } else {
            metaHtml += `<br><span style="color:#2563eb;">ℹ️ Mükerrer analiz için üst bardan "Analizi Başlat" butonuna tıklayınız.</span>`;
        }

        detailMetaBox.innerHTML = metaHtml;
    }

    initApp();
</script>
