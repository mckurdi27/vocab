<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Mükerrer Analizi - Tüm Seviyeler</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --duplicate-border: #ef4444;
            --duplicate-bg: #fef2f2;
            --info-bg: #eff6ff;
            --info-text: #1e40af;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .app-select, .app-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .app-select:hover, .app-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .home-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: background 0.2s, transform 0.2s;
        }

        .home-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .info-bar {
            background: var(--info-bg);
            color: var(--info-text);
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #bfdbfe;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .vocab-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #e2e8f0;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        .vocab-card.is-duplicate {
            border-color: var(--duplicate-border) !important;
            background-color: var(--duplicate-bg);
        }

        .vocab-card.is-duplicate::after {
            content: "Tekrarlanan";
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--duplicate-border);
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .word-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #0f172a;
        }

        .word-translation {
            color: #475569;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .word-meta {
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <select id="fileSelect" class="app-select" onchange="onFileSelectChange(this.value)">
                    <option value="">Dosyalar yükleniyor...</option>
                </select>
                <button class="app-btn" onclick="navigateFile(-1)">◀ Önceki</button>
                <button class="app-btn" onclick="navigateFile(1)">Sonraki ▶</button>
            </div>
            <div>
                <a href="index.html" class="home-btn">🏠 Ana Sayfa</a>
            </div>
        </header>

        <div id="infoBar" class="info-bar">
            <span>Sistem hazırlanıyor...</span>
        </div>

        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <script>
        let globalWordMap = {};
        let allDaysFiles = [];
        let currentIndex = 0;

        async function initApp() {
            try {
                // Doğru dosya adlandırma kuralı: a101 - a150, a201 - a250, b101 - b150, vb.
                allDaysFiles = [];
                const levelsConfig = [
                    { prefix: 'a1', start: 1, end: 50, offset: 101 },
                    { prefix: 'a2', start: 1, end: 50, offset: 201 },
                    { prefix: 'b1', start: 1, end: 50, offset: 101 },
                    { prefix: 'b2', start: 1, end: 50, offset: 201 },
                    { prefix: 'c1', start: 1, end: 50, offset: 101 },
                    { prefix: 'c2', start: 1, end: 50, offset: 201 }
                ];

                levelsConfig.forEach(cfg => {
                    for (let i = 0; i < cfg.end; i++) {
                        let fileNum = cfg.offset + i;
                        allDaysFiles.push(`data/${cfg.prefix}${fileNum}.json`);
                    }
                });

                populateFileDropdown(allDaysFiles);
                document.getElementById('infoBar').innerHTML = `<span>Mükerrer kelime analizi yapılıyor...</span>`;

                await buildGlobalWordMap(allDaysFiles);

                if (allDaysFiles.length > 0) {
                    currentIndex = 0;
                    loadDayData(allDaysFiles[0]);
                }
            } catch (error) {
                console.error("Başlangıç hatası:", error);
                document.getElementById('infoBar').innerHTML = `<span style="color:red;">Yükleme sırasında hata oluştu.</span>`;
            }
        }

        async function buildGlobalWordMap(files) {
            globalWordMap = {};
            let validFilesCount = 0;

            for (const file of files) {
                try {
                    const res = await fetch(file);
                    if (!res.ok) continue; // Oluşturulmamış dosyaları sessizce atlar
                    
                    validFilesCount++;
                    const dayData = await res.json();
                    const wordsList = dayData.words || dayData.vocabulary || dayData;

                    if (Array.isArray(wordsList)) {
                        wordsList.forEach(item => {
                            const wordKey = (item.word || item.term || "").trim().toLowerCase();
                            if (!wordKey) return;

                            if (!globalWordMap[wordKey]) {
                                globalWordMap[wordKey] = [];
                            }
                            if (!globalWordMap[wordKey].includes(file)) {
                                globalWordMap[wordKey].push(file);
                            }
                        });
                    }
                } catch (err) {
                    // Bulunamayan dosyaları sessizce geç
                }
            }

            document.getElementById('infoBar').innerHTML = `
                <span>📁 Okunan Aktif Dosya: <b>${validFilesCount}</b></span>
                <span>✨ Mükerrer Analiz Tamamlandı</span>
            `;
        }

        function populateFileDropdown(files) {
            const select = document.getElementById('fileSelect');
            select.innerHTML = '';

            files.forEach((file) => {
                const fileName = file.split('/').pop().replace('.json', '').toUpperCase();
                const option = document.createElement('option');
                option.value = file;
                option.textContent = `Sahne / Dosya: ${fileName}`;
                select.appendChild(option);
            });
        }

        function onFileSelectChange(file) {
            currentIndex = allDaysFiles.indexOf(file);
            loadDayData(file);
        }

        function navigateFile(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = allDaysFiles.length - 1;
            if (currentIndex >= allDaysFiles.length) currentIndex = 0;

            const targetFile = allDaysFiles[currentIndex];
            document.getElementById('fileSelect').value = targetFile;
            loadDayData(targetFile);
        }

        async function loadDayData(file) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#64748b; padding: 20px;">Kelimeler yükleniyor...</p>';

            try {
                const res = await fetch(file);
                if (!res.ok) {
                    container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış veya boş.</p>`;
                    return;
                }

                const dayData = await res.json();
                const wordsList = dayData.words || dayData.vocabulary || dayData;

                container.innerHTML = '';

                if (Array.isArray(wordsList) && wordsList.length > 0) {
                    wordsList.forEach(item => {
                        const card = createVocabCard(item, file);
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#64748b;">Bu dosyada kelime bulunamadı.</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış.</p>`;
            }
        }

        function createVocabCard(item, currentFile) {
            const wordKey = (item.word || item.term || "").trim().toLowerCase();
            const appearances = globalWordMap[wordKey] || [];
            const isDuplicate = appearances.length > 1;

            const cardDiv = document.createElement('div');
            cardDiv.className = `vocab-card ${isDuplicate ? 'is-duplicate' : ''}`;

            const wordText = item.word || item.term || '';
            const translationText = item.translation || item.meaning || '';

            cardDiv.innerHTML = `
                <div class="word-title">${wordText}</div>
                <div class="word-translation">${translationText}</div>
                <div class="word-meta">
                    Geçtiği Dosyalar (${appearances.length}): ${appearances.map(f => f.split('/').pop().replace('.json','')).join(', ')}
                </div>
            `;

            return cardDiv;
        }

        initApp();
    </script>
</body>
</html>
