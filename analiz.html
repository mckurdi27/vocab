<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Mükerrer Analizi - Tüm Seviyeler</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --duplicate-border: #ef4444;
            --duplicate-bg: #fef2f2;
            --info-bg: #eff6ff;
            --info-text: #1e40af;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .app-select, .app-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .app-select:hover, .app-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .action-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: #059669;
        }

        .home-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: background 0.2s, transform 0.2s;
        }

        .home-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .info-bar {
            background: var(--info-bg);
            color: var(--info-text);
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid #bfdbfe;
        }

        /* Ana Düzen: Sol tarafta 3 sütunlu kart alanı, sağ tarafta 4. sütun detay paneli */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 4. Sütun: Geniş Detay ve Görsel Paneli */
        .detail-sidebar {
            position: sticky;
            top: 20px;
            background: var(--card-bg);
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        .detail-image-container {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #f1f5f9;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-placeholder-text {
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
            padding: 10px;
        }

        .detail-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            text-transform: capitalize;
        }

        .detail-translation {
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .detail-meta-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            color: #475569;
            line-height: 1.5;
        }

        .vocab-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
            border-color: var(--primary-color);
        }

        .vocab-card.active-card {
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .vocab-card.is-unique {
            border-color: #22c55e !important;
            background-color: #f0fdf4;
        }
        .vocab-card.is-unique .card-badge {
            background-color: #22c55e;
        }

        .vocab-card.is-first-repeat {
            border-color: var(--primary-color) !important;
            background-color: #eff6ff;
        }
        .vocab-card.is-first-repeat .card-badge {
            background-color: var(--primary-color);
        }

        .vocab-card.is-duplicate {
            border-color: var(--duplicate-border) !important;
            background-color: var(--duplicate-bg);
        }
        .vocab-card.is-duplicate .card-badge {
            background-color: var(--duplicate-border);
        }

        .card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .word-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #0f172a;
        }

        .word-translation {
            color: #475569;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .word-meta {
            font-size: 0.7rem;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 6px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <!-- Grup / Seviye Seçimi -->
                <select id="groupSelect" class="app-select" onchange="onGroupChange()">
                    <option value="all">Tümü</option>
                    <option value="a1">A1</option>
                    <option value="a2">A2</option>
                    <option value="b1">B1</option>
                    <option value="b2">B2</option>
                    <option value="c1">C1</option>
                    <option value="c2">C2</option>
                </select>

                <!-- Tek Dosya Seçimi -->
                <select id="fileSelect" class="app-select" onchange="onFileSelectChange(this.value)">
                    <option value="" disabled selected>Tek</option>
                </select>

                <button class="app-btn" onclick="navigateFile(-1)">◀ Önceki</button>
                <button class="app-btn" onclick="navigateFile(1)">Sonraki ▶</button>
            </div>
            <div>
                <a href="index.html" class="home-btn">🏠 Ana Sayfa</a>
            </div>
        </header>

        <div id="infoBar" class="info-bar">
            <span>Dosya seçildi. Mükerrer renk analizi için analizi başlatabilirsiniz.</span>
            <button class="action-btn" onclick="startGlobalAnalysis()">✨ Analizi Başlat</button>
        </div>

        <!-- Ana Düzen Kapsayıcısı (Sol: Kelime Kartları 3 Sütun, Sağ: 4. Sütun Detay Paneli) -->
        <div class="main-layout">
            <div id="cardsContainer" class="cards-grid"></div>

            <!-- Dördüncü Sütun: Geniş Detay ve Görsel Paneli -->
            <div class="detail-sidebar" id="detailSidebar">
                <div class="detail-image-container" id="detailImageContainer">
                    <div class="detail-placeholder-text">Görsel yükleniyor...</div>
                </div>
                <div class="detail-title" id="detailTitle">Kelime Seçin</div>
                <div class="detail-translation" id="detailTranslation">Detay görmek için soldaki kartlardan birine tıklayın.</div>
                <div class="detail-meta-box" id="detailMetaBox">
                    Kelime ile ilgili arama sonuçları, açıklamalar ve dosya geçiş detayları bu alanda görüntülenecektir.
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalWordMap = {};
        let allDaysFiles = [];
        let filteredFiles = [];
        let currentIndex = 0;
        let isAnalyzed = false;

        async function initApp() {
            try {
                allDaysFiles = [];
                const levelsConfig = [
                    { letter: 'a', level: 1 },
                    { letter: 'a', level: 2 },
                    { letter: 'b', level: 1 },
                    { letter: 'b', level: 2 },
                    { letter: 'c', level: 1 },
                    { letter: 'c', level: 2 }
                ];

                levelsConfig.forEach(cfg => {
                    for (let i = 0; i <= 50; i++) {
                        let groupNum = i < 10 ? '0' + i : '' + i;
                        let fileNum = cfg.level === 1 ? '1' + groupNum : '2' + groupNum;
                        allDaysFiles.push(`data/${cfg.letter}${fileNum}.json`);
                    }
                });

                filteredFiles = [...allDaysFiles];
                updateFileDropdown(filteredFiles);

                if (filteredFiles.length > 0) {
                    currentIndex = 0;
                    loadDayData(filteredFiles[0]);
                }
            } catch (error) {
                console.error("Başlangıç hatası:", error);
            }
        }

        async function startGlobalAnalysis() {
            const infoBar = document.getElementById('infoBar');
            infoBar.innerHTML = `<span>⏳ Tüm dosyalar taranıyor, lütfen bekleyin...</span>`;
            
            globalWordMap = {};
            let validFilesCount = 0;

            for (const file of allDaysFiles) {
                try {
                    const res = await fetch(file);
                    if (!res.ok) continue; 
                    
                    validFilesCount++;
                    const dayData = await res.json();
                    const wordsList = dayData.words || dayData.vocabulary || dayData;

                    if (Array.isArray(wordsList)) {
                        wordsList.forEach((item, index) => {
                            const wordKey = (item.word || item.term || "").trim().toLowerCase();
                            if (!wordKey) return;

                            if (!globalWordMap[wordKey]) {
                                globalWordMap[wordKey] = [];
                            }
                            globalWordMap[wordKey].push({ file: file, index: index, item: item });
                        });
                    }
                } catch (err) {}
            }

            isAnalyzed = true;
            infoBar.innerHTML = `
                <span>📁 Taranan Dosya: <b>${validFilesCount}</b> — <span style="color:#059669; font-weight:bold;">Mükerrer Analiz Tamamlandı</span></span>
                <button class="action-btn" onclick="startGlobalAnalysis()">✨ Tekrar Başlat</button>
            `;

            if (filteredFiles.length > 0) {
                loadDayData(filteredFiles[currentIndex]);
            }
        }

        function updateFileDropdown(files) {
            const select = document.getElementById('fileSelect');
            select.innerHTML = '<option value="" disabled selected>Tek</option>';

            files.forEach((file) => {
                const fileName = file.split('/').pop().replace('.json', '').toUpperCase();
                const option = document.createElement('option');
                option.value = file;
                option.textContent = `Dosya: ${fileName}`;
                select.appendChild(option);
            });
        }

        function onGroupChange() {
            const group = document.getElementById('groupSelect').value;
            
            if (group === 'all') {
                filteredFiles = [...allDaysFiles];
            } else {
                let targetLetter = group.charAt(0);
                let levelNum = group.charAt(1);
                
                filteredFiles = allDaysFiles.filter(file => {
                    const fileName = file.split('/').pop(); 
                    const isLetterMatch = fileName.startsWith(targetLetter);
                    const fileCode = fileName.replace('.json', ''); 
                    const isLevelMatch = levelNum === '1' ? fileCode[1] === '1' : fileCode[1] === '2';
                    return isLetterMatch && isLevelMatch;
                });
            }

            updateFileDropdown(filteredFiles);
            if (filteredFiles.length > 0) {
                currentIndex = 0;
                loadDayData(filteredFiles[0]);
            } else {
                document.getElementById('cardsContainer').innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#64748b;">Bu grupta dosya bulunamadı.</p>`;
            }
        }

        function onFileSelectChange(file) {
            if (!file) return;
            currentIndex = filteredFiles.indexOf(file);
            loadDayData(file);
        }

        function navigateFile(direction) {
            if (filteredFiles.length === 0) return;
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = filteredFiles.length - 1;
            if (currentIndex >= filteredFiles.length) currentIndex = 0;

            const targetFile = filteredFiles[currentIndex];
            document.getElementById('fileSelect').value = targetFile;
            loadDayData(targetFile);
        }

        async function loadDayData(file) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#64748b; padding: 20px;">Kelimeler yükleniyor...</p>';

            try {
                const res = await fetch(file);
                if (!res.ok) {
                    container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış veya boş.</p>`;
                    return;
                }

                const dayData = await res.json();
                const wordsList = dayData.words || dayData.vocabulary || dayData;

                container.innerHTML = '';

                if (Array.isArray(wordsList) && wordsList.length > 0) {
                    wordsList.forEach((item, index) => {
                        const card = createVocabCard(item, file, index);
                        container.appendChild(card);
                    });
                    
                    // Otomatik olarak ilk kelimeyi seç ve detay panelinde göster
                    if (wordsList[0]) {
                        showWordDetail(wordsList[0], file, 0);
                    }
                } else {
                    container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#64748b;">Bu dosyada kelime bulunamadı.</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding: 20px;">Bu dosya henüz oluşturulmamış.</p>`;
            }
        }

        function createVocabCard(item, currentFile, itemIndex) {
            const wordKey = (item.word || item.term || "").trim().toLowerCase();
            const appearances = globalWordMap[wordKey] || [];
            const count = appearances.length;
            
            let cardClass = '';
            let badgeText = '';

            if (!isAnalyzed || count === 0) {
                cardClass = '';
                badgeText = 'Normal';
            } else if (count === 1) {
                cardClass = 'is-unique';
                badgeText = 'Özgün';
            } else {
                const occurrenceObjIndex = appearances.findIndex(app => app.file === currentFile && app.index === itemIndex);
                const occurrenceIndex = occurrenceObjIndex !== -1 ? occurrenceObjIndex + 1 : 1;

                if (occurrenceIndex === 1) {
                    cardClass = 'is-first-repeat';
                    badgeText = '1. Geçiş';
                } else {
                    cardClass = 'is-duplicate';
                    badgeText = `${occurrenceIndex}. Geçiş`;
                }
            }

            const cardDiv = document.createElement('div');
            cardDiv.className = `vocab-card ${cardClass}`;
            cardDiv.onclick = () => {
                document.querySelectorAll('.vocab-card').forEach(c => c.classList.remove('active-card'));
                cardDiv.classList.add('active-card');
                showWordDetail(item, currentFile, itemIndex);
            };

            const wordText = item.word || item.term || '';
            const translationText = item.translation || item.meaning || '';
            const uniqueFiles = [...new Set(appearances.map(app => app.file))];

            cardDiv.innerHTML = `
                <div class="card-badge">${badgeText}</div>
                <div class="word-title">${wordText}</div>
                <div class="word-translation">${translationText}</div>
                <div class="word-meta">
                    ${isAnalyzed ? `Geçtiği Dosyalar (${uniqueFiles.length}): ${uniqueFiles.map(f => f.split('/').pop().replace('.json','')).join(', ')}` : 'Analiz bekleniyor...'}
                </div>
            `;

            return cardDiv;
        }

        async function showWordDetail(item, currentFile, itemIndex) {
            const wordText = item.word || item.term || '';
            const translationText = item.translation || item.meaning || '';
            const exampleText = item.example || item.sentence || '';
            const trExampleText = item.exampleTr || item.translationExample || '';
            const relWords = item.relatedWords || item.synonyms || '';

            document.getElementById('detailTitle').textContent = wordText;
            document.getElementById('detailTranslation').textContent = translationText;

            const imageContainer = document.getElementById('detailImageContainer');
            imageContainer.innerHTML = `<div class="detail-placeholder-text">Görsel aranıyor...</div>`;

            try {
                const wikiRes = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(wordText)}&gsrlimit=1&prop=imageinfo&iiprop=url&format=json&origin=*`);
                const wikiData = await wikiRes.json();
                
                let imageUrl = '';
                if (wikiData.query && wikiData.query.pages) {
                    const pages = wikiData.query.pages;
                    const pageId = Object.keys(pages)[0];
                    if (pages[pageId].imageinfo && pages[pageId].imageinfo[0]) {
                        imageUrl = pages[pageId].imageinfo[0].url;
                    }
                }

                if (!imageUrl) {
                    imageUrl = `https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=600&q=80`;
                }

                imageContainer.innerHTML = `<img src="${imageUrl}" alt="${wordText}" onerror="this.src='https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=600&q=80'">`;
            } catch (err) {
                imageContainer.innerHTML = `<img src="https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=600&q=80" alt="${wordText}">`;
            }

            const wordKey = wordText.trim().toLowerCase();
            const appearances = globalWordMap[wordKey] || [];
            const uniqueFiles = [...new Set(appearances.map(app => app.file))];

            let metaHtml = `<b>Anlamı / Açıklama:</b> ${translationText}<br>`;
            if (exampleText) {
                metaHtml += `<br><b>Örnek (EN):</b> ${exampleText}<br>`;
            }
            if (trExampleText) {
                metaHtml += `<b>Örnek (TR):</b> ${trExampleText}<br>`;
            }
            if (relWords) {
                metaHtml += `<br><b>İlişkili Kelimeler:</b> ${typeof relWords === 'string' ? relWords : relWords.join(', ')}<br>`;
            }
            if (isAnalyzed) {
                metaHtml += `<br><b>Geçtiği Toplam Dosya Sayısı:</b> ${uniqueFiles.length}<br>`;
                metaHtml += `<b>Dosyalar:</b> ${uniqueFiles.map(f => f.split('/').pop().replace('.json','')).join(', ')}`;
            } else {
                metaHtml += `<br><span style="color:#2563eb;">Mükerrer analiz için üst bardan "Analizi Başlat" butonuna tıklayınız.</span>`;
            }

            document.getElementById('detailMetaBox').innerHTML = metaHtml;
        }

        initApp();
    </script>
</body>
</html>
