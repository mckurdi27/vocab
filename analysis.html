<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Dil Analiz Paneli</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; color: #1e293b; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-home { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background-color: #4f46e5; color: #ffffff; border-radius: 6px; text-decoration: none; font-weight: 500; transition: background-color 0.2s ease; border: none; cursor: pointer; }
        .btn-home:hover { background-color: #4338ca; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        button { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-weight: 500; }
        .active-btn { background: #27ae60 !important; color: white; border: none; }
        
        .table-container { max-height: 480px; overflow-y: auto; margin-top: 10px; border: 1px solid #ddd; border-radius: 6px; position: relative; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        
        th { background: #f1f5f9; color: #0f172a; user-select: none; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1); vertical-align: top; }
        
        /* Büyük ve Kolay Dokunulabilir Sıralama Satırı Butonları */
        .sort-trigger-btn { display: block; width: 100%; padding: 6px 8px; margin-bottom: 6px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; font-weight: bold; color: #4f46e5; cursor: pointer; text-align: center; transition: background 0.2s, border-color 0.2s; }
        .sort-trigger-btn:hover { background: #e0e7ff; border-color: #6366f1; }
        
        .status-bar { padding: 10px; border-radius: 4px; margin-top: 10px; background: #eef2f7; }
        .input-box { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, input[type="file"] { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; }
        select { width: 380px; }
        
        .badge-unique { background: #e0f2fe; color: #0369a1; padding: 3px 6px; border-radius: 4px; font-weight: 600; font-size: 11px; display: inline-block; margin: 2px; border: 1px solid #bae6fd; }
        .badge-diff { background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; margin-left: 5px; }
        .badge-dup { background: #fee2e2; color: #dc2626; padding: 3px 6px; border-radius: 4px; font-weight: 600; font-size: 11px; display: inline-block; margin: 2px; border: 1px solid #fecaca; }
        
        .file-list-tag { background: #f1f5f9; color: #334155; padding: 2px 6px; border-radius: 4px; font-size: 11px; display: inline-block; margin: 1px; font-family: monospace; border: 1px solid #e2e8f0; }
        .dynamic-input-container { margin-top: 15px; padding: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; }
        .filter-input { width: 90%; padding: 5px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 3px; margin-top: 4px; font-weight: normal; background: #fff; }
        .sticky-summary { position: sticky; top: 0; z-index: 20; background: #ffffff; padding: 10px 0; border-bottom: 2px solid #e2e8f0; }
        
        .csv-checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .csv-checkbox-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; font-size: 13px; }

        .btn-print { background-color: #0f172a; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; transition: background 0.2s; }
        .btn-print:hover { background-color: #334155; }

        /* Yazdırma Sırasında Renklerin Korunması İçin */
        @media print {
            body { background: white; padding: 0; color: black; }
            .header-bar, .section:not(#resultArea), .sort-trigger-btn, .filter-input, .btn-print { display: none !important; }
            .sticky-summary { position: static; border: none; }
            .table-container { max-height: none; overflow: visible; border: none; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="header-left">
        <h2 style="margin: 0;">Gelişmiş Dil Analiz Paneli</h2>
    </div>
    <a href="index.html" class="btn-home">⬅️ Ana Sayfaya Dön</a>
</div>

<div class="section">
    <h3>1. Kaynak ve Kapsam Seçimi</h3>
    <div class="input-box" style="margin-top: 5px; margin-bottom: 15px;">
        <label for="jsonSelect"><strong>Hedef JSON Dosyası / Grubu:</strong></label>
        <select id="jsonSelect">
            <option value="ALL">📁 Tüm Dosyaları Tara (Tüm Seviyeler)</option>
        </select>
    </div>

    <div class="dynamic-input-container">
        <label><strong>📌 CSV Sözlük Referansı (İstediğiniz kadar seçin veya yükleyin):</strong></label><br>
        
        <div style="margin-top: 8px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <button type="button" onclick="toggleAllCsv(true)" style="padding: 6px 12px; font-size: 12px; background: #e2e8f0;">Hepsini Seç</button>
            <button type="button" onclick="toggleAllCsv(false)" style="padding: 6px 12px; font-size: 12px; background: #e2e8f0;">Seçimleri Kaldır</button>
            
            <label style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: normal; background: #f1f5f9; padding: 4px 8px; border-radius: 4px; border: 1px solid #cbd5e1; cursor: pointer;">
                <span>📁 Telefondan CSV Seç:</span>
                <input type="file" id="customCsvFile" accept=".csv" style="font-size: 11px;" onchange="handleCustomCsvUpload(this)">
            </label>
        </div>

        <div class="csv-checkbox-group">
            <label><input type="checkbox" name="csvFile" value="analiz/cefr.csv"> cefr.csv (Tümü)</label>
            <label><input type="checkbox" name="csvFile" value="analiz/cefr_pre.csv"> cefr_pre.csv</label>
            <label><input type="checkbox" name="csvFile" value="analiz/cefr_a1.csv"> CEFR A1</label>
            <label><input type="checkbox" name="csvFile" value="analiz/cefr_a2.csv"> CEFR A2</label>
            <label><input type="checkbox" name="csvFile" value="analiz/cefr_b1.csv"> CEFR B1</label>
            <label><input type="checkbox" name="csvFile" value="analiz/cefr_b2.csv"> CEFR B2</label>
            <label><input type="checkbox" name="csvFile" value="analiz/cefr_c1.csv"> CEFR C1</label>
            <label><input type="checkbox" name="csvFile" value="analiz/cefr_c2.csv"> CEFR C2</label>
        </div>
        <div id="csvSourceDetails" style="font-size: 12px; color: #666; margin-top: 8px;">Seçilen CSV: Belirtilmedi</div>
    </div>
</div>

<div class="section">
    <h3>2. İşlem Türü (Analiz Modu)</h3>
    <div class="btn-group">
        <button onclick="setTask('hikaye', this)" class="active-btn">📖 Hikaye Metni Analizi (story_en)</button>
        <button onclick="setTask('kelimeler', this)">📋 50 Kelime Listesi Analizi (words)</button>
        <button onclick="setTask('cevir', this)">🔤 Çeviri / Sözlük Detayı</button>
    </div>
    <div id="taskDetails" style="font-size: 13px; color: #555;">Mod: JSON içerisindeki "story_en" hikaye metni kelime bazlı taranır ve frekansları ölçülür.</div>
</div>

<div class="section" id="resultSection">
    <h3>3. Analiz Sonucu</h3>
    <button onclick="runAnalysis()" style="background: #4f46e5; color: white; font-weight: bold; padding: 12px 20px; border: none; border-radius: 6px; cursor:pointer;">🚀 Analizi Çalıştır</button>
    <div id="status" class="status-bar">Sistem hazır.</div>
    <div id="resultArea" style="margin-top:20px;"></div>
</div>

<script>
    let customCsvContent = "";
    let globalCsvDictionary = {};
    let state = { task: 'hikaye' };
    let globalTableData = [];
    let fileCountToProcess = 1;
    let currentSortColumn = 'original';
    let currentSortOrder = 'asc';

    window.addEventListener('DOMContentLoaded', () => {
        const selectEl = document.getElementById('jsonSelect');
        const levels = ['a1', 'a2', 'b1', 'b2', 'c1', 'c2'];
        
        levels.forEach(lvl => {
            let optGroup = document.createElement('optgroup');
            optGroup.label = `--- ${lvl.toUpperCase()} Seviyesi Dosyaları ---`;
            
            let groupAllOpt = document.createElement('option');
            groupAllOpt.value = `GROUP_${lvl.toUpperCase()}`;
            groupAllOpt.textContent = `📂 Tüm ${lvl.toUpperCase()} Dosyaları`;
            groupAllOpt.style.fontWeight = "bold";
            groupAllOpt.style.color = "#4f46e5";
            optGroup.appendChild(groupAllOpt);

            for (let i = 0; i <= 50; i++) {
                let numStr = i < 10 ? '0' + i : i;
                let fileName = `data/${lvl}${numStr}.json`;
                
                let option = document.createElement('option');
                option.value = fileName;
                option.text = `${lvl.toUpperCase()} - Dosya ${i} (${lvl}${numStr}.json)`;
                optGroup.appendChild(option);
            }
            selectEl.appendChild(optGroup);
        });

        document.querySelectorAll('input[name="csvFile"]').forEach(cb => {
            cb.addEventListener('change', updateCsvSelectionInfo);
        });
    });

    function toggleAllCsv(select) {
        document.querySelectorAll('input[name="csvFile"]').forEach(cb => {
            cb.checked = select;
        });
        updateCsvSelectionInfo();
    }

    async function handleCustomCsvUpload(input) {
        if (input.files && input.files[0]) {
            let file = input.files[0];
            try {
                customCsvContent = await file.text();
                updateCsvSelectionInfo();
            } catch (err) {
                alert("Özel CSV dosyası okunamadı: " + err.message);
            }
        }
    }

    function updateCsvSelectionInfo() {
        const checkedBoxes = document.querySelectorAll('input[name="csvFile"]:checked');
        let selectedFiles = Array.from(checkedBoxes).map(cb => cb.parentNode.textContent.trim());
        
        const customFileInput = document.getElementById('customCsvFile');
        let customFileName = (customFileInput.files && customFileInput.files[0]) ? customFileInput.files[0].name : null;

        let infoText = "";
        if (selectedFiles.length > 0) {
            infoText += "Seçilen CSV'ler: " + selectedFiles.join(', ');
        }
        if (customFileName) {
            infoText += (infoText ? " | " : "") + "📁 Özel Yüklenen Dosya: " + customFileName;
        }

        document.getElementById('csvSourceDetails').innerText = infoText ? infoText : "Seçilen CSV: Belirtilmedi";
    }

    function setTask(t, btn) {
        state.task = t;
        const descriptions = {
            'hikaye': 'Mod: JSON içerisindeki "story_en" hikaye metni kelime bazlı taranır ve frekansları ölçülür.',
            'kelimeler': 'Mod: Sahneye ait bağımsız "words" listesindeki kelimeler incelenir.',
            'cevir': 'Mod: Kelimeler, Türkçe karşılıkları ve örnek cümleleriyle sözlük formatında listelenir.'
        };
        document.getElementById('taskDetails').innerText = descriptions[t];
        btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
    }

    async function runAnalysis() {
        const checkedCsvs = Array.from(document.querySelectorAll('input[name="csvFile"]:checked')).map(cb => cb.value);
        const hasCustomCsv = customCsvContent.trim().length > 0;

        if (checkedCsvs.length === 0 && !hasCustomCsv) {
            alert("Lütfen en az bir CSV sözlük referansı (veya telefondan özel CSV dosyası) seçin.");
            return;
        }

        const statusDiv = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        statusDiv.innerText = "CSV sözlükleri birleştiriliyor ve JSON dosyaları taranıyor...";
        resultArea.innerHTML = "";
        
        try {
            let combinedCsvText = "";
            for (let fPath of checkedCsvs) {
                try {
                    const res = await fetch(fPath);
                    if (res.ok) {
                        let text = await res.text();
                        combinedCsvText += text + "\n";
                    }
                } catch (e) {}
            }
            if (hasCustomCsv) {
                combinedCsvText += customCsvContent + "\n";
            }

            globalCsvDictionary = {};
            let rows = combinedCsvText.split(/\r?\n/);
            rows.forEach(row => {
                if (!row.trim()) return;
                let parts = row.split(',').map(p => p.trim().replace(/^["']|["']$/g, ""));
                if (parts.length >= 2) {
                    let headword = parts[0].toLowerCase();
                    let cefr = parts[1].toUpperCase();
                    let turkish = parts.slice(2).join(',').trim();

                    if (/^(A1|A2|B1|B2|C1|C2)$/.test(cefr) && headword !== "word" && headword !== "kelime") {
                        globalCsvDictionary[headword] = { cefr: cefr, turkish: turkish };
                    } else if (/^(A1|A2|B1|B2|C1|C2)$/.test(headword.toUpperCase()) && !/^(A1|A2|B1|B2|C1|C2)$/.test(cefr)) {
                        globalCsvDictionary[parts[1].toLowerCase()] = { cefr: headword.toUpperCase(), turkish: turkish };
                    }
                }
            });

            let rawJsonDataArray = [];
            const selectedTarget = document.getElementById('jsonSelect').value;
            let filesToFetch = [];

            if (selectedTarget === "ALL") {
                ['a1', 'a2', 'b1', 'b2', 'c1', 'c2'].forEach(lvl => {
                    for (let i = 0; i <= 50; i++) {
                        let numStr = i < 10 ? '0' + i : i;
                        filesToFetch.push({ name: `${lvl}${numStr}.json`, path: `data/${lvl}${numStr}.json`, level: lvl.toUpperCase() });
                    }
                });
            } else if (selectedTarget.startsWith("GROUP_")) {
                let targetLvl = selectedTarget.replace("GROUP_", "").toLowerCase();
                for (let i = 0; i <= 50; i++) {
                    let numStr = i < 10 ? '0' + i : i;
                    filesToFetch.push({ name: `${targetLvl}${numStr}.json`, path: `data/${targetLvl}${numStr}.json`, level: targetLvl.toUpperCase() });
                }
            } else {
                let lvl = selectedTarget.includes('/') ? selectedTarget.split('/')[1].substring(0, 2).toUpperCase() : 'Bilinmiyor';
                filesToFetch.push({ name: selectedTarget.split('/').pop(), path: selectedTarget, level: lvl });
            }

            for (let itemObj of filesToFetch) {
                try {
                    let res = await fetch(itemObj.path);
                    if (res.ok) {
                        let jsonData = await res.json();
                        rawJsonDataArray.push({ sourceName: itemObj.name, data: jsonData, defaultLevel: itemObj.level });
                    }
                } catch (e) {}
            }

            if (rawJsonDataArray.length === 0) throw new Error("Seçilen JSON dosyası(arı) bulunamadı.");

            fileCountToProcess = rawJsonDataArray.length;
            let itemTracking = {};
            let totalCheckedCount = 0;

            rawJsonDataArray.forEach(itemObj => {
                let fName = itemObj.sourceName;
                let data = itemObj.data;
                let jsonFileLevel = (data.level && data.level.trim() !== '') ? data.level.toUpperCase().trim() : itemObj.defaultLevel;

                if (state.task === 'hikaye') {
                    let textToAnalyze = data.story_en && typeof data.story_en === 'string' ? data.story_en : JSON.stringify(data);
                    
                    let cleanStory = textToAnalyze.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, " ").toLowerCase();
                    let wordsArr = cleanStory.split(/\s+/);
                    
                    wordsArr.forEach(w => {
                        let cleanW = w.trim();
                        if (cleanW.length > 1 && !/^\d+$/.test(cleanW)) {
                            totalCheckedCount++;
                            let finalLevel = jsonFileLevel;
                            let csvMatched = false;
                            if (globalCsvDictionary[cleanW]) {
                                finalLevel = globalCsvDictionary[cleanW].cefr;
                                csvMatched = true;
                            }

                            if (!itemTracking[cleanW]) {
                                itemTracking[cleanW] = { 
                                    original: cleanW, 
                                    count: 0, 
                                    files: [], 
                                    level: finalLevel,
                                    jsonLevel: jsonFileLevel,
                                    csvMatched: csvMatched,
                                    type: '-',
                                    turkish: globalCsvDictionary[cleanW] ? globalCsvDictionary[cleanW].turkish : '-'
                                };
                            }
                            itemTracking[cleanW].count++;
                            if (!itemTracking[cleanW].files.includes(fName)) itemTracking[cleanW].files.push(fName);
                        }
                    });
                } else {
                    let list = data.words && Array.isArray(data.words) ? data.words : [];
                    list.forEach((item, itemIndex) => {
                        let wordStr = item.word || item.Kelime || '';
                        if (wordStr) {
                            let cleanW = wordStr.trim().toLowerCase();
                            totalCheckedCount++;

                            let finalLevel = jsonFileLevel;
                            let csvMatched = false;
                            if (globalCsvDictionary[cleanW]) {
                                finalLevel = globalCsvDictionary[cleanW].cefr;
                                csvMatched = true;
                            }

                            if (!itemTracking[cleanW]) {
                                itemTracking[cleanW] = { 
                                    original: wordStr.trim(), 
                                    type: (item.type || '-').replace(/\s+/g, ' '),
                                    turkish: (item.turkish || item.Anlam || (globalCsvDictionary[cleanW] ? globalCsvDictionary[cleanW].turkish : '-')).replace(/\s+/g, ' '),
                                    example_en: (item.example_en || '').replace(/\s+/g, ' '),
                                    files: [], 
                                    fileOccurrences: [],
                                    level: finalLevel,
                                    jsonLevel: jsonFileLevel,
                                    csvMatched: csvMatched
                                };
                            }
                            
                            if (!itemTracking[cleanW].files.includes(fName)) {
                                itemTracking[cleanW].files.push(fName);
                            }
                            itemTracking[cleanW].fileOccurrences.push({ file: fName, index: itemIndex + 1 });
                        }
                    });
                }
            });

            statusDiv.innerText = `✅ Analiz tamamlandı! İncelenen Toplam Birim: ${totalCheckedCount}.`;

            globalTableData = [];
            let levelCounts = { 'A1': 0, 'A2': 0, 'B1': 0, 'B2': 0, 'C1': 0, 'C2': 0, 'Bilinmiyor': 0 };

            for (let cleanW in itemTracking) {
                let info = itemTracking[cleanW];
                let lvl = info.level || 'Bilinmiyor';
                if (levelCounts[lvl] !== undefined) levelCounts[lvl]++;
                else levelCounts['Bilinmiyor']++;

                globalTableData.push({
                    original: info.original,
                    level: lvl,
                    jsonLevel: info.jsonLevel,
                    csvMatched: info.csvMatched,
                    type: info.type,
                    turkish: info.turkish,
                    count: info.count || 0,
                    example_en: info.example_en || '',
                    filesCount: info.files.length,
                    filesList: info.files.sort().join(', '),
                    fileOccurrences: info.fileOccurrences || []
                });
            }

            sortData('original', 'asc');
            renderTable(totalCheckedCount, fileCountToProcess, levelCounts);

        } catch (err) {
            statusDiv.innerText = "❌ Hata: " + err.message;
        }
    }

    function sortData(column, order) {
        currentSortColumn = column;
        currentSortOrder = order;
        globalTableData.sort((a, b) => {
            let valA = a[column] !== undefined ? a[column] : '';
            let valB = b[column] !== undefined ? b[column] : '';
            if (typeof valA === 'string') valA = valA.toLowerCase();
            if (typeof valB === 'string') valB = valB.toLowerCase();

            if (valA < valB) return order === 'asc' ? -1 : 1;
            if (valA > valB) return order === 'asc' ? 1 : -1;
            return 0;
        });
    }

    function handleSort(column) {
        let newOrder = (currentSortColumn === column && currentSortOrder === 'asc') ? 'desc' : 'asc';
        sortData(column, newOrder);
        
        let levelCounts = { 'A1': 0, 'A2': 0, 'B1': 0, 'B2': 0, 'C1': 0, 'C2': 0, 'Bilinmiyor': 0 };
        globalTableData.forEach(item => {
            if (levelCounts[item.level] !== undefined) levelCounts[item.level]++;
            else levelCounts['Bilinmiyor']++;
        });
        renderTable(globalTableData.length, fileCountToProcess, levelCounts);
    }

    function getArrow(colName) {
        if (currentSortColumn !== colName) return ' ↕';
        return currentSortOrder === 'asc' ? ' 🔼' : ' 🔽';
    }

    function renderTable(totalCheckedCount, fileCount, levelCounts) {
        const resultArea = document.getElementById('resultArea');
        let tableRows = '';
        
        let totalFilesCountSum = 0; 
        let totalFilesOccurrencesSum = 0; 
        let totalUniqueBadgesCount = 0;
        let totalDupBadgesCount = 0;

        globalTableData.forEach((item, index) => {
            totalFilesCountSum += item.filesCount;
            totalFilesOccurrencesSum += item.filesCount; 

            let fileTagsHtml = item.filesList.split(', ').map(f => `<span class="file-list-tag">${f}</span>`).join(' ');
            
            let levelDisplay = item.level;
            if (item.csvMatched && item.jsonLevel && item.jsonLevel !== item.level) {
                levelDisplay += ` <span class="badge-diff" title="CSV referansı ile güncellendi!">CSV Düzeltmesi ⚠️</span>`;
            }

            if (state.task === 'hikaye') {
                tableRows += `<tr data-files="${item.filesList}">
                    <td>${index + 1}</td>
                    <td><strong>${item.original}</strong></td>
                    <td>${levelDisplay}</td>
                    <td><strong>${item.count}</strong></td>
                    <td>
                        <div class="file-tags-wrapper">${fileTagsHtml}</div>
                        <div style="font-size: 11px; color: #64748b; margin-top: 4px; font-weight: 500;">Toplam Dosya: <span>${item.filesCount}</span></div>
                    </td>
                </tr>`;
            } else if (state.task === 'kelimeler') {
                let duplicateDetailsHtml = '-';
                if (item.fileOccurrences && item.fileOccurrences.length > 0) {
                    duplicateDetailsHtml = item.fileOccurrences.map((occ, i) => {
                        let badgeClass = (i === 0) ? 'badge-unique' : 'badge-dup';
                        if (badgeClass === 'badge-unique') totalUniqueBadgesCount++;
                        else totalDupBadgesCount++;

                        return `<span class="${badgeClass}">${occ.file} (Sıra: ${occ.index})</span>`;
                    }).join(' ');
                }

                tableRows += `<tr data-files="${item.filesList}">
                    <td>${index + 1}</td>
                    <td><strong>${item.original}</strong></td>
                    <td>${levelDisplay}</td>
                    <td><code>${item.type}</code></td>
                    <td>${item.turkish}</td>
                    <td style="text-align: center;"><span class="badge-unique">${item.filesCount} Dosya</span></td>
                    <td>${duplicateDetailsHtml}</td>
                    <td>
                        <div class="file-tags-wrapper">${fileTagsHtml}</div>
                        <div style="font-size: 11px; color: #64748b; margin-top: 4px; font-weight: 500;">Toplam Dosya: <span>${item.filesCount}</span></div>
                    </td>
                </tr>`;
            } else {
                tableRows += `<tr data-files="${item.filesList}">
                    <td>${index + 1}</td>
                    <td><strong>${item.original}</strong></td>
                    <td>${levelDisplay}</td>
                    <td>${item.turkish}</td>
                    <td><em>${item.example_en || 'Örnek yok'}</em></td>
                    <td>
                        <div class="file-tags-wrapper">${fileTagsHtml}</div>
                        <div style="font-size: 11px; color: #64748b; margin-top: 4px; font-weight: 500;">Toplam Dosya: <span>${item.filesCount}</span></div>
                    </td>
                </tr>`;
            }
        });

        let tableHeaderHtml = '';
        if (state.task === 'hikaye') {
            tableHeaderHtml = `
                <tr>
                    <th style="width:50px;">#</th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('original')">Hikaye Kelimesi ${getArrow('original')}</button>
                        <input type="text" id="f_word" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()">
                    </th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('level')">Seviye ${getArrow('level')}</button>
                        <input type="text" id="f_level" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()">
                    </th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('count')">Frekans ${getArrow('count')}</button>
                    </th>
                    <th>
                        <div style="padding: 6px 0; font-weight: bold; font-size: 13px; color: #334155;">Bulunduğu Dosyalar (Top: ${totalFilesOccurrencesSum})</div>
                        <input type="text" id="f_files" class="filter-input" placeholder="Dosya filtrele..." onkeyup="filterTable()">
                    </th>
                </tr>`;
        } else if (state.task === 'kelimeler') {
            tableHeaderHtml = `
                <tr>
                    <th style="width:50px;">#</th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('original')">Kelime (Word) ${getArrow('original')}</button>
                        <input type="text" id="f_word" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()">
                    </th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('level')">Seviye ${getArrow('level')}</button>
                        <input type="text" id="f_level" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()">
                    </th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('type')">Tür (Type) ${getArrow('type')}</button>
                    </th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('turkish')">Türkçe Anlamı ${getArrow('turkish')}</button>
                    </th>
                    <th style="text-align: center;">
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('filesCount')">Dosya Sayısı (Top: ${totalFilesCountSum}) ${getArrow('filesCount')}</button>
                    </th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('fileOccurrences')">Tekrar Ettiği Dosyalar ve Sıraları ${getArrow('fileOccurrences')}</button>
                        <div style="font-size: 11px; margin-top: 4px; display: flex; gap: 6px; font-weight: normal; align-items: center;">
                            <span class="badge-unique">Mavi Toplam: ${totalUniqueBadgesCount}</span>
                            <span class="badge-dup">Kırmızı Toplam: ${totalDupBadgesCount}</span>
                        </div>
                    </th>
                    <th>
                        <div style="padding: 6px 0; font-weight: bold; font-size: 13px; color: #334155;">Bulunduğu Dosyalar (Top: ${totalFilesOccurrencesSum})</div>
                        <input type="text" id="f_files" class="filter-input" placeholder="Dosya filtrele..." onkeyup="filterTable()">
                    </th>
                </tr>`;
        } else {
            tableHeaderHtml = `
                <tr>
                    <th style="width:50px;">#</th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('original')">Kelime ${getArrow('original')}</button>
                        <input type="text" id="f_word" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()">
                    </th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('level')">Seviye ${getArrow('level')}</button>
                        <input type="text" id="f_level" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()">
                    </th>
                    <th>
                        <button type="button" class="sort-trigger-btn" onclick="handleSort('turkish')">Türkçe Karşılığı ${getArrow('turkish')}</button>
                    </th>
                    <th>
                        <div style="padding: 6px 0; font-weight: bold; font-size: 13px; color: #334155;">Örnek Cümle</div>
                    </th>
                    <th>
                        <div style="padding: 6px 0; font-weight: bold; font-size: 13px; color: #334155;">Bulunduğu Dosyalar (Top: ${totalFilesOccurrencesSum})</div>
                        <input type="text" id="f_files" class="filter-input" placeholder="Dosya filtrele..." onkeyup="filterTable()">
                    </th>
                </tr>`;
        }

        resultArea.innerHTML = `
            <div class="sticky-summary">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;">
                    <h4 style="margin: 0;">📊 ${state.task.toUpperCase()} Analiz Özeti (${fileCount} Dosya İncelendi)</h4>
                    <button type="button" class="btn-print" onclick="window.print()">🖨️ Sayfayı Renkli Yazdır / PDF Kaydet</button>
                </div>
                <div style="display: flex; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; font-size: 13px; align-items: center;">
                    <div style="background: #f3f4f6; padding: 6px 10px; border-radius: 6px;">Toplam Taranan Birim: <strong>${totalCheckedCount}</strong></div>
                    <div style="background: #eef2f7; padding: 6px 10px; border-radius: 6px;">Benzersiz Kelime: <strong>${globalTableData.length}</strong></div>
                    <div style="background: #e0f2fe; color: #0369a1; padding: 6px 10px; border-radius: 6px;">Toplam Dosya Sayısı: <strong>${totalFilesCountSum}</strong></div>
                    <div style="background: #dbeafe; color: #1e40af; padding: 6px 10px; border-radius: 6px;">Toplam Dosya Kaydı: <strong>${totalFilesOccurrencesSum}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">A1: <strong>${levelCounts['A1']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">A2: <strong>${levelCounts['A2']}</strong></div>
                    <div style="background: #bfdbfe; padding: 6px 10px; border-radius: 6px;">B1: <strong>${levelCounts['B1']}</strong></div>
                    <div style="background: #93c5fd; padding: 6px 10px; border-radius: 6px;">B2: <strong>${levelCounts['B2']}</strong></div>
                    <div style="background: #fecaca; padding: 6px 10px; border-radius: 6px;">C1: <strong>${levelCounts['C1']}</strong></div>
                    <div style="background: #fca5a5; padding: 6px 10px; border-radius: 6px;">C2: <strong>${levelCounts['C2']}</strong></div>
                    <div style="background: #fef3c7; padding: 6px 10px; border-radius: 6px;">Bilinmiyor: <strong>${levelCounts['Bilinmiyor']}</strong></div>
                </div>
            </div>

            <div class="table-container">
                <table id="analysisTable">
                    <thead>${tableHeaderHtml}</thead>
                    <tbody>${tableRows}</tbody>
                </table>
            </div>
        `;
    }

    function filterTable() {
        const table = document.getElementById("analysisTable");
        if (!table) return;
        const trs = table.tBodies[0].getElementsByTagName("tr");
        let fWord = document.getElementById("f_word") ? document.getElementById("f_word").value.toLowerCase().trim() : "";
        let fLevel = document.getElementById("f_level") ? document.getElementById("f_level").value.toLowerCase().trim() : "";
        let fFiles = document.getElementById("f_files") ? document.getElementById("f_files").value.toLowerCase().trim() : "";

        for (let i = 0; i < trs.length; i++) {
            let cells = trs[i].cells;
            let wText = cells[1].innerText.toLowerCase();
            let lText = cells[2].innerText.toLowerCase();
            let fText = trs[i].getAttribute("data-files").toLowerCase();
            let match = true;

            if (fWord && !wText.includes(fWord)) match = false;
            if (fLevel && !lText.includes(fLevel)) match = false;
            if (fFiles && !fText.includes(fFiles)) match = false;

            trs[i].style.display = match ? "" : "none";
        }
    }
</script>
