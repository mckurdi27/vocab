<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Dil Analiz Paneli</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 20px; background-color: #f4f7f6; color: #2c3e50; }
        .panel-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .home-btn { background: #7f8c8d; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .action-area { display: none; margin-top: 20px; padding-top: 20px; border-top: 2px solid #ecf0f1; }
        .action-area.active { display: block; }
        .mode-btn { background: #eee; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-right: 5px; margin-bottom: 5px; font-weight: bold; }
        .mode-btn.active { background: #3498db; color: white; }
        select, button, input[type="file"] { padding: 10px; border-radius: 5px; border: 1px solid #ccc; margin-top: 5px; }
        .execute-btn { background: #27ae60; color: white; cursor: pointer; }
        #status { margin-top: 15px; font-weight: bold; color: #d35400; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #34495e; color: white; }
        #textOutputContainer { display: none; margin-top: 20px; }
        textarea { width: 100%; height: 200px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="panel-card">
    <div class="header-top">
        <h2>🚀 Gelişmiş Dil Analiz Paneli</h2>
        <a href="index.html" class="home-btn">🏠 Ana Ekrana Dön</a>
    </div>

    <div class="mode-buttons">
        <button class="mode-btn active" onclick="switchMode('bulkAnalysis', this)">📊 Gelişmiş JSON Analiz</button>
        <button class="mode-btn" onclick="switchMode('dictionary', this)">📖 Sözlük (PDF)</button>
        <button class="mode-btn" onclick="switchMode('txtConverter', this)">📄 PDF to TXT</button>
        <button class="mode-btn" onclick="switchMode('ocrScanner', this)">🖼️ OCR</button>
    </div>

    <!-- Gelişmiş Analiz Modu -->
    <div id="bulkAnalysis" class="action-area active">
        <p><b>Analiz Hedefi:</b></p>
        <select id="scanTarget">
            <option value="story_en">İngilizce Hikaye</option>
            <option value="story_tr">Türkçe Hikaye</option>
            <option value="words">Kelime Listesi (words)</option>
            <option value="questions">Soru Bankası</option>
        </select>
        <select id="wordCategory">
            <option value="all">Tüm Türler</option>
            <option value="verb">Fiiller</option>
            <option value="noun">İsimler</option>
            <option value="adjective">Sıfatlar</option>
            <option value="adverb">Zarflar</option>
        </select>
        <br><br>
        <button class="execute-btn" onclick="runAdvancedAnalysis()">Analizi Başlat</button>
    </div>

    <!-- Sözlük Modu -->
    <div id="dictionary" class="action-area">
        <input type="file" id="dictFile" accept=".pdf"><br>
        <button class="execute-btn" onclick="runDictionary()">Sözlüğü Analiz Et</button>
    </div>

    <!-- TXT Dönüştürücü Modu -->
    <div id="txtConverter" class="action-area">
        <input type="file" id="txtFile" accept=".pdf"><br>
        <button class="execute-btn" onclick="runTxtConverter()">Metne Dönüştür ve İndir</button>
    </div>

    <!-- OCR Modu -->
    <div id="ocrScanner" class="action-area">
        <input type="file" id="ocrFile" accept=".pdf,.jpg,.png"><br>
        <button class="execute-btn" onclick="runEnhancedOcr()">OCR ile Metne Çevir</button>
    </div>

    <div id="status"></div>
</div>

<div id="textOutputContainer" class="panel-card" style="display:none; margin-top:20px;">
    <h3>Çıktı Metni:</h3>
    <textarea id="outputTextArea" readonly></textarea>
</div>

<table id="analysisTable" style="display:none;">
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function switchMode(id, btn) {
        document.querySelectorAll('.action-area').forEach(a => a.classList.remove('active'));
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        document.getElementById('status').innerText = "";
        document.getElementById('analysisTable').style.display = 'none';
        document.getElementById('textOutputContainer').style.display = 'none';
    }

    async function extractPdfText(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        let fullText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(it => it.str).join(" ") + " ";
        }
        return fullText;
    }

    async function runAdvancedAnalysis() {
        const target = document.getElementById('scanTarget').value;
        const category = document.getElementById('wordCategory').value;
        document.getElementById('status').innerText = "Analiz ediliyor...";
        
        let wordCounts = {};
        try {
            const response = await fetch('data/index.json');
            const fileList = await response.json();

            for (let fileName of fileList) {
                try {
                    const res = await fetch(`data/${fileName}`);
                    const json = await res.json();

                    if (target === 'words') {
                        if (json.words) {
                            json.words.forEach(item => {
                                if (category === 'all' || item.type === category) {
                                    let w = item.word.toLowerCase();
                                    wordCounts[w] = (wordCounts[w] || 0) + 1;
                                }
                            });
                        }
                    } else {
                        let text = (target === 'story_en') ? json.story_en : 
                                   (target === 'story_tr') ? json.story_tr : 
                                   JSON.stringify(json.questions);
                        let words = text.toLowerCase().match(/\b[a-zçğıöşü]{3,}\b/g) || [];
                        words.forEach(w => { wordCounts[w] = (wordCounts[w] || 0) + 1; });
                    }
                } catch (e) { console.warn("Hata: " + fileName); }
            }

            renderTable(['Kelime / İfade', 'Frekans'], Object.entries(wordCounts).sort((a,b) => b[1] - a[1]));
        } catch (err) {
            document.getElementById('status').innerText = "Hata: data/index.json okunamadı!";
        }
    }

    async function runDictionary() {
        const file = document.getElementById('dictFile').files[0];
        if (!file) { alert("Lütfen PDF seçin!"); return; }
        document.getElementById('status').innerText = "Sözlük okunuyor...";
        
        const text = await extractPdfText(file);
        const matches = [...text.matchAll(/([a-zA-Zçğıöşü]+)\s*\(([^)]+)\)\s*[:]?\s*([^.]+?\.)/gi)];
        renderTable(['Kelime', 'Tür', 'Anlam'], matches.map(m => [m[1], m[2], m[3]]));
        document.getElementById('status').innerText = "Sözlük tarandı!";
    }

    async function runTxtConverter() {
        const file = document.getElementById('txtFile').files[0];
        if (!file) { alert("Lütfen bir PDF seçin!"); return; }
        document.getElementById('status').innerText = "Metne dönüştürülüyor...";

        const text = await extractPdfText(file);
        document.getElementById('outputTextArea').value = text;
        document.getElementById('textOutputContainer').style.display = 'block';
        
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = file.name.replace(/\.[^/.]+$/, "") + "_metin.txt"; a.click();
        document.getElementById('status').innerText = "Metin başarıyla indirildi!";
    }

    async function runEnhancedOcr() {
        const file = document.getElementById('ocrFile').files[0];
        if (!file) { alert("Lütfen dosya seçin!"); return; }
        document.getElementById('status').innerText = "OCR taraması yapılıyor, lütfen bekleyin...";
        
        const result = await Tesseract.recognize(file, 'eng+tur');
        document.getElementById('outputTextArea').value = result.data.text;
        document.getElementById('textOutputContainer').style.display = 'block';
        document.getElementById('status').innerText = "OCR Tamamlandı!";
    }

    function renderTable(headers, data) {
        const head = document.getElementById('tableHead');
        const body = document.getElementById('tableBody');
        head.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;
        body.innerHTML = data.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('');
        document.getElementById('analysisTable').style.display = 'table';
        document.getElementById('textOutputContainer').style.display = 'none';
        document.getElementById('status').innerText = "İşlem Tamamlandı!";
    }
</script>
</body>
</html>
