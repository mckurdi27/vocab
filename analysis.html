<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Dil Analiz Paneli</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; color: #1e293b; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-home { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background-color: #4f46e5; color: #ffffff; border-radius: 6px; text-decoration: none; font-weight: 500; transition: background-color 0.2s ease; border: none; cursor: pointer; }
        .btn-home:hover { background-color: #4338ca; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        button { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-weight: 500; }
        .active-btn { background: #27ae60 !important; color: white; border: none; }
        
        .table-container { max-height: 480px; overflow-y: auto; margin-top: 10px; border: 1px solid #ddd; border-radius: 6px; position: relative; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        
        th { background: #f1f5f9; color: #0f172a; user-select: none; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1); }
        th.sortable { cursor: pointer; transition: background 0.2s; }
        th.sortable:hover { background: #e2e8f0; }
        
        .status-bar { padding: 10px; border-radius: 4px; margin-top: 10px; background: #eef2f7; }
        .input-box { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, input[type="file"] { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; }
        select { width: 380px; }
        .badge-unique { background: #d1fae5; color: #065f46; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .badge-diff { background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; margin-left: 5px; }
        .file-list-tag { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 11px; display: inline-block; margin: 1px; font-family: monospace; }
        .dynamic-input-container { margin-top: 15px; padding: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; }
        .filter-input { width: 90%; padding: 4px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 3px; margin-top: 4px; font-weight: normal; }
        .sticky-summary { position: sticky; top: 0; z-index: 20; background: #ffffff; padding: 10px 0; border-bottom: 2px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="header-left">
        <h2 style="margin: 0;">Gelişmiş Dil Analiz Paneli</h2>
    </div>
    <a href="index.html" class="btn-home">⬅️ Ana Sayfaya Dön</a>
</div>

<div class="section">
    <h3>1. Kaynak ve Kapsam Seçimi</h3>
    <div class="input-box" style="margin-top: 5px; margin-bottom: 15px;">
        <label for="jsonSelect"><strong>Hedef JSON Dosyası / Grubu:</strong></label>
        <select id="jsonSelect">
            <option value="ALL">📁 Tüm Dosyaları Tara (Tüm Seviyeler)</option>
        </select>
    </div>

    <div class="dynamic-input-container">
        <label><strong>📌 Referans CSV Sözlüğü Yükle (headword,CEFR,Turkish):</strong></label><br>
        <input type="file" id="csvFile" accept=".csv" style="margin-top: 8px;">
        <span id="csvStatus" style="font-size: 12px; color: #666; margin-left: 10px;">(Yüklenmediyse JSON içerisindeki seviyeler baz alınır)</span>
    </div>
</div>

<div class="section">
    <h3>2. İşlem Türü (Analiz Modu)</h3>
    <div class="btn-group">
        <button onclick="setTask('hikaye', this)">📖 Hikaye Metni Analizi (story_en)</button>
        <button onclick="setTask('kelimeler', this)" class="active-btn">📋 50 Kelime Listesi Analizi (words)</button>
        <button onclick="setTask('cevir', this)">🔤 Çeviri / Sözlük Detayı</button>
    </div>
    <div id="taskDetails" style="font-size: 13px; color: #555;">Mod: Sahneye ait bağımsız "words" listesindeki kelimeler incelenir.</div>
</div>

<div class="section">
    <h3>3. Analiz Sonucu</h3>
    <button onclick="runAnalysis()" style="background: #4f46e5; color: white; font-weight: bold; padding: 12px 20px; border: none; border-radius: 6px; cursor:pointer;">🚀 Analizi Çalıştır</button>
    <div id="status" class="status-bar">Sistem hazır. CSV referanslı doğrulama modu aktif.</div>
    <div id="resultArea" style="margin-top:20px;"></div>
</div>

<script>
    const fileConfigs = [
        { prefix: 'a', start: 101, end: 150, label: 'A1' },
        { prefix: 'a', start: 201, end: 250, label: 'A2' },
        { prefix: 'b', start: 101, end: 150, label: 'B1' },
        { prefix: 'b', start: 201, end: 250, label: 'B2' },
        { prefix: 'c', start: 101, end: 150, label: 'C1' },
        { prefix: 'c', start: 201, end: 250, label: 'C2' }
    ];

    let globalCsvDictionary = {}; // CSV'den okunan kelime -> { cefr, turkish } haritası

    window.addEventListener('DOMContentLoaded', () => {
        const selectEl = document.getElementById('jsonSelect');
        fileConfigs.forEach(cfg => {
            let optgroup = document.createElement('optgroup');
            optgroup.label = `Seviye ${cfg.label} (${cfg.prefix}${cfg.start}.json - ${cfg.prefix}${cfg.end}.json)`;
            
            let groupAllOpt = document.option ? document.option : document.createElement('option');
            groupAllOpt.value = `GROUP_${cfg.label}`;
            groupAllOpt.textContent = `🌟 Seviye ${cfg.label} Tümünü Seç (50 Dosya)`;
            groupAllOpt.style.fontWeight = "bold";
            groupAllOpt.style.color = "#4f46e5";
            optgroup.appendChild(groupAllOpt);

            for (let i = cfg.start; i <= cfg.end; i++) {
                let opt = document.createElement('option');
                opt.value = `data/${cfg.prefix}${i}.json`;
                opt.textContent = `data/${cfg.prefix}${i}.json`;
                optgroup.appendChild(opt);
            }
            selectEl.appendChild(optgroup);
        });

        // CSV Dosyası Okuma Dinleyicisi
        document.getElementById('csvFile').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(evt) {
                parseCSV(evt.target.result);
            };
            reader.readAsText(file, 'UTF-8');
        });
    });

    function parseCSV(text) {
        globalCsvDictionary = {};
        let lines = text.split(/\r\n|\n/);
        let count = 0;
        
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            
            // Basit CSV ayırıcı (tırnak içindeki virgülleri bozmamak için temel split)
            let parts = line.split(',');
            if (parts.length >= 2) {
                let headword = parts[0].trim().toLowerCase();
                let cefr = parts[1].trim().toUpperCase();
                let turkish = parts.slice(2).join(',').trim(); // Geri kalanlar Türkçe anlam olabilir
                
                // Eğer ilk satır başlık ('headword') ise atla
                if (i === 0 && headword === 'headword') continue;

                if (headword && cefr) {
                    globalCsvDictionary[headword] = { cefr: cefr, turkish: turkish };
                    count++;
                }
            }
        }
        document.getElementById('csvStatus').innerText = `✅ Başarıyla yüklendi (${count} kelime referansı alındı).`;
        document.getElementById('csvStatus').style.color = "#059669";
        document.getElementById('csvStatus').style.fontWeight = "bold";
    }

    let state = { task: 'kelimeler' };
    let globalTableData = [];
    let fileCountToProcess = 1;
    let currentSortColumn = 'original';
    let currentSortOrder = 'asc';

    function setTask(t, btn) {
        state.task = t;
        btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
    }

    async function runAnalysis() {
        const statusDiv = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        statusDiv.innerText = "JSON dosyaları taranıyor ve CSV ile kıyaslanıyor...";
        resultArea.innerHTML = "";
        
        try {
            let rawJsonDataArray = [];
            const selectedTarget = document.getElementById('jsonSelect').value;

            if (selectedTarget === "ALL") {
                for (let cfg of fileConfigs) {
                    for (let i = cfg.start; i <= cfg.end; i++) {
                        let fileName = `data/${cfg.prefix}${i}.json`;
                        try {
                            let res = await fetch(fileName);
                            if (res.ok) {
                                let jsonData = await res.json();
                                rawJsonDataArray.push({ sourceName: `${cfg.prefix}${i}.json`, data: jsonData, defaultLevel: cfg.label });
                            }
                        } catch (e) {}
                    }
                }
            } else if (selectedTarget.startsWith("GROUP_")) {
                let targetLabel = selectedTarget.replace("GROUP_", "");
                let targetCfg = fileConfigs.find(c => c.label === targetLabel);
                if (targetCfg) {
                    for (let i = targetCfg.start; i <= targetCfg.end; i++) {
                        let fileName = `data/${targetCfg.prefix}${i}.json`;
                        try {
                            let res = await fetch(fileName);
                            if (res.ok) {
                                let jsonData = await res.json();
                                rawJsonDataArray.push({ sourceName: `${targetCfg.prefix}${i}.json`, data: jsonData, defaultLevel: targetCfg.label });
                            }
                        } catch (e) {}
                    }
                }
            } else {
                try {
                    let res = await fetch(selectedTarget);
                    if (res.ok) {
                        let jsonData = await res.json();
                        let detectedLevel = 'Bilinmiyor';
                        fileConfigs.forEach(cfg => {
                            if (selectedTarget.includes(`/${cfg.prefix}`)) detectedLevel = cfg.label;
                        });
                        rawJsonDataArray.push({ sourceName: selectedTarget.split('/').pop(), data: jsonData, defaultLevel: detectedLevel });
                    }
                } catch (e) {}
            }

            if (rawJsonDataArray.length === 0) throw new Error("Seçilen JSON dosyası(arı) bulunamadı.");

            fileCountToProcess = rawJsonDataArray.length;
            let itemTracking = {};
            let totalCheckedCount = 0;

            rawJsonDataArray.forEach(itemObj => {
                let fName = itemObj.sourceName;
                let data = itemObj.data;
                let jsonFileLevel = (data.level && data.level.trim() !== '') ? data.level.toUpperCase().trim() : itemObj.defaultLevel;

                let list = data.words && Array.isArray(data.words) ? data.words : [];
                list.forEach(item => {
                    let wordStr = item.word || '';
                    if (wordStr) {
                        let cleanW = wordStr.trim().toLowerCase();
                        totalCheckedCount++;

                        // CSV Kıyaslama Mantığı:
                        // Eğer CSV sözlüğü yüklendiyse, kelimenin gerçek seviyesini CSV'den alıyoruz.
                        // CSV'de yoksa JSON'daki seviyeyi yedek olarak kullanıyoruz.
                        let finalLevel = jsonFileLevel;
                        let csvMatched = false;
                        if (globalCsvDictionary[cleanW]) {
                            finalLevel = globalCsvDictionary[cleanW].cefr;
                            csvMatched = true;
                        }

                        if (!itemTracking[cleanW]) {
                            itemTracking[cleanW] = { 
                                original: wordStr.trim(), 
                                type: (item.type || '-'), 
                                turkish: (item.turkish || '-'), 
                                files: [], 
                                level: finalLevel,
                                jsonLevel: jsonFileLevel,
                                csvMatched: csvMatched
                            };
                        }
                        if (!itemTracking[cleanW].files.includes(fName)) itemTracking[cleanW].files.push(fName);
                    }
                });
            });

            statusDiv.innerText = `✅ Analiz tamamlandı! İncelenen Birim: ${totalCheckedCount}.`;

            globalTableData = [];
            let levelCounts = { 'A1': 0, 'A2': 0, 'B1': 0, 'B2': 0, 'C1': 0, 'C2': 0, 'Bilinmiyor': 0 };

            for (let cleanW in itemTracking) {
                let info = itemTracking[cleanW];
                let lvl = info.level || 'Bilinmiyor';
                if (levelCounts[lvl] !== undefined) levelCounts[lvl]++;
                else levelCounts['Bilinmiyor']++;

                globalTableData.push({
                    original: info.original,
                    level: lvl,
                    jsonLevel: info.jsonLevel,
                    csvMatched: info.csvMatched,
                    type: info.type,
                    turkish: info.turkish,
                    filesCount: info.files.length,
                    filesList: info.files.sort().join(', ')
                });
            }

            sortData('original', 'asc');
            renderTable(totalCheckedCount, fileCountToProcess, levelCounts);

        } catch (err) {
            statusDiv.innerText = "❌ Hata: " + err.message;
        }
    }

    function sortData(column, order) {
        currentSortColumn = column;
        currentSortOrder = order;
        globalTableData.sort((a, b) => {
            let valA = a[column] !== undefined ? a[column] : '';
            let valB = b[column] !== undefined ? b[column] : '';
            if (typeof valA === 'string') valA = valA.toLowerCase();
            if (typeof valB === 'string') valB = valB.toLowerCase();

            if (valA < valB) return order === 'asc' ? -1 : 1;
            if (valA > valB) return order === 'asc' ? 1 : -1;
            return 0;
        });
    }

    function handleSort(column) {
        let newOrder = (currentSortColumn === column && currentSortOrder === 'asc') ? 'desc' : 'asc';
        sortData(column, newOrder);
        
        let levelCounts = { 'A1': 0, 'A2': 0, 'B1': 0, 'B2': 0, 'C1': 0, 'C2': 0, 'Bilinmiyor': 0 };
        globalTableData.forEach(item => {
            if (levelCounts[item.level] !== undefined) levelCounts[item.level]++;
            else levelCounts['Bilinmiyor']++;
        });
        renderTable(globalTableData.length, fileCountToProcess, levelCounts);
    }

    function getArrow(colName) {
        if (currentSortColumn !== colName) return ' ↕';
        return currentSortOrder === 'asc' ? ' 🔼' : ' 🔽';
    }

    function renderTable(totalCheckedCount, fileCount, levelCounts) {
        const resultArea = document.getElementById('resultArea');
        let tableRows = '';
        
        globalTableData.forEach((item, index) => {
            let fileBadge = `<span class="badge-unique">✔ ${item.filesCount} dosya</span>`;
            let fileTagsHtml = item.filesList.split(', ').map(f => `<span class="file-list-tag">${f}</span>`).join(' ');
            
            // Eğer JSON'daki seviye ile CSV'den gelen gerçek seviye uyuşmuyorsa uyarı rozeti gösterelim
            let levelDisplay = item.level;
            if (item.csvMatched && item.jsonLevel !== item.level) {
                levelDisplay += ` <span class="badge-diff" title="JSON'da ${item.jsonLevel} yazıyordu, CSV referansı ile düzeltildi!">JSON: ${item.jsonLevel} ⚠️</span>`;
            }

            tableRows += `<tr>
                <td>${index + 1}</td>
                <td><strong>${item.original}</strong></td>
                <td>${levelDisplay}</td>
                <td><code>${item.type}</code></td>
                <td>${item.turkish}</td>
                <td>${fileBadge}</td>
                <td>${fileTagsHtml}</td>
            </tr>`;
        });

        resultArea.innerHTML = `
            <div class="sticky-summary">
                <h4>📊 Kelime Analiz Özeti (${fileCount} Dosya İncelendi)</h4>
                <div style="display: flex; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; font-size: 13px;">
                    <div style="background: #f3f4f6; padding: 6px 10px; border-radius: 6px;">Toplam Kelime: <strong>${globalTableData.length}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">A1: <strong>${levelCounts['A1']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">A2: <strong>${levelCounts['A2']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">B1: <strong>${levelCounts['B1']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">B2: <strong>${levelCounts['B2']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">C1: <strong>${levelCounts['C1']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">C2: <strong>${levelCounts['C2']}</strong></div>
                </div>
            </div>

            <div class="table-container">
                <table id="analysisTable">
                    <thead>
                        <tr>
                            <th style="width:50px;">#</th>
                            <th class="sortable" onclick="handleSort('original')">Kelime${getArrow('original')}<br><input type="text" id="f_word" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
                            <th class="sortable" onclick="handleSort('level')">Seviye (CSV Referanslı)${getArrow('level')}<br><input type="text" id="f_level" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
                            <th class="sortable" onclick="handleSort('type')">Tür${getArrow('type')}</th>
                            <th class="sortable" onclick="handleSort('turkish')">Türkçe Anlamı${getArrow('turkish')}</th>
                            <th>Kaynak</th>
                            <th>Bulunduğu Dosyalar</th>
                        </tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>
            </div>
        `;
    }

    function filterTable() {
        const table = document.getElementById("analysisTable");
        if (!table) return;
        const trs = table.tBodies[0].getElementsByTagName("tr");
        let fWord = document.getElementById("f_word") ? document.getElementById("f_word").value.toLowerCase().trim() : "";
        let fLevel = document.getElementById("f_level") ? document.getElementById("f_level").value.toLowerCase().trim() : "";

        for (let i = 0; i < trs.length; i++) {
            let cells = trs[i].cells;
            let wText = cells[1].innerText.toLowerCase();
            let lText = cells[2].innerText.toLowerCase();
            let match = true;

            if (fWord && !wText.includes(fWord)) match = false;
            if (fLevel && !lText.includes(fLevel)) match = false;

            trs[i].style.display = match ? "" : "none";
        }
    }
</script>

</body>
</html>
