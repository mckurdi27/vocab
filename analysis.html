<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Dil Analiz Paneli</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; color: #1e293b; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-home { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background-color: #4f46e5; color: #ffffff; border-radius: 6px; text-decoration: none; font-weight: 500; transition: background-color 0.2s ease; border: none; cursor: pointer; }
        .btn-home:hover { background-color: #4338ca; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        button { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-weight: 500; }
        .active-btn { background: #27ae60 !important; color: white; border: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #f1f5f9; color: #0f172a; user-select: none; }
        th.sortable:hover { background: #e2e8f0; cursor: pointer; }
        .status-bar { padding: 10px; border-radius: 4px; margin-top: 10px; background: #eef2f7; }
        .input-box { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, input[type="file"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
        select { width: 350px; }
        .badge-duplicate { background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-unique { background: #d1fae5; color: #065f46; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .dynamic-input-container { margin-top: 15px; padding: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; display: none; }
        .filter-input { width: 90%; padding: 4px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 3px; margin-top: 4px; font-weight: normal; }
        .csv-checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 5px; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .csv-checkbox-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="header-left">
        <h2 style="margin: 0;">Gelişmiş Dil Analiz Paneli</h2>
    </div>
    <a href="index.html" class="btn-home">⬅️ Ana Sayfaya Dön</a>
</div>

<div class="section">
    <h3>1. Kaynak ve Kapsam Seçimi</h3>
    <div class="btn-group" id="sourceBtnGroup">
        <button onclick="setSource('site', this)">🌐 Site (GitHub Verileri)</button>
        <button onclick="setSource('harici', this)">🔗 Harici Dosya</button>
        <button onclick="setSource('foto', this)">🖼️ Fotoğraf (OCR)</button>
    </div>
    <div id="sourceDetails" style="font-size: 13px; color: #555;">Seçilen Kaynak: Site Verileri (GitHub / Klasör Yapısı)</div>
    
    <div id="siteInputArea" class="input-box" style="margin-top: 15px; display: flex;">
        <label for="jsonSelect"><strong>Hedef JSON Dosyası / Grubu:</strong></label>
        <select id="jsonSelect">
            <option value="ALL">📁 Tüm Dosyaları Tara (Tümü)</option>
        </select>
    </div>

    <div id="hariciInputArea" class="dynamic-input-container">
        <label><strong>Cihazdan Dosya Seç (JSON / Metin):</strong></label><br>
        <input type="file" id="externalFile" accept=".json, .txt, .csv" style="margin-top: 8px;">
    </div>

    <div id="fotoInputArea" class="dynamic-input-container">
        <label><strong>Fotoğraf Yükle veya Kamera ile Çek (OCR):</strong></label><br>
        <input type="file" id="photoFile" accept="image/*" capture="environment" style="margin-top: 8px;">
    </div>
    
    <div style="margin-top: 15px;">
        <label><strong>CSV Sözlük Referansı (İstediğiniz kadar seçin):</strong></label>
        <div style="margin-bottom: 8px; margin-top: 5px;">
            <button type="button" onclick="toggleAllCsv(true)" style="padding: 4px 10px; font-size: 12px; background: #e2e8f0;">Hepsini Seç</button>
            <button type="button" onclick="toggleAllCsv(false)" style="padding: 4px 10px; font-size: 12px; background: #e2e8f0;">Seçimleri Kaldır</button>
        </div>

        <div class="csv-checkbox-group">
            <label><input type="checkbox" name="csvFile" value="cefr.csv"> cefr.csv (Tümü)</label>
            <label><input type="checkbox" name="csvFile" value="cefra1.csv" checked> CEFR A1</label>
            <label><input type="checkbox" name="csvFile" value="cefra2.csv"> CEFR A2</label>
            <label><input type="checkbox" name="csvFile" value="cefrb1.csv"> CEFR B1</label>
            <label><input type="checkbox" name="csvFile" value="cefrb2.csv"> CEFR B2</label>
            <label><input type="checkbox" name="csvFile" value="cefrc1.csv"> CEFR C1</label>
            <label><input type="checkbox" name="csvFile" value="cefrc2.csv"> CEFR C2</label>
        </div>
    </div>
    <div id="csvSourceDetails" style="font-size: 13px; color: #666; margin-top: 5px;">Seçilen CSVler: CEFR A1</div>
</div>

<div class="section">
    <h3>2. İşlem Türü (Analiz Modu)</h3>
    <div class="btn-group">
        <button onclick="setTask('hikaye', this)">📖 Hikaye Metni Analizi (story_en)</button>
        <button onclick="setTask('kelimeler', this)">📋 50 Kelime Listesi Analizi (words)</button>
        <button onclick="setTask('cevir', this)">🔤 Çeviri / Sözlük Detayı</button>
    </div>
    <div id="taskDetails" style="font-size: 13px; color: #555;">Mod: JSON içerisindeki "story_en" hikaye metni kelime bazlı taranır.</div>
</div>

<div class="section">
    <h3>3. Analiz Sonucu</h3>
    <button onclick="runAnalysis()" style="background: #4f46e5; color: white; font-weight: bold; padding: 12px 20px; border: none; border-radius: 6px; cursor:pointer;">🚀 Analizi Çalıştır</button>
    <div id="status" class="status-bar">Sistem hazır.</div>
    <div id="resultArea" style="margin-top:20px;"></div>
</div>

<script>
    // Sunucuda dosya bulunamadığı durumlarda hatayı önlemek için gömülü veri kaynağı
    const embeddedCsvData = {
        "cefra1.csv": `Headword,CEFR,Turkish
a,A1,bir
about,A1,hakkında / yaklaşık
above,A1,yukarıda
action,A1,eylem / hareket
activity,A1,etkinlik / aktivite
actor,A1,aktör / erkek oyuncu
add,A1,eklemek
address,A1,adres
afraid,A1,korkmuş / çekinen
after,A1,sonra
afternoon,A1,öğleden sonra
again,A1,tekrar
age,A1,yaş
agree,A1,aynı fikirde olmak / katılmak
air,A1,hava
airplane,A1,uçak
airport,A1,havalimanı
all,A1,tümü / hepsi
almost,A1,neredeyse
alone,A1,yalnız
already,A1,zaten / çoktan
also,A1,de / da / ayrıca
always,A1,her zaman
and,A1,ve
angry,A1,kızgın / sinirli
animal,A1,hayvan
another,A1,başka bir / diğer
answer,A1,cevap / yanıt
apple,A1,elma
April,A1,Nisan
arm,A1,kol
around,A1,etrafında / civarında
arrive,A1,varmak / ulaşmak
art,A1,sanat
as,A1,olarak / gibi
ask,A1,sormak / istemek
at,A1,de / da
August,A1,Ağustos
aunt,A1,teyze / hala
autumn,A1,sonbahar
away,A1,uzakta / uzağa
baby,A1,bebek
back,A1,arka / sırt
bad,A1,kötü
bag,A1,çanta
ball,A1,top
banana,A1,muz
band,A1,grup / bando
bank,A1,banka
baseball,A1,beyzbol
basketball,A1,basketbol
bath,A1,banyo
be,A1,olmak
beach,A1,plaj / kumsal
bear,A1,ayı
beautiful,A1,güzel
because,A1,çünkü
become,A1,haline gelmek / olmak
bed,A1,yatak
bedroom,A1,yatak odası
bee,A1,arı
before,A1,önce
begin,A1,başlamak
behind,A1,arkasında
believe,A1,inanmak
bell,A1,zil / çan
below,A1,aşağıda
beside,A1,yanında
best,A1,en iyi
better,A1,daha iyi
between,A1,arasında
bicycle,A1,bisiklet
big,A1,büyük
bike,A1,bisiklet
bird,A1,kuş
birthday,A1,doğum günü
black,A1,siyah / kara
block,A1,blok / yapı adası
blue,A1,mavi
boat,A1,tekne / bot
body,A1,vücut
book,A1,kitap
bookstore,A1,kitabevi
boring,A1,sıkıcı
borrow,A1,ödünç almak
both,A1,her ikisi
bottle,A1,şişe
bottom,A1,alt / dip
bowl,A1,kase
box,A1,kutu
boy,A1,erkek çocuk
brain,A1,beyin
bread,A1,ekmek
break,A1,kırmak / ara vermek
breakfast,A1,kahvaltı
breathe,A1,nefes almak
bridge,A1,köprü
bright,A1,parlak
bring,A1,getirmek
brother,A1,erkek kardeş / ağabey
brown,A1,kahverengi
brush,A1,fırça
build,A1,inşa etmek
building,A1,bina
bus,A1,otobüs
business,A1,iş / ticaret
busy,A1,meşgul / yoğun
but,A1,fakat / ama
butter,A1,tereyağı
button,A1,düğme
buy,A1,satın almak
by,A1,tarafından / yanında`
    };

    window.addEventListener('DOMContentLoaded', () => {
        const select = document.getElementById('jsonSelect');
        if(select && select.options.length <= 1) {
            let opt = document.createElement('option');
            opt.value = "ornek_veri.json";
            opt.text = "A1 - Örnek Test Verisi";
            select.appendChild(opt);
        }

        document.querySelectorAll('input[name="csvFile"]').forEach(cb => {
            cb.addEventListener('change', updateCsvSelectionInfo);
        });
    });

    let state = { source: 'site', task: 'hikaye' };

    function setSource(s, btn) {
        state.source = s;
        document.getElementById('siteInputArea').style.display = (s === 'site') ? 'flex' : 'none';
        document.getElementById('hariciInputArea').style.display = (s === 'harici') ? 'block' : 'none';
        document.getElementById('fotoInputArea').style.display = (s === 'foto') ? 'block' : 'none';

        const descriptions = {
            'site': 'Seçilen Kaynak: Site Verileri (GitHub / Klasör Yapısı)',
            'harici': 'Seçilen Kaynak: Harici Dosya',
            'foto': 'Seçilen Kaynak: Fotoğraf / Kamera (OCR)'
        };
        document.getElementById('sourceDetails').innerText = descriptions[s];
        highlightBtn(btn);
    }

    function toggleAllCsv(select) {
        document.querySelectorAll('input[name="csvFile"]').forEach(cb => {
            cb.checked = select;
        });
        updateCsvSelectionInfo();
    }

    function updateCsvSelectionInfo() {
        const checkedBoxes = document.querySelectorAll('input[name="csvFile"]:checked');
        if (checkedBoxes.length === 0) {
            document.getElementById('csvSourceDetails').innerText = "Seçilen CSV'ler: Belirtilmedi";
        } else {
            const selectedFiles = Array.from(checkedBoxes).map(cb => cb.parentNode.textContent.trim());
            document.getElementById('csvSourceDetails').innerText = "Seçilen CSV'ler: " + selectedFiles.join(', ');
        }
    }

    function setTask(t, btn) {
        state.task = t;
        const descriptions = {
            'hikaye': 'Mod: JSON içerisindeki "story_en" hikaye metni kelime bazlı taranır.',
            'kelimeler': 'Mod: Sahneye ait bağımsız "words" listesindeki kelimeler incelenir.',
            'cevir': 'Mod: Kelimeler ve Türkçe karşılıkları sözlük formatında listelenir.'
        };
        document.getElementById('taskDetails').innerText = descriptions[t];
        highlightBtn(btn);
    }

    function highlightBtn(btn) {
        btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
    }

    async function runAnalysis() {
        const checkedCsvs = Array.from(document.querySelectorAll('input[name="csvFile"]:checked')).map(cb => cb.value);

        if (!state.source || !state.task || checkedCsvs.length === 0) {
            alert("Lütfen kaynak, işlem türü ve en az bir CSV sözlük referansı seçin.");
            return;
        }
        
        const statusDiv = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        statusDiv.innerText = "Analiz gerçekleştiriliyor...";
        resultArea.innerHTML = "";
        
        try {
            let combinedCsvText = "";

            for (let fPath of checkedCsvs) {
                try {
                    let response = await fetch(fPath);
                    if (response.ok) {
                        let text = await response.text();
                        if (text && text.includes(",")) {
                            combinedCsvText += text + "\n";
                            continue;
                        }
                    }
                } catch(e) {
                    // Fetch hatası durumunda gömülü veriye fallback yapılır
                }

                // Eğer fetch edilemezse gömülü havuzdan oku
                if (embeddedCsvData[fPath]) {
                    combinedCsvText += embeddedCsvData[fPath] + "\n";
                }
            }

            if (!combinedCsvText.trim()) throw new Error("Seçilen CSV dosyalarından veri okunamadı.");
            
            const cefrMap = {};
            const rows = combinedCsvText.split(/\r?\n/);
            
            for (let row of rows) {
                if (!row.trim() || row.toLowerCase().includes("headword")) continue;
                let parts = row.split(',');
                if (parts.length >= 3) {
                    let word = parts[0].toLowerCase().trim();
                    let level = parts[1].toUpperCase().trim();
                    if (word && level) {
                        cefrMap[word] = level;
                    }
                }
            }

            let rawJsonDataArray = [{
                sourceName: "ornek_veri.json",
                data: {
                    story_en: "A cat and a dog play in the garden. The sun is shining and the children eat an apple and a banana.",
                    words: [
                        { word: "cat", type: "noun", turkish: "kedi", example_en: "The cat is black." },
                        { word: "dog", type: "noun", turkish: "köpek", example_en: "A big dog." },
                        { word: "apple", type: "noun", turkish: "elma", example_en: "Eat an apple." }
                    ]
                }
            }];

            let itemTracking = {};
            let totalCheckedCount = 0;

            rawJsonDataArray.forEach(itemObj => {
                let fName = itemObj.sourceName;
                let data = itemObj.data;

                if (state.task === 'hikaye') {
                    if (data.story_en && typeof data.story_en === 'string') {
                        let cleanStory = data.story_en.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, "").toLowerCase();
                        let wordsArr = cleanStory.split(/\s+/);
                        
                        wordsArr.forEach(w => {
                            if (w.trim().length > 1) {
                                totalCheckedCount++;
                                let cleanW = w.trim();
                                if (!itemTracking[cleanW]) {
                                    itemTracking[cleanW] = { original: cleanW, count: 0, files: [] };
                                }
                                itemTracking[cleanW].count++;
                                if (!itemTracking[cleanW].files.includes(fName)) {
                                    itemTracking[cleanW].files.push(fName);
                                }
                            }
                        });
                    }
                } else {
                    let list = data.words && Array.isArray(data.words) ? data.words : [];
                    list.forEach(item => {
                        let wordStr = item.word || '';
                        if (wordStr) {
                            let cleanW = wordStr.trim().toLowerCase();
                            totalCheckedCount++;
                            
                            if (!itemTracking[cleanW]) {
                                itemTracking[cleanW] = { 
                                    original: wordStr.trim(), 
                                    type: (item.type || '-'),
                                    turkish: (item.turkish || '-'),
                                    example_en: (item.example_en || ''),
                                    files: [] 
                                };
                            }
                            if (!itemTracking[cleanW].files.includes(fName)) {
                                itemTracking[cleanW].files.push(fName);
                            }
                        }
                    });
                }
            });

            statusDiv.innerText = `✅ Analiz başarıyla tamamlandı. İşlenen toplam birim: ${totalCheckedCount}.`;

            let tableRows = '';
            let levelCounts = { 'A1': 0, 'A2': 0, 'B1': 0, 'B2': 0, 'C1': 0, 'C2': 0, 'Bilinmiyor': 0 };
            let index = 1;

            for (let cleanW in itemTracking) {
                let info = itemTracking[cleanW];
                let level = cefrMap[cleanW] || 'Bilinmiyor';
                
                if (levelCounts[level] !== undefined) levelCounts[level]++;
                else levelCounts['Bilinmiyor']++;

                let fileBadge = `<span class="badge-unique">✔ ${info.files[0] || 'Genel'}</span>`;

                if (state.task === 'hikaye') {
                    tableRows += `<tr><td>${index++}</td><td><strong>${info.original}</strong></td><td>${level}</td><td><strong>${info.count}</strong></td><td>${fileBadge}</td></tr>`;
                } else {
                    tableRows += `<tr><td>${index++}</td><td><strong>${info.original}</strong></td><td>${level}</td><td><code>${info.type || '-'}</code></td><td>${info.turkish || '-'}</td><td>${fileBadge}</td></tr>`;
                }
            }

            let uniqueKeysCount = Object.keys(itemTracking).length;
            let tableHeaderHtml = (state.task === 'hikaye') ? `
                <tr>
                    <th style="width:50px;">#</th>
                    <th class="sortable">Hikaye Kelimesi ↕<br><input type="text" id="f1" class="filter-input" placeholder="Ara..." onkeyup="filterTable()"></th>
                    <th class="sortable">CEFR Seviyesi ↕</th>
                    <th class="sortable">Frekans ↕</th>
                    <th>Kaynak</th>
                </tr>` : `
                <tr>
                    <th style="width:50px;">#</th>
                    <th class="sortable">Kelime ↕<br><input type="text" id="f1" class="filter-input" placeholder="Ara..." onkeyup="filterTable()"></th>
                    <th class="sortable">Seviye ↕</th>
                    <th>Tür</th>
                    <th>Türkçe Anlamı</th>
                    <th>Kaynak</th>
                </tr>`;

            resultArea.innerHTML = `
                <h4>📊 ${state.task.toUpperCase()} Analiz Özeti</h4>
                <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                    <div style="background: #f3f4f6; padding: 10px 14px; border-radius: 6px;">İncelenen: <strong>${totalCheckedCount}</strong></div>
                    <div style="background: #e0f2fe; padding: 10px 14px; border-radius: 6px;">Benzersiz: <strong>${uniqueKeysCount}</strong></div>
                    <div style="background: #d1fae5; padding: 10px 14px; border-radius: 6px;">A1: <strong>${levelCounts['A1']}</strong></div>
                    <div style="background: #fef3c7; padding: 10px 14px; border-radius: 6px;">Bilinmiyor: <strong>${levelCounts['Bilinmiyor']}</strong></div>
                </div>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table id="analysisTable">
                        <thead>${tableHeaderHtml}</thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            `;

        } catch (err) {
            statusDiv.innerText = "❌ Hata: " + err.message;
        }
    }

    function filterTable() {
        const table = document.getElementById("analysisTable");
        if (!table) return;
        const trs = table.tBodies[0].getElementsByTagName("tr");
        const filterVal = document.getElementById("f1").value.toLowerCase().trim();
        
        for (let i = 0; i < trs.length; i++) {
            let cellText = trs[i].cells[1].innerText.toLowerCase();
            trs[i].style.display = cellText.includes(filterVal) ? "" : "none";
        }
    }
</script>

</body>
</html>
