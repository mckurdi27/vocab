<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Dil Analiz Paneli</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-home { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background-color: #4f46e5; color: #ffffff; border-radius: 6px; text-decoration: none; font-weight: 500; transition: background-color 0.2s ease; border: none; cursor: pointer; }
        .btn-home:hover { background-color: #4338ca; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        button { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
        .active-btn { background: #27ae60 !important; color: white; border: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #eee; }
        .status-bar { padding: 10px; border-radius: 4px; margin-top: 10px; background: #eef2f7; }
        .input-box { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select { padding: 8px; width: 320px; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    </style>
</head>
<body>

<!-- ÜST BİLGİ VE ANA SAYFAYA DÖN BUTONU -->
<div class="header-bar">
    <div class="header-left">
        <h2 style="margin: 0;">Gelişmiş Dil Analiz Paneli</h2>
    </div>
    <a href="index.html" class="btn-home">⬅️ Ana Sayfaya Dön</a>
</div>

<!-- BÖLÜM 1: KAYNAK SEÇİMİ -->
<div class="section">
    <h3>1. Kaynak Seçimi</h3>
    <div class="btn-group">
        <button onclick="setSource('site', this)">🌐 Site (GitHub / Veriler)</button>
        <button onclick="setSource('harici', this)">🔗 Harici Dosya</button>
        <button onclick="setSource('foto', this)">🖼️ Fotoğraf (OCR)</button>
    </div>
    <div id="sourceDetails">Lütfen bir kaynak seçin.</div>
    
    <div class="input-box" style="margin-top: 15px;">
        <label for="jsonSelect"><strong>Hedef JSON Dosyası Seçin:</strong></label>
        <select id="jsonSelect">
            <option value="ALL">📁 Tüm Dosyaları Tara (Tümü)</option>
        </select>
    </div>
    
    <div class="input-box" style="margin-top: 15px;">
        <label><strong>CSV Sözlük Kaynağı:</strong></label>
        <div class="btn-group" id="csvSourceGroup" style="margin-bottom:0;">
            <button onclick="setCsvSource('analiz/cefr.csv', this)">cefr.csv</button>
            <button onclick="setCsvSource('analiz/cefr_pre.csv', this)">cefr_pre.csv</button>
        </div>
    </div>
    <div id="csvSourceDetails" style="font-size: 13px; color: #666; margin-top: 5px;">Seçilen CSV: Belirtilmedi</div>
</div>

<!-- BÖLÜM 2: İŞLEM TÜRÜ -->
<div class="section">
    <h3>2. İşlem Türü</h3>
    <div class="btn-group">
        <button onclick="setTask('frekans', this)">📊 Frekans ve Seviye Analizi</button>
        <button onclick="setTask('seviye', this)">📈 Kelime Kelime Seviye Listesi</button>
        <button onclick="setTask('cevir', this)">🔤 Çeviri / Sözlük</button>
    </div>
    <div id="taskDetails">Lütfen bir işlem türü seçin.</div>
</div>

<!-- BÖLÜM 3: ANALİZ SONUCU -->
<div class="section">
    <h3>3. Analiz Sonucu</h3>
    <button onclick="runAnalysis()" style="background: #4f46e5; color: white; font-weight: bold; padding: 12px 20px; border: none; border-radius: 6px;">🚀 Analizi Çalıştır</button>
    <div id="status" class="status-bar">Sistem hazır.</div>
    <div id="resultArea" style="margin-top:20px;"></div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const select = document.getElementById('jsonSelect');
        const levels = ['a1', 'a2', 'b1', 'b2', 'c1', 'c2'];
        
        levels.forEach(lvl => {
            for (let i = 0; i <= 50; i++) {
                let numStr = i < 10 ? '0' + i : i;
                let fileName = `data/${lvl}${numStr}.json`;
                
                let option = document.createElement('option');
                option.value = fileName;
                option.text = `${lvl.toUpperCase()} Seviyesi - Dosya ${i} (${lvl}${numStr}.json)`;
                select.appendChild(option);
            }
        });
    });

    let state = { source: '', task: '', csvPath: '' };

    function setSource(s, btn) {
        state.source = s;
        document.getElementById('sourceDetails').innerText = "Seçilen Kaynak: " + s;
        highlight(btn);
    }

    function setCsvSource(path, btn) {
        state.csvPath = path;
        document.getElementById('csvSourceDetails').innerText = "Seçilen CSV: " + path;
        highlight(btn);
    }

    function setTask(t, btn) {
        state.task = t;
        document.getElementById('taskDetails').innerText = "Seçilen İşlem: " + t;
        highlight(btn);
    }

    function highlight(btn) {
        btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
    }

    async function runAnalysis() {
        if (!state.source || !state.task || !state.csvPath) {
            alert("Lütfen kaynak, işlem türü ve CSV sözlük kaynağını eksiksiz seçin.");
            return;
        }
        
        const statusDiv = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        const jsonPath = document.getElementById('jsonSelect').value;
        
        statusDiv.innerText = "Analiz gerçekleştiriliyor, veriler yükleniyor...";
        resultArea.innerHTML = "";
        
        try {
            const csvRes = await fetch(state.csvPath);
            if (!csvRes.ok) throw new Error(`${state.csvPath} referans dosyası bulunamadı.`);
            const csvText = await csvRes.text();
            
            const cefrMap = {};
            csvText.split(/\r?\n/).forEach(row => {
                if (!row.trim()) return;
                
                // CSV sütunlarını tırnaklardan temizleyerek ayırıyoruz
                const cols = row.split(',').map(c => c.replace(/^["']|["']$/g, "").trim());
                
                if (cols.length >= 2) {
                    let possibleLevel = cols[0].toUpperCase();
                    let word = "";
                    let level = "";

                    // 1. Sütun Seviye (A1, A2...), 2. Sütun Kelime yapısına göre eşleme
                    if (/^(A1|A2|B1|B2|C1|C2)$/.test(possibleLevel)) {
                        level = possibleLevel;
                        word = cols[1].toLowerCase();
                    } else {
                        for (let c of cols) {
                            if (/^(A1|A2|B1|B2|C1|C2)$/i.test(c)) {
                                level = c.toUpperCase();
                                break;
                            }
                        }
                        if (cols[1]) word = cols[1].toLowerCase();
                    }

                    if (word && level && word !== "kelime" && word !== "seviye") {
                        cefrMap[word] = level;
                    }
                }
            });

            let rawWordsList = [];

            if (jsonPath === 'ALL') {
                const levels = ['a1', 'a2', 'b1', 'b2', 'c1', 'c2'];
                for (let lvl of levels) {
                    for (let i = 0; i <= 50; i++) {
                        let numStr = i < 10 ? '0' + i : i;
                        let fName = `data/${lvl}${numStr}.json`;
                        try {
                            const res = await fetch(fName);
                            if (res.ok) {
                                const data = await res.json();
                                if (Array.isArray(data)) {
                                    rawWordsList.push(...data);
                                } else if (data.words && Array.isArray(data.words)) {
                                    rawWordsList.push(...data.words);
                                } else if (data.kelimeler && Array.isArray(data.kelimeler)) {
                                    rawWordsList.push(...data.kelimeler);
                                }
                            }
                        } catch (e) {}
                    }
                }
            } else {
                const jsonRes = await fetch(jsonPath);
                if (!jsonRes.ok) throw new Error(`${jsonPath} dosyası GitHub deposunda bulunamadı.`);
                const jsonData = await jsonRes.json();

                if (Array.isArray(jsonData)) {
                    rawWordsList = jsonData;
                } else if (jsonData.words && Array.isArray(jsonData.words)) {
                    rawWordsList = jsonData.words;
                } else if (jsonData.kelimeler && Array.isArray(jsonData.kelimeler)) {
                    rawWordsList = jsonData.kelimeler;
                } else {
                    rawWordsList = Object.keys(jsonData);
                }
            }

            statusDiv.innerText = `✅ Analiz başarıyla tamamlandı. Toplam ${rawWordsList.length} öğe incelendi.`;

            let tableRows = '';
            let levelCounts = { 'A1': 0, 'A2': 0, 'B1': 0, 'B2': 0, 'C1': 0, 'C2': 0, 'Bilinmiyor': 0 };

            rawWordsList.forEach((item, index) => {
                let wordStr = '';
                if (typeof item === 'string') {
                    wordStr = item;
                } else if (item) {
                    wordStr = item.word || item.kelime || item.term || item.madde || JSON.stringify(item);
                }

                const cleanWord = wordStr.trim().toLowerCase();
                const level = cefrMap[cleanWord] || 'Bilinmiyor';
                
                if (levelCounts[level] !== undefined) {
                    levelCounts[level]++;
                } else {
                    levelCounts['Bilinmiyor']++;
                }

                tableRows += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${wordStr}</strong></td>
                        <td><span style="padding: 3px 8px; border-radius: 4px; background: ${level === 'Bilinmiyor' ? '#eee' : '#d1fae5'}; color: ${level === 'Bilinmiyor' ? '#333' : '#065f46'}; font-weight: bold;">${level}</span></td>
                    </tr>
                `;
            });

            resultArea.innerHTML = `
                <h4>📊 ${jsonPath === 'ALL' ? 'Tüm Dosyalar (Toplu Tarama)' : jsonPath} - Seviye Dağılım Özeti</h4>
                <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                    <div style="background: #f3f4f6; padding: 10px 14px; border-radius: 6px;">Toplam: <strong>${rawWordsList.length}</strong></div>
                    <div style="background: #d1fae5; padding: 10px 14px; border-radius: 6px;">A1: <strong>${levelCounts['A1']}</strong></div>
                    <div style="background: #a7f3d0; padding: 10px 14px; border-radius: 6px;">A2: <strong>${levelCounts['A2']}</strong></div>
                    <div style="background: #bfdbfe; padding: 10px 14px; border-radius: 6px;">B1: <strong>${levelCounts['B1']}</strong></div>
                    <div style="background: #93c5fd; padding: 10px 14px; border-radius: 6px;">B2: <strong>${levelCounts['B2']}</strong></div>
                    <div style="background: #fecaca; padding: 10px 14px; border-radius: 6px;">C1: <strong>${levelCounts['C1']}</strong></div>
                    <div style="background: #fca5a5; padding: 10px 14px; border-radius: 6px;">C2: <strong>${levelCounts['C2']}</strong></div>
                    <div style="background: #fef3c7; padding: 10px 14px; border-radius: 6px;">Bilinmiyor: <strong>${levelCounts['Bilinmiyor']}</strong></div>
                </div>

                <h4>📝 Kelime Bazlı Seviye Listesi</h4>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 50px;">#</th>
                                <th>Kelime / Madde</th>
                                <th>CEFR Seviyesi</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>
            `;

        } catch (err) {
            statusDiv.innerText = "❌ Hata: " + err.message;
        }
    }
</script>

</body>
</html>
