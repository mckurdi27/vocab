<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Dil Analiz Paneli</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; }
        .active-btn { background: #27ae60; color: white; border: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #eee; }
        .status-bar { padding: 10px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

<!-- BÖLÜM 1: KAYNAK SEÇİMİ -->
<div class="section">
    <h3>1. Kaynak Seçimi</h3>
    <div class="btn-group">
        <button onclick="setSource('site', this)">🌐 Site (GitHub)</button>
        <button onclick="setSource('harici', this)">🔗 Harici Dosya</button>
        <button onclick="setSource('foto', this)">🖼️ Fotoğraf (OCR)</button>
    </div>
    <div id="sourceDetails">Lütfen bir kaynak seçin.</div>
</div>

<!-- BÖLÜM 2: İŞLEM TÜRÜ -->
<div class="section">
    <h3>2. İşlem Türü</h3>
    <div class="btn-group">
        <button onclick="setTask('frekans', this)">📊 Frekans Analizi</button>
        <button onclick="setTask('seviye', this)">📈 Seviye Kontrolü</button>
        <button onclick="setTask('cevir', this)">🔤 Çeviri / Sözlük</button>
    </div>
    <div id="taskDetails">Lütfen bir işlem türü seçin.</div>
</div>

<!-- BÖLÜM 3: ANALİZ SONUCU -->
<div class="section">
    <h3>3. Analiz Sonucu</h3>
    <button onclick="runAnalysis()">🚀 Analizi Çalıştır</button>
    <div id="status" class="status-bar">Sistem hazır.</div>
    <div id="resultArea" style="margin-top:20px;"></div>
</div>

<script>
    let state = { source: '', task: '' };

    function setSource(s, btn) {
        state.source = s;
        document.getElementById('sourceDetails').innerText = "Seçilen Kaynak: " + s;
        highlight(btn);
    }

    function setTask(t, btn) {
        state.task = t;
        document.getElementById('taskDetails').innerText = "Seçilen İşlem: " + t;
        highlight(btn);
    }

    function highlight(btn) {
        btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
    }

    async function runAnalysis() {
        if (!state.source || !state.task) {
            alert("Lütfen hem kaynak hem işlem türü seçin.");
            return;
        }
        
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Analiz ediliyor...";
        
        try {
            // Örnek bir veri çekme (GitHub Pages üzerinden)
            // Hata almamak için hata yönetimi (try-catch) burada şart
            const res = await fetch('cefr.csv'); 
            if (!res.ok) throw new Error("Dosya sunucuda bulunamadı.");
            
            const text = await res.text();
            document.getElementById('resultArea').innerHTML = `<table><tr><th>Analiz</th><th>Değer</th></tr><tr><td>Kaynak</td><td>${state.source}</td></tr><tr><td>Durum</td><td>Başarılı</td></tr></table>`;
            statusDiv.innerText = "✅ Analiz tamamlandı.";
        } catch (err) {
            statusDiv.innerText = "❌ Hata: " + err.message + " (Lütfen dosya yolunun doğruluğunu kontrol edin.)";
        }
    }
</script>

</body>
</html>
