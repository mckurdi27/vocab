<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Dil Analiz Paneli</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; color: #1e293b; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-home { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background-color: #4f46e5; color: #ffffff; border-radius: 6px; text-decoration: none; font-weight: 500; transition: background-color 0.2s ease; border: none; cursor: pointer; }
        .btn-home:hover { background-color: #4338ca; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #333; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        button { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-weight: 500; }
        .active-btn { background: #27ae60 !important; color: white; border: none; }
        
        .table-container { max-height: 480px; overflow-y: auto; margin-top: 10px; border: 1px solid #ddd; border-radius: 6px; position: relative; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        
        th { background: #f1f5f9; color: #0f172a; user-select: none; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1); }
        th.sortable { cursor: pointer; transition: background 0.2s; }
        th.sortable:hover { background: #e2e8f0; }
        
        .status-bar { padding: 10px; border-radius: 4px; margin-top: 10px; background: #eef2f7; }
        .input-box { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, input[type="file"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
        select { width: 380px; }
        .badge-unique { background: #d1fae5; color: #065f46; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .file-list-tag { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 11px; display: inline-block; margin: 1px; font-family: monospace; }
        .dynamic-input-container { margin-top: 15px; padding: 12px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; display: none; }
        .filter-input { width: 90%; padding: 4px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 3px; margin-top: 4px; font-weight: normal; }
        
        .sticky-summary { position: sticky; top: 0; z-index: 20; background: #ffffff; padding: 10px 0; border-bottom: 2px solid #e2e8f0; }
        .csv-checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 5px; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .csv-checkbox-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="header-left">
        <h2 style="margin: 0;">Gelişmiş Dil Analiz Paneli</h2>
    </div>
    <a href="index.html" class="btn-home">⬅️ Ana Sayfaya Dön</a>
</div>

<div class="section">
    <h3>1. Kaynak ve Kapsam Seçimi</h3>
    <div class="btn-group" id="sourceBtnGroup">
        <button onclick="setSource('site', this)" class="active-btn">🌐 Site (GitHub Verileri)</button>
        <button onclick="setSource('harici', this)">🔗 Harici Dosya</button>
        <button onclick="setSource('foto', this)">🖼️ Fotoğraf (OCR)</button>
    </div>
    <div id="sourceDetails" style="font-size: 13px; color: #555;">Seçilen Kaynak: Site Verileri (GitHub / Klasör Yapısı)</div>
    
    <div id="siteInputArea" class="input-box" style="margin-top: 15px; display: flex;">
        <label for="jsonSelect"><strong>Hedef JSON Dosyası / Grubu:</strong></label>
        <select id="jsonSelect">
            <option value="ALL">📁 Tüm Dosyaları Tara (Tüm Seviyeler)</option>
        </select>
    </div>

    <div id="hariciInputArea" class="dynamic-input-container">
        <label><strong>Cihazdan Dosya Seç (JSON / Metin):</strong></label><br>
        <input type="file" id="externalFile" accept=".json, .txt, .csv" style="margin-top: 8px;">
    </div>

    <div id="fotoInputArea" class="dynamic-input-container">
        <label><strong>Fotoğraf Yükle veya Kamera ile Çek (OCR):</strong></label><br>
        <input type="file" id="photoFile" accept="image/*" capture="environment" style="margin-top: 8px;">
    </div>
    
    <div style="margin-top: 15px;">
        <label><strong>CSV Sözlük Referansı (İstediğiniz kadar seçin):</strong></label>
        <div style="margin-bottom: 8px; margin-top: 5px;">
            <button type="button" onclick="toggleAllCsv(true)" style="padding: 4px 10px; font-size: 12px; background: #e2e8f0;">Hepsini Seç</button>
            <button type="button" onclick="toggleAllCsv(false)" style="padding: 4px 10px; font-size: 12px; background: #e2e8f0;">Seçimleri Kaldır</button>
        </div>

        <div class="csv-checkbox-group">
            <label><input type="checkbox" name="csvFile" value="cefr.csv" checked> cefr.csv (Tümü)</label>
            <label><input type="checkbox" name="csvFile" value="cefra1.csv" checked> cefra1</label>
            <label><input type="checkbox" name="csvFile" value="cefra2.csv" checked> cefra2</label>
            <label><input type="checkbox" name="csvFile" value="cefrb1.csv" checked> cefrb1</label>
            <label><input type="checkbox" name="csvFile" value="cefrb2.csv" checked> cefrb2</label>
            <label><input type="checkbox" name="csvFile" value="cefrc1.csv" checked> cefrc1</label>
            <label><input type="checkbox" name="csvFile" value="cefrc2.csv" checked> cefrc2</label>
        </div>
    </div>
    <div id="csvSourceDetails" style="font-size: 13px; color: #666; margin-top: 5px;">Seçilen CSVler: Tümü</div>
</div>

<div class="section">
    <h3>2. İşlem Türü (Analiz Modu)</h3>
    <div class="btn-group">
        <button onclick="setTask('hikaye', this)">📖 Hikaye Metni Analizi (story_en)</button>
        <button onclick="setTask('kelimeler', this)" class="active-btn">📋 50 Kelime Listesi Analizi (words)</button>
        <button onclick="setTask('cevir', this)">🔤 Çeviri / Sözlük Detayı</button>
    </div>
    <div id="taskDetails" style="font-size: 13px; color: #555;">Mod: Sahneye ait bağımsız "words" listesindeki kelimeler incelenir.</div>
</div>

<div class="section">
    <h3>3. Analiz Sonucu</h3>
    <button onclick="runAnalysis()" style="background: #4f46e5; color: white; font-weight: bold; padding: 12px 20px; border: none; border-radius: 6px; cursor:pointer;">🚀 Analizi Çalıştır</button>
    <div id="status" class="status-bar">Sistem hazır.</div>
    <div id="resultArea" style="margin-top:20px;"></div>
</div>

<script>
    const embeddedCsvData = {};

    const fileConfigs = [
        { prefix: 'a', start: 101, end: 150, label: 'A1' },
        { prefix: 'a', start: 201, end: 250, label: 'A2' },
        { prefix: 'b', start: 101, end: 150, label: 'B1' },
        { prefix: 'b', start: 201, end: 250, label: 'B2' },
        { prefix: 'c', start: 101, end: 150, label: 'C1' },
        { prefix: 'c', start: 201, end: 250, label: 'C2' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
        const selectEl = document.getElementById('jsonSelect');
        fileConfigs.forEach(cfg => {
            let optgroup = document.createElement('optgroup');
            optgroup.label = `Seviye ${cfg.label} (${cfg.prefix}${cfg.start}.json - ${cfg.prefix}${cfg.end}.json)`;
            
            let groupAllOpt = document.createElement('option');
            groupAllOpt.value = `GROUP_${cfg.label}`;
            groupAllOpt.textContent = `🌟 Seviye ${cfg.label} Tümünü Seç (50 Dosya)`;
            groupAllOpt.style.fontWeight = "bold";
            groupAllOpt.style.color = "#4f46e5";
            optgroup.appendChild(groupAllOpt);

            for (let i = cfg.start; i <= cfg.end; i++) {
                let opt = document.createElement('option');
                opt.value = `data/${cfg.prefix}${i}.json`;
                opt.textContent = `data/${cfg.prefix}${i}.json`;
                optgroup.appendChild(opt);
            }
            selectEl.appendChild(optgroup);
        });

        document.querySelectorAll('input[name="csvFile"]').forEach(cb => {
            cb.addEventListener('change', updateCsvSelectionInfo);
        });
    });

    let state = { source: 'site', task: 'kelimeler' };
    let globalTableData = [];
    let fileCountToProcess = 1;
    let currentSortColumn = 'original';
    let currentSortOrder = 'asc';

    function setSource(s, btn) {
        state.source = s;
        document.getElementById('siteInputArea').style.display = (s === 'site') ? 'flex' : 'none';
        document.getElementById('hariciInputArea').style.display = (s === 'harici') ? 'block' : 'none';
        document.getElementById('fotoInputArea').style.display = (s === 'foto') ? 'block' : 'none';
        highlightBtn(btn);
    }

    function toggleAllCsv(select) {
        document.querySelectorAll('input[name="csvFile"]').forEach(cb => { cb.checked = select; });
        updateCsvSelectionInfo();
    }

    function updateCsvSelectionInfo() {
        const checkedBoxes = document.querySelectorAll('input[name="csvFile"]:checked');
        const totalBoxes = document.querySelectorAll('input[name="csvFile"]').length;
        if (checkedBoxes.length === 0) {
            document.getElementById('csvSourceDetails').innerText = "Seçilen CSV'ler: Hiçbiri";
        } else if (checkedBoxes.length === totalBoxes) {
            document.getElementById('csvSourceDetails').innerText = "Seçilen CSV'ler: Tümü";
        } else {
            const selectedFiles = Array.from(checkedBoxes).map(cb => cb.parentNode.textContent.trim());
            document.getElementById('csvSourceDetails').innerText = "Seçilen CSV'ler: " + selectedFiles.join(', ');
        }
    }

    function setTask(t, btn) {
        state.task = t;
        highlightBtn(btn);
    }

    function highlightBtn(btn) {
        btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
    }

    async function runAnalysis() {
        const checkedCsvs = Array.from(document.querySelectorAll('input[name="csvFile"]:checked')).map(cb => cb.value);
        if (!state.source || !state.task) {
            alert("Lütfen kaynak ve işlem türü seçin.");
            return;
        }
        
        const statusDiv = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        statusDiv.innerText = "Veriler taranıyor, lütfen bekleyin...";
        resultArea.innerHTML = "";
        
        try {
            const cefrMap = {};
            for (let fPath of checkedCsvs) {
                try {
                    let response = await fetch(fPath);
                    if (response.ok) {
                        let text = await response.text();
                        let rows = text.split(/\r?\n/);
                        for (let row of rows) {
                            if (!row.trim() || row.toLowerCase().includes("headword") || row.toLowerCase().includes("word")) continue;
                            let parts = row.split(',');
                            if (parts.length >= 2) {
                                let wordCol = parts[0].toLowerCase().trim().replace(/^["']|["']$/g, "");
                                let level = parts[1].toUpperCase().trim().replace(/^["']|["']$/g, "");
                                if (wordCol && ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'].includes(level)) {
                                    cefrMap[wordCol] = level;
                                }
                            }
                        }
                    }
                } catch(e) {}
            }

            let rawJsonDataArray = [];
            const selectedTarget = document.getElementById('jsonSelect').value;

            if (selectedTarget === "ALL") {
                statusDiv.innerText = "data/ klasöründeki tüm dosyalar taranıyor...";
                for (let cfg of fileConfigs) {
                    for (let i = cfg.start; i <= cfg.end; i++) {
                        let fileName = `data/${cfg.prefix}${i}.json`;
                        try {
                            let res = await fetch(fileName);
                            if (res.ok) {
                                let jsonData = await res.json();
                                rawJsonDataArray.push({ sourceName: `${cfg.prefix}${i}.json`, data: jsonData, defaultLevel: cfg.label });
                            }
                        } catch (e) {}
                    }
                }
            } else if (selectedTarget.startsWith("GROUP_")) {
                let targetLabel = selectedTarget.replace("GROUP_", "");
                let targetCfg = fileConfigs.find(c => c.label === targetLabel);
                if (targetCfg) {
                    statusDiv.innerText = `Seviye ${targetLabel} grubundaki 50 dosya taranıyor...`;
                    for (let i = targetCfg.start; i <= targetCfg.end; i++) {
                        let fileName = `data/${targetCfg.prefix}${i}.json`;
                        try {
                            let res = await fetch(fileName);
                            if (res.ok) {
                                let jsonData = await res.json();
                                rawJsonDataArray.push({ sourceName: `${targetCfg.prefix}${i}.json`, data: jsonData, defaultLevel: targetCfg.label });
                            }
                        } catch (e) {}
                    }
                }
            } else {
                statusDiv.innerText = `${selectedTarget} dosyası taranıyor...`;
                try {
                    let res = await fetch(selectedTarget);
                    if (res.ok) {
                        let jsonData = await res.json();
                        let detectedLevel = 'Bilinmiyor';
                        fileConfigs.forEach(cfg => {
                            if (selectedTarget.includes(`/${cfg.prefix}`)) detectedLevel = cfg.label;
                        });
                        rawJsonDataArray.push({ sourceName: selectedTarget.split('/').pop(), data: jsonData, defaultLevel: detectedLevel });
                    }
                } catch (e) {}
            }

            if (rawJsonDataArray.length === 0) throw new Error("Seçilen JSON dosyası(arı) bulunamadı veya boş.");

            fileCountToProcess = rawJsonDataArray.length;
            let itemTracking = {};
            let totalCheckedCount = 0;

            rawJsonDataArray.forEach(itemObj => {
                let fName = itemObj.sourceName;
                let data = itemObj.data;
                let fallbackLvl = data.level || itemObj.defaultLevel || 'Bilinmiyor';

                if (state.task === 'hikaye') {
                    if (data.story_en && typeof data.story_en === 'string') {
                        let cleanStory = data.story_en.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g, "").toLowerCase();
                        let wordsArr = cleanStory.split(/\s+/);
                        wordsArr.forEach(w => {
                            if (w.trim().length > 1) {
                                totalCheckedCount++;
                                let cleanW = w.trim();
                                if (!itemTracking[cleanW]) itemTracking[cleanW] = { original: cleanW, count: 0, files: [], fallbackLevel: fallbackLvl };
                                itemTracking[cleanW].count++;
                                if (!itemTracking[cleanW].files.includes(fName)) itemTracking[cleanW].files.push(fName);
                            }
                        });
                    }
                } else {
                    let list = data.words && Array.isArray(data.words) ? data.words : [];
                    list.forEach(item => {
                        let wordStr = item.word || '';
                        if (wordStr) {
                            let cleanW = wordStr.trim().toLowerCase();
                            totalCheckedCount++;
                            if (!itemTracking[cleanW]) {
                                itemTracking[cleanW] = { original: wordStr.trim(), type: (item.type || '-'), turkish: (item.turkish || '-'), files: [], fallbackLevel: fallbackLvl };
                            }
                            if (!itemTracking[cleanW].files.includes(fName)) itemTracking[cleanW].files.push(fName);
                        }
                    });
                }
            });

            statusDiv.innerText = `✅ Başarıyla tamamlandı! İncelenen Birim: ${totalCheckedCount}.`;

            globalTableData = [];
            let levelCounts = { 'A1': 0, 'A2': 0, 'B1': 0, 'B2': 0, 'C1': 0, 'C2': 0, 'Bilinmiyor': 0 };

            for (let cleanW in itemTracking) {
                let info = itemTracking[cleanW];
                // Öncelik CSV sözlüğünde, yoksa JSON dosyasının kendi seviyesinde
                let level = cefrMap[cleanW] || info.fallbackLevel || 'Bilinmiyor';
                if (levelCounts[level] !== undefined) levelCounts[level]++;
                else levelCounts['Bilinmiyor']++;

                globalTableData.push({
                    original: info.original,
                    level: level,
                    count: info.count || 1,
                    type: info.type || '-',
                    turkish: info.turkish || '-',
                    filesCount: info.files.length,
                    filesList: info.files.sort().join(', ')
                });
            }

            sortData('original', 'asc');
            renderTable(totalCheckedCount, fileCountToProcess, levelCounts);

        } catch (err) {
            statusDiv.innerText = "❌ Hata: " + err.message;
        }
    }

    function sortData(column, order) {
        currentSortColumn = column;
        currentSortOrder = order;
        globalTableData.sort((a, b) => {
            let valA = a[column] !== undefined ? a[column] : '';
            let valB = b[column] !== undefined ? b[column] : '';
            if (typeof valA === 'string') valA = valA.toLowerCase();
            if (typeof valB === 'string') valB = valB.toLowerCase();

            if (valA < valB) return order === 'asc' ? -1 : 1;
            if (valA > valB) return order === 'asc' ? 1 : -1;
            return 0;
        });
    }

    function handleSort(column) {
        let newOrder = 'asc';
        if (currentSortColumn === column && currentSortOrder === 'asc') {
            newOrder = 'desc';
        }
        sortData(column, newOrder);
        
        let levelCounts = { 'A1': 0, 'A2': 0, 'B1': 0, 'B2': 0, 'C1': 0, 'C2': 0, 'Bilinmiyor': 0 };
        globalTableData.forEach(item => {
            if (levelCounts[item.level] !== undefined) levelCounts[item.level]++;
            else levelCounts['Bilinmiyor']++;
        });
        renderTable(globalTableData.reduce((acc, curr) => acc + curr.count, 0), fileCountToProcess, levelCounts);
    }

    function getArrow(colName) {
        if (currentSortColumn !== colName) return ' ↕ (A-Z)';
        return currentSortOrder === 'asc' ? ' 🔼 (A-Z)' : ' 🔽 (Z-A)';
    }

    function renderTable(totalCheckedCount, fileCount, levelCounts) {
        const resultArea = document.getElementById('resultArea');
        let tableRows = '';
        
        globalTableData.forEach((item, index) => {
            let fileBadge = `<span class="badge-unique">✔ ${item.filesCount} dosya</span>`;
            let fileTagsHtml = item.filesList.split(', ').map(f => `<span class="file-list-tag">${f}</span>`).join(' ');

            if (state.task === 'hikaye') {
                tableRows += `<tr><td>${index + 1}</td><td><strong>${item.original}</strong></td><td>${item.level}</td><td><strong>${item.count}</strong></td><td>${fileBadge}</td><td>${fileTagsHtml}</td></tr>`;
            } else {
                tableRows += `<tr><td>${index + 1}</td><td><strong>${item.original}</strong></td><td>${item.level}</td><td><code>${item.type}</code></td><td>${item.turkish}</td><td>${fileBadge}</td><td>${fileTagsHtml}</td></tr>`;
            }
        });

        let tableHeaderHtml = (state.task === 'hikaye') ? `
            <tr>
                <th style="width:50px;">#</th>
                <th class="sortable" onclick="handleSort('original')">Hikaye Kelimesi${getArrow('original')}<br><input type="text" id="f_word" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
                <th class="sortable" onclick="handleSort('level')">Seviye${getArrow('level')}<br><input type="text" id="f_level" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
                <th class="sortable" onclick="handleSort('count')">Frekans${getArrow('count')}</th>
                <th class="sortable" onclick="handleSort('filesCount')">Kaynak${getArrow('filesCount')}</th>
                <th class="sortable" onclick="handleSort('filesList')">Bulunduğu Dosyalar${getArrow('filesList')}<br><input type="text" id="f_files" class="filter-input" placeholder="Dosya ara..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
            </tr>` : `
            <tr>
                <th style="width:50px;">#</th>
                <th class="sortable" onclick="handleSort('original')">Kelime${getArrow('original')}<br><input type="text" id="f_word" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
                <th class="sortable" onclick="handleSort('level')">Seviye${getArrow('level')}<br><input type="text" id="f_level" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
                <th class="sortable" onclick="handleSort('type')">Tür${getArrow('type')}<br><input type="text" id="f_type" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
                <th class="sortable" onclick="handleSort('turkish')">Türkçe Anlamı${getArrow('turkish')}<br><input type="text" id="f_turkish" class="filter-input" placeholder="Filtrele..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
                <th class="sortable" onclick="handleSort('filesCount')">Kaynak${getArrow('filesCount')}</th>
                <th class="sortable" onclick="handleSort('filesList')">Bulunduğu Dosyalar${getArrow('filesList')}<br><input type="text" id="f_files" class="filter-input" placeholder="Dosya ara..." onkeyup="filterTable()" onclick="event.stopPropagation()"></th>
            </tr>`;

        let uniqueKeysCount = globalTableData.length;

        resultArea.innerHTML = `
            <div class="sticky-summary">
                <h4>📊 ${state.task.toUpperCase()} Analiz Özeti (${fileCount} Dosya İncelendi)</h4>
                <div style="display: flex; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; font-size: 13px;">
                    <div style="background: #f3f4f6; padding: 6px 10px; border-radius: 6px;">İncelenen: <strong>${totalCheckedCount}</strong></div>
                    <div style="background: #e0f2fe; padding: 6px 10px; border-radius: 6px;">Benzersiz: <strong>${uniqueKeysCount}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">A1: <strong>${levelCounts['A1']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">A2: <strong>${levelCounts['A2']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">B1: <strong>${levelCounts['B1']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">B2: <strong>${levelCounts['B2']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">C1: <strong>${levelCounts['C1']}</strong></div>
                    <div style="background: #d1fae5; padding: 6px 10px; border-radius: 6px;">C2: <strong>${levelCounts['C2']}</strong></div>
                    <div style="background: #fef3c7; padding: 6px 10px; border-radius: 6px;">Bilinmiyor: <strong>${levelCounts['Bilinmiyor']}</strong></div>
                </div>
            </div>

            <div class="table-container">
                <table id="analysisTable">
                    <thead>${tableHeaderHtml}</thead>
                    <tbody>${tableRows}</tbody>
                </table>
            </div>
        `;
    }

    function filterTable() {
        const table = document.getElementById("analysisTable");
        if (!table) return;
        const trs = table.tBodies[0].getElementsByTagName("tr");
        
        let fWord = document.getElementById("f_word") ? document.getElementById("f_word").value.toLowerCase().trim() : "";
        let fLevel = document.getElementById("f_level") ? document.getElementById("f_level").value.toLowerCase().trim() : "";
        let fType = document.getElementById("f_type") ? document.getElementById("f_type").value.toLowerCase().trim() : "";
        let fTurkish = document.getElementById("f_turkish") ? document.getElementById("f_turkish").value.toLowerCase().trim() : "";
        let fFiles = document.getElementById("f_files") ? document.getElementById("f_files").value.toLowerCase().trim() : "";

        for (let i = 0; i < trs.length; i++) {
            let cells = trs[i].cells;
            let match = true;

            if (state.task === 'hikaye') {
                let wText = cells[1].innerText.toLowerCase();
                let lText = cells[2].innerText.toLowerCase();
                let fText = cells[5].innerText.toLowerCase();
                if (fWord && !wText.includes(fWord)) match = false;
                if (fLevel && !lText.includes(fLevel)) match = false;
                if (fFiles && !fText.includes(fFiles)) match = false;
            } else {
                let wText = cells[1].innerText.toLowerCase();
                let lText = cells[2].innerText.toLowerCase();
                let tText = cells[3].innerText.toLowerCase();
                let trText = cells[4].innerText.toLowerCase();
                let fText = cells[6].innerText.toLowerCase();

                if (fWord && !wText.includes(fWord)) match = false;
                if (fLevel && !lText.includes(fLevel)) match = false;
                if (fType && !tText.includes(fType)) match = false;
                if (fTurkish && !trText.includes(fTurkish)) match = false;
                if (fFiles && !fText.includes(fFiles)) match = false;
            }

            trs[i].style.display = match ? "" : "none";
        }
    }
</script>
