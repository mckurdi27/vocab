<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Dil Analiz Paneli</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; color: #1e293b; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        button { padding: 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
        .active-btn { background: #27ae60 !important; color: white; border: none; }
        .table-container { max-height: 480px; overflow-y: auto; margin-top: 10px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; position: sticky; top: 0; z-index: 10; padding: 10px; text-align: left; }
        td { border: 1px solid #ddd; padding: 8px; font-size: 14px; }
        .badge-diff { background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .file-list-tag { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin: 1px; }
        .filter-input { width: 90%; padding: 4px; font-size: 12px; border: 1px solid #cbd5e1; margin-top: 4px; }
    </style>
</head>
<body>

<div class="header-bar">
    <h2>Gelişmiş Dil Analiz Paneli</h2>
</div>

<div class="section">
    <h3>1. Ayarlar</h3>
    <select id="jsonSelect"><option value="ALL">📁 Tüm Dosyaları Tara</option></select>
    <div style="margin-top: 15px;">
        <label><strong>📌 Referans CSV Sözlüğü Yükle:</strong></label>
        <input type="file" id="csvFile" accept=".csv">
        <span id="csvStatus" style="font-size: 12px; color: #666;">(Hazır)</span>
    </div>
</div>

<div class="section">
    <h3>2. Analiz</h3>
    <button onclick="runAnalysis()" style="background: #4f46e5; color: white; padding: 12px 20px; border: none; border-radius: 6px;">🚀 Analizi Çalıştır</button>
    <div id="resultArea"></div>
</div>

<script>
    const fileConfigs = [
        { prefix: 'a', start: 101, end: 150, label: 'A1' },
        { prefix: 'a', start: 201, end: 250, label: 'A2' },
        { prefix: 'b', start: 101, end: 150, label: 'B1' },
        { prefix: 'b', start: 201, end: 250, label: 'B2' },
        { prefix: 'c', start: 101, end: 150, label: 'C1' },
        { prefix: 'c', start: 201, end: 250, label: 'C2' }
    ];

    let globalCsvDictionary = {};
    let globalTableData = [];

    // CSV Yükleme
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(evt) {
            const lines = evt.target.result.split(/\r\n|\n/);
            lines.forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 2) {
                    globalCsvDictionary[parts[0].trim().toLowerCase()] = { cefr: parts[1].trim().toUpperCase(), turkish: parts.slice(2).join(',').trim() };
                }
            });
            document.getElementById('csvStatus').innerText = "✅ CSV Başarıyla yüklendi.";
        };
        reader.readAsText(e.target.files[0], 'UTF-8');
    });

    // Başlangıçta Dropdown'u Doldur
    const selectEl = document.getElementById('jsonSelect');
    fileConfigs.forEach(cfg => {
        let optgroup = document.createElement('optgroup');
        optgroup.label = `Seviye ${cfg.label}`;
        for (let i = cfg.start; i <= cfg.end; i++) {
            let opt = document.createElement('option');
            opt.value = `data/${cfg.prefix}${i}.json`;
            opt.textContent = `data/${cfg.prefix}${i}.json`;
            optgroup.appendChild(opt);
        }
        selectEl.appendChild(optgroup);
    });

    async function runAnalysis() {
        const resultArea = document.getElementById('resultArea');
        resultArea.innerHTML = "Analiz ediliyor...";
        
        let itemTracking = {};
        // Örnek: "ALL" seçilirse tüm dosyaları döner
        for (let cfg of fileConfigs) {
            for (let i = cfg.start; i <= cfg.end; i++) {
                try {
                    let res = await fetch(`data/${cfg.prefix}${i}.json`);
                    if (!res.ok) continue;
                    let data = await res.json();
                    
                    data.words.forEach(item => {
                        let cleanW = item.word.toLowerCase().trim();
                        let csvEntry = globalCsvDictionary[cleanW];
                        
                        if (!itemTracking[cleanW]) {
                            itemTracking[cleanW] = {
                                word: item.word,
                                level: csvEntry ? csvEntry.cefr : cfg.label,
                                originalJsonLevel: cfg.label,
                                csvMatched: !!csvEntry,
                                turkish: csvEntry ? csvEntry.turkish : item.turkish,
                                files: [`${cfg.prefix}${i}.json`]
                            };
                        } else {
                            itemTracking[cleanW].files.push(`${cfg.prefix}${i}.json`);
                        }
                    });
                } catch(e) {}
            }
        }
        
        globalTableData = Object.values(itemTracking);
        renderTable();
    }

    function renderTable() {
        let rows = globalTableData.map((item, index) => `
            <tr>
                <td>${index + 1}</td>
                <td><strong>${item.word}</strong></td>
                <td>
                    ${item.level} 
                    ${(item.csvMatched && item.level !== item.originalJsonLevel) ? `<span class="badge-diff">JSON: ${item.originalJsonLevel}⚠️</span>` : ''}
                </td>
                <td>${item.turkish}</td>
                <td>${item.files.map(f => `<span class="file-list-tag">${f}</span>`).join(' ')}</td>
            </tr>
        `).join('');

        document.getElementById('resultArea').innerHTML = `
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>#</th><th>Kelime</th><th>Seviye</th><th>Türkçe</th><th>Dosyalar</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
    }
</script>
</body>
</html>
