<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab App - Global Kelime Haritası</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --duplicate-border: #e74c3c;
            --duplicate-bg: #fdf2f2;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin-bottom: 5px;
            color: #111827;
        }

        header p {
            color: #6b7280;
            margin-top: 0;
        }

        .day-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .day-btn {
            padding: 8px 16px;
            border: none;
            background-color: #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }

        .day-btn.active, .day-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Standart Kelime Kartı Stili */
        .vocab-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .vocab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Tekrarlanan Kelime (Duplicate) Stilleri */
        .vocab-card.is-duplicate {
            border-color: var(--duplicate-border) !important;
            background-color: var(--duplicate-bg);
        }

        /* Sağ Üst Köşedeki Uyarı Rozeti */
        .vocab-card.is-duplicate::after {
            content: "Tekrarlanan";
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--duplicate-border);
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .word-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #111827;
        }

        .word-translation {
            color: #4b5563;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .word-meta {
            font-size: 0.75rem;
            color: #9ca3af;
            border-top: 1px solid #e5e7eb;
            padding-top: 8px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kelime Öğrenme Asistanı</h1>
            <p>Günler Arası Mükerrer Kelime Takip Sistemi</p>
        </header>

        <!-- Günler buraya buton olarak gelecek -->
        <div id="daySelector" class="day-selector"></div>

        <!-- Kelime kartları buraya basılacak -->
        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <script>
        let globalWordMap = {};
        let allDaysFiles = [];

        // 1. Uygulama Başlangıcı (data/days.json olarak güncellendi)
        async function initApp() {
            try {
                const response = await fetch('data/days.json');
                if (!response.ok) throw new Error("days.json bulunamadı");
                
                const data = await response.json();
                
                // Dosya yollarının başında 'data/' olduğundan emin olunuyor
                allDaysFiles = (data.files || data).map(file => {
                    return file.startsWith('data/') ? file : `data/${file}`;
                }); 

                // Arka planda tüm JSON'ları tarayıp global haritayı çıkaralım
                await buildGlobalWordMap(allDaysFiles);

                // Arayüze gün butonlarını basalım
                renderDaySelector(allDaysFiles);

                // İlk günü otomatik yükle
                if (allDaysFiles.length > 0) {
                    loadDayData(allDaysFiles[0]);
                }
            } catch (error) {
                console.error("Başlangıç hatası:", error);
                document.getElementById('cardsContainer').innerHTML = 
                    `<p style="color:red; text-align:center; grid-column:1/-1;">Veriler yüklenemedi. Lütfen data/days.json dosyanızı kontrol edin.</p>`;
            }
        }

        // 2. Global Kelime Haritasını Oluşturan Fonksiyon
        async function buildGlobalWordMap(files) {
            globalWordMap = {};

            for (const file of files) {
                try {
                    const res = await fetch(file);
                    const dayData = await res.json();
                    const wordsList = dayData.words || dayData;

                    wordsList.forEach(item => {
                        const wordKey = (item.word || item.term || "").trim().toLowerCase();
                        if (!wordKey) return;

                        if (!globalWordMap[wordKey]) {
                            globalWordMap[wordKey] = [];
                        }
                        // Kelimenin geçtiği dosyayı listeye ekle
                        if (!globalWordMap[wordKey].includes(file)) {
                            globalWordMap[wordKey].push(file);
                        }
                    });
                } catch (err) {
                    console.error(`${file} taranamadı:`, err);
                }
            }
        }

        // 3. Gün Seçim Butonlarını Oluşturma
        function renderDaySelector(files) {
            const selector = document.getElementById('daySelector');
            selector.innerHTML = '';

            files.forEach((file, index) => {
                const btn = document.createElement('button');
                btn.className = `day-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = `Gün ${index + 1}`;
                btn.onclick = () => {
                    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadDayData(file);
                };
                selector.appendChild(btn);
            });
        }

        // 4. Seçilen Günün Verilerini Yükleme
        async function loadDayData(file) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#6b7280;">Yükleniyor...</p>';

            try {
                const res = await fetch(file);
                const dayData = await res.json();
                const wordsList = dayData.words || dayData;

                container.innerHTML = '';

                wordsList.forEach(item => {
                    const card = createVocabCard(item, file);
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(`${file} yüklenemedi:`, err);
                container.innerHTML = `<p style="color:red; text-align:center; grid-column:1/-1;">Gün verileri yüklenirken hata oluştu.</p>`;
            }
        }

        // 5. Kart Oluşturucu ve Mükerrer (Duplicate) Kontrolü
        function createVocabCard(item, currentFile) {
            const wordKey = (item.word || item.term || "").trim().toLowerCase();
            const appearances = globalWordMap[wordKey] || [];
            
            // Eğer kelime 1'den fazla dosyada/günde geçiyorsa true olur
            const isDuplicate = appearances.length > 1;

            const cardDiv = document.createElement('div');
            cardDiv.className = `vocab-card ${isDuplicate ? 'is-duplicate' : ''}`;

            const wordText = item.word || item.term || '';
            const translationText = item.translation || item.meaning || '';

            cardDiv.innerHTML = `
                <div class="word-title">${wordText}</div>
                <div class="word-translation">${translationText}</div>
                <div class="word-meta">
                    Geçtiği Dosyalar: ${appearances.length > 0 ? appearances.join(', ') : currentFile}
                </div>
            `;

            return cardDiv;
        }

        // Uygulamayı başlat
        initApp();
    </script>
</body>
</html>
