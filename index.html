<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime ve Soru Bankası</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ana Konteyner ve Genel Düzen */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Üst Kontrol Paneli - Modern ve Uyumlu Tasarım */
        .header {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            margin-bottom: 24px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-top h2 {
            margin: 0;
            font-size: 1.25rem;
            color: #0f172a;
            font-weight: 700;
        }

        .analysis-btn {
            background-color: #2563eb;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .analysis-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }

        .selectors-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Seçim Kutuları - Analiz Sayfası ile Birebir Uyumlu */
        .selectors-wrapper select {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            outline: none;
            cursor: pointer;
        }

        .selectors-wrapper select:hover, 
        .selectors-wrapper select:focus {
            background-color: #dbeafe;
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Navigasyon Butonları */
        .nav-arrow-btn {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .nav-arrow-btn:hover {
            background-color: #dbeafe;
            border-color: #93c5fd;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Üst Seçim ve Kontrol Paneli -->
        <header class="header">
            <div class="header-top">
                <h2>Kelime Çalışma Paneli</h2>

                <div class="selectors-wrapper">
                    <!-- Analiz Sayfasıyla Aynı Grup / Seviye Seçimi ("Tüm" Seçeneği Eklendi) -->
                    <select id="groupSelect" onchange="onGroupChange()">
                        <option value="all">Tüm</option>
                        <option value="a1">A1</option>
                        <option value="a2">A2</option>
                        <option value="b1">B1</option>
                        <option value="b2">B2</option>
                        <option value="c1">C1</option>
                        <option value="c2">C2</option>
                    </select>

                    <!-- Dosya Seçimi -->
                    <select id="fileSelect" onchange="onFileSelectChange(this.value)"></select>

                    <!-- Önceki ve Sonraki Butonları (Global Havuz Mantığına Uyarlandı) -->
                    <button type="button" class="nav-arrow-btn" onclick="navigateFile(-1)" title="Önceki Dosya">⬅️ Önceki</button>
                    <button type="button" class="nav-arrow-btn" onclick="navigateFile(1)" title="Sonraki Dosya">Sonraki ➡️</button>

                    <!-- Analiz Sayfalarına Yönlendiren Butonlar -->
                    <a href="analysis.html" class="analysis-btn">📊 Kelime Analizi</a>
                    <a href="analiz.html" class="analysis-btn">📈 Tekrar Analizi</a>
                </div>
            </div>
        </header>

        <!-- JSON Bilgilerinin Gösterileceği Büyük Başlık Alanı -->
        <div id="sceneBanner" class="scene-banner">
            <h3>Yükleniyor...</h3>
        </div>

        <!-- İçerik Alanı -->
        <main id="content" class="word-grid">
            <p>Veriler yükleniyor...</p>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        let allDaysFiles = [];
        let filteredFiles = [];
        let currentIndex = 0;

        // Sayfa açıldığında analiz sayfasındaki gibi tüm dosya havuzunu oluşturuyoruz
        function initIndexApp() {
            allDaysFiles = [];
            const levelsConfig = [
                { letter: 'a', level: 1 },
                { letter: 'a', level: 2 },
                { letter: 'b', level: 1 },
                { letter: 'b', level: 2 },
                { letter: 'c', level: 1 },
                { letter: 'c', level: 2 }
            ];

            levelsConfig.forEach(cfg => {
                for (let i = 0; i <= 50; i++) {
                    let groupNum = i < 10 ? '0' + i : '' + i;
                    let fileNum = cfg.level === 1 ? '1' + groupNum : '2' + groupNum;
                    allDaysFiles.push(`data/${cfg.letter}${fileNum}.json`);
                }
            });

            filteredFiles = [...allDaysFiles];
            updateFileDropdown(filteredFiles);

            if (filteredFiles.length > 0) {
                currentIndex = 0;
                loadDataForFile(filteredFiles[0]);
            }
        }

        function updateFileDropdown(files) {
            const select = document.getElementById('fileSelect');
            select.innerHTML = '';

            files.forEach((file) => {
                const fileName = file.split('/').pop().replace('.json', '').toUpperCase();
                const option = document.createElement('option');
                option.value = file;
                option.textContent = `Dosya: ${fileName}`;
                select.appendChild(option);
            });
        }

        function onGroupChange() {
            const group = document.getElementById('groupSelect').value;
            
            if (group === 'all') {
                filteredFiles = [...allDaysFiles];
            } else {
                let targetLetter = group.charAt(0);
                let levelNum = group.charAt(1);
                
                filteredFiles = allDaysFiles.filter(file => {
                    const fileName = file.split('/').pop(); 
                    const isLetterMatch = fileName.startsWith(targetLetter);
                    const fileCode = fileName.replace('.json', ''); 
                    const isLevelMatch = levelNum === '1' ? fileCode[1] === '1' : fileCode[1] === '2';
                    return isLetterMatch && isLevelMatch;
                });
            }

            updateFileDropdown(filteredFiles);
            if (filteredFiles.length > 0) {
                currentIndex = 0;
                loadDataForFile(filteredFiles[0]);
            } else {
                document.getElementById('content').innerHTML = `<p style="text-align:center; grid-column:1/-1; color:#64748b;">Bu grupta dosya bulunamadı.</p>`;
            }
        }

        function onFileSelectChange(file) {
            if (!file) return;
            currentIndex = filteredFiles.indexOf(file);
            loadDataForFile(file);
        }

        function navigateFile(direction) {
            if (filteredFiles.length === 0) return;
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = filteredFiles.length - 1;
            if (currentIndex >= filteredFiles.length) currentIndex = 0;

            const targetFile = filteredFiles[currentIndex];
            document.getElementById('fileSelect').value = targetFile;
            loadDataForFile(targetFile);
        }

        // app.js içindeki veri yükleme fonksiyonunuzu tetikleyen köprü fonksiyon
        function loadDataForFile(filePath) {
            // Eğer app.js içinde özel bir fonksiyonunuz varsa (Örn: loadSpecificFile(filePath)), onu burada çağırabilirsiniz.
            // Örnek standart uygulama:
            if (typeof loadData === 'function' && window.currentFilePath !== filePath) {
                window.currentFilePath = filePath;
                // app.js dosyanız seçili input değerini okuyorsa onu güncelliyoruz:
                const fileSelect = document.getElementById('fileSelect');
                if(fileSelect) fileSelect.value = filePath;
                loadData();
            }
        }

        // Sayfa yüklendiğinde başlat
        window.addEventListener('DOMContentLoaded', () => {
            initIndexApp();
        });
    </script>
</body>
</html>
