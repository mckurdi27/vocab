<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Kelime ve Soru Bankası</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Kelime Çalışma Paneli</h2>
            <div class="selectors">
                <select id="levelSelect" onchange="generateDayOptions()">
                    <option value="a1">a1 Seviyesi</option>
                    <option value="a2">a2 Seviyesi</option>
                    <option value="b1">b1 Seviyesi</option>
                    <option value="b2">b2 Seviyesi</option>
                    <option value="c1">c1 Seviyesi</option>
                </select>
                <select id="daySelect" onchange="loadData()"></select>
            </div>
        </div>
        <div id="content" class="word-grid">
            <p>Veriler yükleniyor...</p>
        </div>
    </div>

    <!-- Mantık ve seslendirme işlemleri için app.js dosyasını bağlıyoruz -->
    <script src="app.js"></script>
</body>
</html>
