<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime ve Soru Bankası</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Analiz Butonu için eklenen stil (Orijinal tasarımı bozmaz) */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .analysis-btn {
            background-color: #2c3e50;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }
        .analysis-btn:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Üst Seçim ve Kontrol Paneli -->
        <header class="header">
            <div class="header-top">
                <h2>Kelime Çalışma Paneli</h2>
                <!-- Analiz Sayfasına Yönlendiren Buton -->
                <a href="analysis.html" class="analysis-btn">📊 Analiz Sayfası</a>
            </div>
            
            <h2>A1-30 A2-10 B1-50 B2-10 C1-10 blok</h2>

            <div class="selectors">
                <select id="levelSelect" onchange="generateDayOptions()">
                    <option value="a1">a1 Seviyesi</option>
                    <option value="a2">a2 Seviyesi</option>
                    <option value="b1">b1 Seviyesi</option>
                    <option value="b2">b2 Seviyesi</option>
                    <option value="c1">c1 Seviyesi</option>
                </select>
                <select id="daySelect" onchange="loadData()"></select>
            </div>

        </header>

        <!-- JSON Bilgilerinin Gösterileceği Büyük Başlık Alanı (Kelimelerin Üstünde) -->
        <div id="sceneBanner" class="scene-banner">
            <h3>Yükleniyor...</h3>
        </div>

        <!-- İçerik Alanı -->
        <main id="content" class="word-grid">
            <p>Veriler yükleniyor...</p>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
